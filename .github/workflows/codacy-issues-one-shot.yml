name: One-shot public Codacy issue inspection

on:
  push:
    branches:
      - feat/plan-default-base-commit-head
    paths:
      - .github/workflows/codacy-issues-one-shot.yml

permissions: {}

jobs:
  public-codacy-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Codacy issue evidence without credentials
        shell: bash
        run: |
          set -euo pipefail
          for pr in 1002 1003 1004; do
            echo "::group::Codacy PR #${pr}"
            response="$(curl --fail --silent --show-error --location --max-time 25 --retry 2 --header 'Accept: application/json' "https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/${pr}/issues?status=new")"
            echo "${response}" | jq -c '{analyzed, count: (.data | length), pagination}'
            echo "${response}" | jq -c '.data[]? | {file: .commitIssue.filePath, line: .commitIssue.lineNumber, id: .commitIssue.patternInfo.id, title: .commitIssue.patternInfo.title, severity: .commitIssue.patternInfo.severityLevel, message: .commitIssue.message, source: .commitIssue.toolInfo.name}'
            echo "::endgroup::"
          done
