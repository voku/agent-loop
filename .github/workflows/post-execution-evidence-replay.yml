name: LOOP-132 post-execution evidence replay

on:
  pull_request:

jobs:
  stale-evidence-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php -l tools/post-execution-evidence-replay.php
      - name: Run governed A-to-B stale-evidence replay
        run: php tools/post-execution-evidence-replay.php
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-execution-evidence-replay-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/post-execution-evidence-replay/report.json
            build/post-execution-evidence-replay/stale-close.txt
            build/post-execution-evidence-replay/close-b.txt
            build/post-execution-evidence-replay/context.json
            build/post-execution-evidence-replay/consumed-system.md
            build/post-execution-evidence-replay/init-status.txt
            build/post-execution-evidence-replay/.agent-loop/contracts/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/runs/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/recall/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/sessions
