name: Refresh approval baseline owner candidate (one-shot)
on:
  push:
    branches:
      - fix/approval-baseline-classification-scaffold-20261108

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'voku/agent-loop' && github.ref == 'refs/heads/fix/approval-baseline-classification-scaffold-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge current upstream main into this exact feature branch
        run: |
          set -euo pipefail
          git config user.name 'Owner integration CI'
          git config user.email 'owner-integration@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q 'Intermediate drafts must not hide changes' src/Workflow/WorkflowHumanDecisionProjector.php
          grep -q 'previous_was_human_approved' src/Workflow/WorkflowContractApprovalPresentation.php
          grep -q 'function hadHumanApproval' src/Workflow/TaskContract.php
          git rm .github/workflows/refresh-owner-985-once.yml
          git commit -m 'chore(actions): remove completed temporary owner refresh workflow'
          git push origin HEAD:refs/heads/fix/approval-baseline-classification-scaffold-20261108
