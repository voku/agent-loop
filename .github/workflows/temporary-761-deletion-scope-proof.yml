name: Temporary deleted-path maintenance regression proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  deletion-scope-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install exact owner revision without claiming a released tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Actual Git deletion and rename source regression
        run: vendor/bin/phpunit --display-phpunit-deprecations --filter 'SelfShapeMaintenanceApprovalGate|SelfShapeMaintenanceGitHubReader|SelfShapeEvidence'
      - name: Whole repository PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
      - name: Style verification, no automatic edits
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --show-progress=none
      - name: Verify code uses unfiltered NUL-delimited Git changes
        run: |
          grep -F "'git', 'diff', '--name-only', '-z', '--no-renames'" tools/Dogfood/SelfShapeGitChangedPaths.php
          test "$(grep -Fc 'new SelfShapeGitChangedPaths($runner)' tools/self-shape-dogfood.php)" = 2
