name: Temporary Codacy finding diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/codacy-diagnostic-temp.yml'

permissions:
  contents: read

jobs:
  codacy-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact current public Codacy issues
        shell: bash
        run: |
          set -euo pipefail
          for pr in 953 948; do
            printf '\n=== Codacy PR %s current delta ===\n' "$pr"
            data="$(mktemp)"
            status="$(curl --fail-with-body -L -sS --max-time 25 -o "$data" -w '%{http_code}' "https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/${pr}/issues?limit=100")"
            echo "HTTP=$status"
            jq -c '
              (.data // .issues // [])
              | if type=="array" then .[] else empty end
              | select(.deltaType == "Added")
              | .commitIssue as $i
              | {path:$i.filePath,line:$i.lineNumber,category:$i.patternInfo.category,severity:$i.patternInfo.severityLevel,rule:$i.patternInfo.id,message:$i.message}
            ' "$data"
            rm -f "$data"
          done
