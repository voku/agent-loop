name: Prepare 0.17.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.17.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact 0.17.1 release
        shell: bash
        run: |
          set -euo pipefail

          version='0.17.1'
          marker=".release/${version}.json"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; refusing duplicate release." >&2
            exit 1
          fi
          if [[ -e "${marker}" ]]; then
            echo "Release marker ${marker} already exists." >&2
            exit 1
          fi

          grep -Fq '"voku/agent-recall-compiler": "^0.13.11"' composer.json
          grep -Fq '"dev-main": "0.17.x-dev"' composer.json
          grep -Fq 'execute-plan-with-blind-spot-check' docs/agents/PROMPT_PRIMITIVES.md
          grep -Fq 'ref: 0.13.11' .github/workflows/prompt-primitives-candidate.yml

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $unreleased = "## Unreleased\n";
          if (substr_count($text, $unreleased) !== 1) {
              throw new RuntimeException('Unreleased changelog heading is not unique');
          }
          if (str_contains($text, '## 0.17.1 - ')) {
              throw new RuntimeException('0.17.1 changelog section already exists');
          }

          $section = <<<'CHANGELOG'
          ## Unreleased

          ## 0.17.1 - 2026-08-23

          ### Changed

          - Require `voku/agent-recall-compiler ^0.13.11`, making the Recall-owned `execute-plan-with-blind-spot-check` L1 recipe part of the supported Loop release set instead of depending on opportunistic Composer resolution.
          - Document selection of the Recall-owned blind-spot-first execution recipe without copying its semantics into Loop, and move prompt-primitives installed-consumer dogfood to exact released Recall 0.13.11.

          ### CI

          - New release tags must point at a commit whose own `CHANGELOG.md` already contains that release section; existing historical tags remain idempotent when their marker still names the exact immutable target.

          ### Validation

          - PR #273 must pass the repository's PHP 8.3/8.4/8.5 CI, PHPStan/project rules, installed release-set and prompt-primitives dogfood, execution-contract/self-shape checks, and other required branch protection checks before merge.
          - Prompt-primitives dogfood installs exact `agent-recall-compiler 0.13.11`, proves its distributed catalog contains `execute-plan-with-blind-spot-check`, and proves `agent-loop workflow plan` accepts the Recall-owned L1 recipe without a private copy.
          - The `dev-main` alias was independently corrected to `0.17.x-dev` on `main` by commit `0905d82171c9334def2ef08beb52285a82fb3ac8` before this release; it is a release precondition, not a change claimed by PR #273.

          CHANGELOG;

          $updated = str_replace($unreleased, $section, $text);
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Failed to write 0.17.1 changelog');
          }
          PHP

          rm .github/workflows/prepare-0.17.1.yml

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-0.17.1.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.17.1 content'
          target="$(git rev-parse HEAD)"

          mkdir -p .release
          cat > "${marker}" <<JSON
          {
            "target_sha": "${target}",
            "version": "${version}"
          }
          JSON

          git add "${marker}"
          git diff --cached --check
          git commit -m 'release: mark 0.17.1'

          grep -Fq "## ${version} - 2026-08-23" <(git show "${target}:CHANGELOG.md")
          test "$(jq -r '.target_sha' "${marker}")" = "${target}"
          git merge-base --is-ancestor "${target}" HEAD

          git tag -a "${version}" "${target}" -m "agent-loop ${version}"
          git push --atomic origin HEAD:main "refs/tags/${version}"
