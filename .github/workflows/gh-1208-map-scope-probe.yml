name: GH-1208 restore validated candidate and submit independent correctness review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gh-1208-map-scope-probe.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  checks: read
jobs:
  resume:
    if: github.head_ref == 'work/gh-1208-map-scope-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 45b7d6ea5ea71f2df9a7a5ffe3959252137cd9ec
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 15225329619
          merge-multiple: true
          run-id: 46054719122
          github-token: ${{ github.token }}
          path: build/gh-1208/restored
      - name: Restore exact validated tree and original Run
        shell: bash
        run: |
          set -euo pipefail
          root=build/gh-1208
          base=45b7d6ea5ea71f2df9a7a5ffe3959252137cd9ec
          head=8116e00c8b7962aab9e31b73a45648813d619816
          test "$(git rev-parse HEAD)" = "$base"
          git fetch --no-tags origin refs/heads/fix/gh-1208-map-language-acceptance
          test "$(git rev-parse FETCH_HEAD)" = "$head"
          tree="$(git rev-parse "$head^{tree}")"
          test "$tree" = c909eed1422932eb991bdbecf5f7abdd70c8a256
          for file in docs/reference/setup-wizard.md src/Init/InitWizardCommand.php tests/InitWizardCommandTest.php; do
            git show "$head:$file" | cmp - "$root/restored/$file"
            cp "$root/restored/$file" "$file"
            sha256sum "$file"
          done
          cp -a "$root/restored/workflow-state/." .agent-loop/
          task=GH-1208-MAP-LANGUAGE
          jq -e '.revision == 1 and .approved_by == "Lars Moelleken"' ".agent-loop/contracts/$task/contract.json"
          php bin/agent-loop pipeline status "$task" --format=json > "$root/before.json"
          jq -e --arg candidate "git-tree-v1:$base:$tree" '.candidate_revision == $candidate and .current_stage == "correctness-review"' "$root/before.json"
          php bin/agent-loop pipeline stage "$task" --format=json > "$root/correctness-stage.json"
          jq -e '.stage_id == "correctness-review" and .context_id_required and (.expected_artifacts | sort) == ["docs/reference/setup-wizard.md","src/Init/InitWizardCommand.php","tests/InitWizardCommandTest.php"]' "$root/correctness-stage.json"
      - name: Fetch and validate real external correctness evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=build/gh-1208
          head=8116e00c8b7962aab9e31b73a45648813d619816
          gh api "repos/$GITHUB_REPOSITORY/pulls/1210" > "$root/pr.json"
          jq -e --arg head "$head" '.head.sha == $head' "$root/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/7226273434" > "$root/coderabbit-review.json"
          jq -e --arg head "$head" '.user.login == "coderabbitai[bot]" and (.body | contains("No actionable comments were generated in the recent review.")) and (.body | contains("No concrete defect was found")) and (.body | contains("\"coveredCommitId\":\"" + $head + "\""))' "$root/coderabbit-review.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" > "$root/checks.json"
          jq -e '.check_runs | any(.name == "CodeRabbit" and .conclusion == "success" and (.output.summary | contains("1239cea1-582b-4f57-ac2d-787e1abb8b50")))' "$root/checks.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46054875335" > "$root/exact-ci.json"
          jq -e --arg head "$head" '.head_sha == $head and .conclusion == "success"' "$root/exact-ci.json"
      - name: Record external correctness review through the owner CLI
        shell: bash
        run: |
          set -euo pipefail
          root=build/gh-1208
          task=GH-1208-MAP-LANGUAGE
          php bin/agent-loop pipeline submit "$task" --outcome pass \
            --context-id coderabbit-1239cea1-582b-4f57-ac2d-787e1abb8b50 \
            --artifact docs/reference/setup-wizard.md \
            --artifact src/Init/InitWizardCommand.php \
            --artifact tests/InitWizardCommandTest.php \
            --summary 'Independent CodeRabbit review covered exact commit 8116e00c8b7962aab9e31b73a45648813d619816, no actionable comments and no concrete defect, minimal risk. Review https://github.com/voku/agent-loop/pull/1210#issuecomment-7226273434; successful exact-head CI 46054875335. Codacy is a separate unresolved external check, not waived.' \
            --observation 'Codacy reports one minor CodeStyle finding on PR 1210; no line annotation or detailed evidence is accessible from GitHub. Resolve before merge; not a demonstrated correctness defect.' \
            --format=json > "$root/correctness-result.json"
          cat "$root/correctness-result.json"
          php bin/agent-loop pipeline stage "$task" --format=json > "$root/next-stage.json"
          jq '{stage_id,role,context_id_required,expected_artifacts,next_action}' "$root/next-stage.json"
      - name: Preserve original Run after correctness transition
        if: always()
        shell: bash
        run: |
          mkdir -p build/gh-1208
          cp -a .agent-loop build/gh-1208/workflow-state
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gh-1208-correctness-review-state
          path: |
            build/gh-1208/*.json
            build/gh-1208/workflow-state/
          if-no-files-found: error
