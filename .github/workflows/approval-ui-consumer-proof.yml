name: Cross-repo approval UI consumer proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: agent-ui PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out exact owner candidate
        uses: actions/checkout@v7
        with:
          path: agent-loop
          persist-credentials: false

      - name: Check out exact UI consumer candidate
        uses: actions/checkout@v7
        with:
          repository: voku/agent-ui
          ref: d8eeb4ce4f1c1963820592e668d012953b720db1
          path: agent-ui
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Resolve only the local agent-loop owner under test
        working-directory: agent-ui
        run: |
          set -euo pipefail
          composer config --json repositories.agent-loop '{"type":"path","url":"../agent-loop","options":{"symlink":false,"versions":{"voku/agent-loop":"0.20.999"}}}'
          composer update --no-interaction --prefer-dist --no-progress
          composer show voku/agent-loop

      - name: Prove approval integration with real PHPUnit and quality tools
        working-directory: agent-ui
        run: |
          set -euo pipefail
          vendor/bin/phpunit --filter='(ContractRevisionDeltaTest|ContractDecisionDeltaPageTest)'
          composer phpstan
          composer cs-check
          composer template-lint

      - name: Run full consumer CI (including managed skill consistency)
        working-directory: agent-ui
        run: composer ci
