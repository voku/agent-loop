name: Temporary init plan Codacy diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/init-plan-codacy-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  codacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect exact current findings without API secrets
        shell: bash
        run: |
          set -euo pipefail
          data="$(mktemp)"
          curl --fail-with-body -sSL --max-time 25 -o "$data" 'https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/962/issues?limit=100'
          jq -c '.data[] | select(.deltaType == "Added") | .commitIssue | {path:.filePath,line:.lineNumber,rule:.patternInfo.id,severity:.patternInfo.severityLevel,message:.message}' "$data"
          rm "$data"
