name: Fix setup static contracts

on:
  push:
    branches:
      - fix/setup-typed-mutations

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/setup-typed-mutations
          fetch-depth: 1
      - name: Apply static-contract repair
        run: python3 .github/scripts/fix_setup_static.py
      - name: Commit static-contract repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(setup): tighten typed mutation contracts'
          git push origin HEAD:fix/setup-typed-mutations
