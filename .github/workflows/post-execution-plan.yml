name: LOOP-132 governed host context

on:
  pull_request:

jobs:
  plan-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: php -l tools/post-execution-evidence-plan.php
      - name: PLAN, establish scope readiness, APPROVE, and compile governed context
        run: php tools/post-execution-evidence-plan.php
      - name: Upload governed host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-132-context-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/post-execution-*.json
            build/post-execution-*.txt
            build/post-execution-system.md
            .agent-loop/contracts/LOOP-132
            .agent-loop/recall/LOOP-132
            .agent-loop/runs/LOOP-132
            .agent-loop/sessions
