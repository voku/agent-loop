name: Prompt primitives candidate dogfood

on:
  pull_request:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout agent-loop candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout minimum agent-recall-compiler release
        uses: actions/checkout@v6
        with:
          repository: voku/agent-recall-compiler
          ref: 0.13.8
          path: build/candidate-agent-recall-compiler
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Lint candidate dogfood runner
        run: php -l tools/prompt-primitives-dogfood.php

      - name: Run installed governed prompt-primitives lifecycle
        run: >-
          php tools/prompt-primitives-dogfood.php
          --recall-root=${{ github.workspace }}/build/candidate-agent-recall-compiler
          --workspace=${{ runner.temp }}/agent-loop-prompt-primitives
          --report=${{ github.workspace }}/build/prompt-primitives-dogfood.json

      - name: Prove installed Recall-owned prompt primitives
        shell: bash
        run: |
          set -euo pipefail
          consumer="${RUNNER_TEMP}/agent-loop-prompt-primitives/consumer"
          cd "${consumer}"

          catalog='vendor/voku/agent-recall-compiler/skills/agent-recall-consumer/operating-prompts.json'
          test -f "${catalog}"
          grep -Fq 'distinct plausible failure-mode hypotheses or attack scenarios' "${catalog}"
          grep -Fq 'Do not manufacture defects merely to satisfy the numeric floor' "${catalog}"

          php vendor/bin/agent-loop workflow plan PROMPT-ADVERSARIAL \
            --by prompt-sync-dogfood \
            --file composer.json \
            --goal 'Review the current candidate as a first draft using project-grounded adversarial evidence.' \
            --acceptance 'The review may report CLEAN only after concrete falsification attempts find no evidence-backed defect.' \
            --non-goal 'Do not manufacture findings to satisfy a numeric review floor.' \
            --validation 'composer validate --strict' \
            --operating-prompt-manifest "${catalog}" \
            --operating-prompt '{"id":"adversarial-review","arguments":{"minimum_failure_modes":3}}'
          php vendor/bin/agent-loop workflow approve PROMPT-ADVERSARIAL --by prompt-sync-approver

          # Approval only records authority; `enter` compiles the Recall output
          # asserted below. It withholds mutation because this L2 task still
          # owes its execution contract, so exit 1 is the expected outcome.
          entered=0
          php vendor/bin/agent-loop enter PROMPT-ADVERSARIAL || entered=$?
          if [ "${entered}" -ne 1 ]; then
            echo "enter must prepare Recall and still withhold mutation; got exit ${entered}" >&2
            exit 1
          fi

          system='.agent-loop/recall/PROMPT-ADVERSARIAL/system.md'
          grep -Fq '### adversarial-review (L2)' "${system}"
          grep -Fq 'distinct plausible failure-mode hypotheses or attack scenarios' "${system}"
          grep -Fq 'Do not manufacture defects merely to satisfy the numeric floor' "${system}"
          grep -Fq 'CLEAN remains valid' "${system}"
          grep -Fq 'does not grant edit permission' "${system}"
          grep -Fq 'keep the result `UNKNOWN` or `BLOCKED`' "${system}"

          php vendor/bin/agent-loop review first-draft > first-draft.prompt.md
          grep -Fq 'falsification rather than confirmation' first-draft.prompt.md
          grep -Fq 'CLEAN is valid only after concrete attempts to falsify' first-draft.prompt.md

          php vendor/bin/agent-loop prompt guidance-gaps > guidance-gaps.prompt.md
          grep -Fq 'implementation-notes.html' guidance-gaps.prompt.md
          grep -Fq 'HUMAN_DECISION_REQUIRED' guidance-gaps.prompt.md
          grep -Fq 'not a default workflow stage' guidance-gaps.prompt.md
          grep -Fq 'do not commit it unless' guidance-gaps.prompt.md
          grep -Fq '`SPEC`, `DOC`, `SKILL`, `WORKFLOW`, `TOOL_CONTRACT`' guidance-gaps.prompt.md

          php vendor/bin/agent-loop review code PROMPT-ADVERSARIAL
          code_prompt='.agent-loop/recall/PROMPT-ADVERSARIAL/reviews/PROMPT-ADVERSARIAL.code.prompt.md'
          grep -Fq '## First-draft falsification lens' "${code_prompt}"
          grep -Fq 'CLEAN is valid only after concrete attempts to falsify' "${code_prompt}"

          mkdir -p "${GITHUB_WORKSPACE}/build/prompt-sync-evidence"
          cp "${catalog}" "${GITHUB_WORKSPACE}/build/prompt-sync-evidence/installed-operating-prompts.json"
          cp "${system}" "${GITHUB_WORKSPACE}/build/prompt-sync-evidence/system.md"
          cp first-draft.prompt.md "${GITHUB_WORKSPACE}/build/prompt-sync-evidence/first-draft.prompt.md"
          cp guidance-gaps.prompt.md "${GITHUB_WORKSPACE}/build/prompt-sync-evidence/guidance-gaps.prompt.md"
          cp "${code_prompt}" "${GITHUB_WORKSPACE}/build/prompt-sync-evidence/code.prompt.md"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-primitives-candidate-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/prompt-primitives-dogfood.json
            build/prompt-primitives-logs
            build/prompt-sync-evidence
