name: Launch approval briefing guarded main refresh (one-shot)
on:
  push:
    branches: [test/approval-launch-main-refresh-20261108]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'voku/agent-loop' && github.ref == 'refs/heads/test/approval-launch-main-refresh-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Guard exact refs and merge current main
        run: |
          set -euo pipefail
          git config user.name 'Approval launch refresh CI'
          git config user.email 'approval-launch-refresh@users.noreply.github.com'
          git fetch origin main feat/decision-briefing-ui-launch-20261108
          test "$(git rev-parse origin/feat/decision-briefing-ui-launch-20261108)" = "fd3f4b64b28d54f9f43ac3007b1774de8bea4702"
          test "$(git rev-parse origin/main)" = "973a213dab2179019c6cab1a4ff4e500d7ce2c49"
          test "$(git rev-parse HEAD^)" = "fd3f4b64b28d54f9f43ac3007b1774de8bea4702"
          git merge --no-ff --no-edit origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/approval-launch-refresh-once.yml
          git commit -m 'chore(ci): drop disposable launch-refresh workflow'
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run full project CI after merging current main
        run: composer ci
      - name: Publish verified branch update with exact-head guards
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/decision-briefing-ui-launch-20261108 | cut -f1)" = "fd3f4b64b28d54f9f43ac3007b1774de8bea4702"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "973a213dab2179019c6cab1a4ff4e500d7ce2c49"
          git diff-tree --no-commit-id --name-only -r HEAD | grep -Fx '.github/workflows/approval-launch-refresh-once.yml'
          git push origin HEAD:refs/heads/feat/decision-briefing-ui-launch-20261108
