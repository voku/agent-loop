name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci

  self-shape-dogfood:
    if: github.event_name == 'pull_request'
    name: Agent-loop shapes itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      SELF_SHAPE_GOAL: ${{ github.event.pull_request.title }}
      SELF_SHAPE_APPROVER: ${{ github.event.pull_request.user.login }}
      SELF_SHAPE_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Lint self-shape tools
        run: |
          bash -n tools/self-shape-dogfood.sh
          php -l tools/self-edit-dogfood.php
      - name: Let agent-loop edit itself in an isolated worktree
        run: php tools/self-edit-dogfood.php
      - name: Govern this change with agent-loop itself
        run: bash tools/self-shape-dogfood.sh --base-ref="${{ github.base_ref }}"
      - name: Upload self-shaping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-shape-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/self-shape-*.json
            build/self-shape-raw.diff
            infra/doc/agent-learning/recall-output/SELF-SHAPE
            infra/doc/agent-learning/history
            session_plan
            .agent-loop/runs/SELF-SHAPE

  release-set-dogfood:
    name: Installed release-set dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Lint dogfood runner
        run: php -l tools/release-set-dogfood.php
      - name: Run clean consumer lifecycle
        run: >-
          php tools/release-set-dogfood.php
          --workspace=${{ runner.temp }}/agent-loop-release-set
          --report=${{ github.workspace }}/build/release-set-report.json
          --keep
      - name: Run installed first-party asset dogfood
        shell: bash
        run: |
          set -euo pipefail
          consumer="${RUNNER_TEMP}/agent-loop-assets-consumer"
          rm -rf "${consumer}"
          mkdir -p "${consumer}"
          cat > "${consumer}/composer.json" <<JSON
          {
            "name": "voku/agent-loop-assets-consumer",
            "require-dev": {
              "voku/agent-loop": "dev-main"
            },
            "repositories": [
              {
                "type": "path",
                "url": "${GITHUB_WORKSPACE}",
                "options": {
                  "symlink": false,
                  "versions": {
                    "voku/agent-loop": "dev-main"
                  }
                }
              }
            ],
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": {
              "allow-plugins": false,
              "sort-packages": true
            }
          }
          JSON
          composer update --working-dir="${consumer}" --no-interaction --prefer-dist --no-progress --no-ansi
          cd "${consumer}"
          php vendor/bin/agent-loop init install-assets --agent=all
          test -f vendor/voku/agent-loop/docs/agents/skills/agent-loop-discipline/SKILL.md
          test -f vendor/voku/agent-loop/docs/agents/skills/agent-loop-investigate/SKILL.md
          test -f vendor/voku/agent-loop/docs/agents/skills/agent-loop-surgical-edit/SKILL.md
          test -f vendor/voku/agent-loop/docs/agents/skills/agent-loop-code-review/SKILL.md
          test -f vendor/voku/agent-loop/docs/agents/skills/agent-loop-simplify-audit/SKILL.md
          test -f vendor/voku/agent-loop/docs/agents/subagents/agent-loop-investigator.md
          test -f vendor/voku/agent-loop/docs/agents/codex-hooks/hooks/context.php
          test -f .codex/skills/agent-loop-discipline/SKILL.md
          test -f .codex/skills/agent-loop-investigate/SKILL.md
          test -f .codex/agents/agent-loop-investigator.toml
          test -f .codex/agents/agent-loop-surgical-builder.toml
          test -f .codex/agents/agent-loop-code-reviewer.toml
          test -f .codex/hooks/context.php
          test -f .github/agents/agent-loop-investigator.agent.md
          test -f .github/agents/agent-loop-surgical-builder.agent.md
          test -f .github/agents/agent-loop-code-reviewer.agent.md
          test -f .agents/agents/agent-loop-investigator.md
          test -f .agents/agents/agent-loop-surgical-builder.md
          test -f .agents/agents/agent-loop-code-reviewer.md
          mkdir -p "${GITHUB_WORKSPACE}/build"
          doctor_output="$(php vendor/bin/agent-loop init doctor)"
          printf '%s\n' "${doctor_output}" > "${GITHUB_WORKSPACE}/build/installed-host-capabilities.txt"
          grep -Fq 'Host capabilities [codex]: skill-projection=supported, subagent-projection=supported' <<< "${doctor_output}"
          grep -Fq 'Host capabilities [claude]: skill-projection=supported, subagent-projection=supported' <<< "${doctor_output}"
          grep -Fq 'Host capabilities [copilot]: skill-projection=supported, subagent-projection=supported' <<< "${doctor_output}"
          grep -Fq 'Host capabilities [antigravity]: skill-projection=supported, subagent-projection=supported' <<< "${doctor_output}"
          grep -Fq 'repository-hooks=unsupported' <<< "${doctor_output}"
          php vendor/voku/agent-loop/tools/agent-discipline-dogfood.php vendor/voku/agent-loop \
            > "${GITHUB_WORKSPACE}/build/installed-assets-dogfood.json"
      - name: Upload release-set evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-set-dogfood-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/release-set-report.json
            build/installed-assets-dogfood.json
            build/installed-host-capabilities.txt
            ${{ runner.temp }}/agent-loop-release-set/artifacts
