name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - name: Checkout candidate agent-session
        uses: actions/checkout@v6
        with:
          repository: voku/agent-session
          ref: main
          path: build/candidate-agent-session
          persist-credentials: false
      - name: Checkout candidate agent-recall-compiler
        uses: actions/checkout@v6
        with:
          repository: voku/agent-recall-compiler
          ref: main
          path: build/candidate-agent-recall-compiler
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Configure coordinated candidate dependencies
        run: |
          php -r '
          $path = "composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              ["type" => "path", "url" => "build/candidate-agent-session", "options" => ["symlink" => false, "versions" => ["voku/agent-session" => "0.3.999"]]],
              ["type" => "path", "url" => "build/candidate-agent-recall-compiler", "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.10.999"]]],
          ];
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci

  execution-contract-dogfood:
    if: github.event_name == 'pull_request'
    name: Governed execution-contract dogfood
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate agent-session
        uses: actions/checkout@v6
        with:
          repository: voku/agent-session
          ref: main
          path: build/candidate-agent-session
          persist-credentials: false
      - name: Checkout candidate agent-recall-compiler
        uses: actions/checkout@v6
        with:
          repository: voku/agent-recall-compiler
          ref: main
          path: build/candidate-agent-recall-compiler
          persist-credentials: false
      - name: Checkout current first-party operational prompt catalog
        uses: actions/checkout@v6
        with:
          repository: voku/agent-skills
          ref: main
          path: build/current-agent-skills
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Configure coordinated candidate dependencies
        run: |
          php -r '
          $path = "composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              ["type" => "path", "url" => "build/candidate-agent-session", "options" => ["symlink" => false, "versions" => ["voku/agent-session" => "0.3.999"]]],
              ["type" => "path", "url" => "build/candidate-agent-recall-compiler", "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.10.999"]]],
          ];
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
      - run: composer install --no-interaction --prefer-dist
      - run: php -l tools/execution-contract-dogfood.php
      - name: Prove L2 contract gate by mutating only after a bound L1 exists
        run: php tools/execution-contract-dogfood.php build/current-agent-skills
      - name: Upload execution-contract evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-loop-execution-contract-evidence
          path: build/execution-contract-dogfood/evidence.json
          if-no-files-found: error

  self-shape:
    if: github.event_name == 'pull_request'
    name: Agent-loop shapes itself
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout candidate agent-session
        uses: actions/checkout@v6
        with:
          repository: voku/agent-session
          ref: main
          path: build/candidate-agent-session
          persist-credentials: false
      - name: Checkout candidate agent-recall-compiler
        uses: actions/checkout@v6
        with:
          repository: voku/agent-recall-compiler
          ref: main
          path: build/candidate-agent-recall-compiler
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Configure coordinated candidate dependencies
        run: |
          php -r '
          $path = "composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [
              ["type" => "path", "url" => "build/candidate-agent-session", "options" => ["symlink" => false, "versions" => ["voku/agent-session" => "0.3.999"]]],
              ["type" => "path", "url" => "build/candidate-agent-recall-compiler", "options" => ["symlink" => false, "versions" => ["voku/agent-recall-compiler" => "0.10.999"]]],
          ];
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '
      - run: composer install --no-interaction --prefer-dist
      - name: Lint self-shape tools
        run: |
          php -l tools/self-shape-dogfood.php
          php -l tools/self-shape-governance.php
      - name: Let agent-loop edit itself in an isolated worktree
        run: bash tools/self-shape-dogfood.sh
      - name: Govern this change with agent-loop itself
        run: php tools/self-shape-governance.php
      - name: Upload self-shaping evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-loop-self-shape-evidence
          path: build/self-shape/evidence.json
          if-no-files-found: error

  installed-release-set:
    if: github.event_name == 'pull_request'
    name: Installed release-set dogfood
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned first-party engineering skills
        uses: actions/checkout@v6
        with:
          repository: voku/agent-skills
          ref: 0.2.0
          path: build/pinned-agent-skills
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Lint dogfood runner
        run: php -l tools/release-set-dogfood.php
      - name: Run clean consumer lifecycle
        run: bash tools/clean-consumer-release-set.sh
      - name: Run installed first-party asset dogfood
        run: |
          rm -rf build/release-set
          mkdir -p build/release-set
          php tools/release-set-dogfood.php build/release-set build/pinned-agent-skills
      - name: Upload release-set evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-loop-release-set-evidence
          path: build/release-set/evidence.json
          if-no-files-found: error
