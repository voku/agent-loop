name: GH-481 owner Finding evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-owner-finding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Create validated Finding through released Learning owner CLI
        shell: bash
        run: |
          set -euo pipefail
          finding_id='finding.2026-09-14.481001'
          finding_path=".agent-loop/learning/findings/validated/${finding_id}.json"
          test ! -e "${finding_path}"

          php vendor/bin/agent-learning finding-create \
            --root .agent-loop/learning \
            --id "${finding_id}" \
            --task GH-481 \
            --session 2026-09-14-constraint-alias-falsification \
            --by github-evidence \
            --scope phpstan/Rules/NoInProcessPhpstanRuleTestCaseRule.php \
            --scope tests/PHPStan/data/in-process-phpstan-rule-test-case-alias.php \
            --scope tools/Dogfood/ProjectRuleFixtureCheck.php \
            --observation 'The active in-process RuleTestCase constraint caught direct inheritance but the detector compared the source spelling of extends, so importing PHPStan\\Testing\\RuleTestCase under an alias produced the same forbidden semantic inheritance without triggering the project rule.' \
            --hypothesis 'The deterministic detector overfit the original syntax because it compared an unresolved AST name instead of the semantic parent type.' \
            --conclusion 'For the active in-process RuleTestCase constraint, raw extends spelling was insufficient; resolving the parent through PHPStan Scope catches both the original direct form and the aliased form.' \
            --confidence high \
            --sensitivity public \
            --evidence-json '{"type":"issue_reference","issue":"voku/agent-loop#481"}' \
            --evidence-json '{"type":"commit","commit":"8fbea65aece9d8eb8178f934c4fce1a3a24e1476"}' \
            --evidence-json '{"type":"phpstan_result","command":"php tools/project-phpstan-rules.php","summary":"PR #482 exact-head evidence emitted the project diagnostic for both direct and aliased RuleTestCase fixtures; the project-rule dogfood passed."}' \
            --evidence-json '{"type":"test_result","command":"composer ci","summary":"PR #482 passed composer ci on PHP 8.3, 8.4 and 8.5, and post-merge main CI completed successfully."}'

          php vendor/bin/agent-learning validate --root .agent-loop/learning
          test -s "${finding_path}"
          mkdir -p build/gh-481-finding
          cp "${finding_path}" build/gh-481-finding/
          cat "${finding_path}"
      - name: Upload owner-generated Finding
        uses: actions/upload-artifact@v4
        with:
          name: gh-481-owner-finding
          if-no-files-found: error
          path: build/gh-481-finding/finding.2026-09-14.481001.json
