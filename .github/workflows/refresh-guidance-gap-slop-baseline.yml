name: Refresh guidance-gap slop baseline location

on:
  push:
    branches: ['agent/guidance-gap-prompt']
    paths:
      - '.github/workflows/refresh-guidance-gap-slop-baseline.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/guidance-gap-prompt

      - name: Move only the known Dispatcher clone occurrence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('slop-baseline.json')
          text = path.read_text()
          pattern = re.compile(r'("path": "src/Dispatcher\.php",\n\s*"line": )416(,\n\s*"column": 1)')
          updated, count = pattern.subn(r'\g<1>417\g<2>', text)
          if count != 2:
              raise SystemExit(f'expected exactly 2 Dispatcher baseline occurrences, found {count}')
          path.write_text(updated)
          PY
          rm .github/workflows/refresh-guidance-gap-slop-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add slop-baseline.json .github/workflows/refresh-guidance-gap-slop-baseline.yml
          git commit -m 'Refresh guidance-gap slop baseline location'
          git push origin HEAD:agent/guidance-gap-prompt
