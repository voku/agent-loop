name: Git History Investigation Dogfood

on:
  pull_request:
    paths:
      - '.github/workflows/git-history-dogfood.yml'
      - 'tools/git-history-dogfood.sh'
      - 'resources/skills/agent-loop-investigate/SKILL.md'
      - 'resources/subagents/agent-loop-investigator.md'
      - 'tests/FirstPartyAgentAssetContractTest.php'
  push:
    branches: [main]
    paths:
      - '.github/workflows/git-history-dogfood.yml'
      - 'tools/git-history-dogfood.sh'
      - 'resources/skills/agent-loop-investigate/SKILL.md'
      - 'resources/subagents/agent-loop-investigator.md'
      - 'tests/FirstPartyAgentAssetContractTest.php'

permissions:
  contents: read

jobs:
  regression-provenance:
    name: Reproduce regression history with native Git
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint Git history dogfood
        run: bash -n tools/git-history-dogfood.sh
      - name: Verify a regression across a file rename, with bounded diffs and shallow evidence
        run: bash tools/git-history-dogfood.sh build/git-history-dogfood.json
      - name: Verify machine-readable evidence and unchanged tracked source
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "1.0"
            and .result == "passed"
            and .history.files_inspected == 1
            and .history.commit_budget == 15
            and .history.inspected_commits == 4
            and .history.rename_crossed == true
            and .history.blamed_sha == .fixture.regression_sha
            and .history.pickaxe_sha == .fixture.regression_sha
            and .history.source_before_after_verified == true
            and .history.stat_verified == true
            and .patch.displayed_lines == 201
            and .patch.displayed_line_budget == 200
            and .patch.truncation_marker == true
            and .shallow.is_shallow == true
            and .shallow.history_incomplete == true
            and .shallow.automated_fetch == false
          ' build/git-history-dogfood.json >/dev/null
          git diff --exit-code -- .
      - name: Upload reproducible history evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-history-dogfood-${{ github.sha }}
          if-no-files-found: warn
          path: build/git-history-dogfood.json
