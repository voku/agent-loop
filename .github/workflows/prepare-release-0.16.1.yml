name: Prepare 0.16.1 changelog

on:
  push:
    branches:
      - agent/release-0.16.1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare changelog-only release diff
        shell: bash
        run: |
          set -euo pipefail
          section_b64=''
          section="$(printf '%s' "$section_b64" | base64 -d)"
          python3 - "$section" <<'PY'
          from pathlib import Path
          import sys
          p = Path('CHANGELOG.md')
          text = p.read_text()
          anchor = '## 0.16.0 - 2026-08-14'
          section = sys.argv[1] + '\n'
          if '## 0.16.1 - ' in text:
              raise SystemExit('0.16.1 changelog section already exists')
          if anchor not in text:
              raise SystemExit('0.16.0 changelog anchor missing')
          p.write_text(text.replace(anchor, section + anchor, 1))
          PY
          rm .github/workflows/prepare-release-0.16.1.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-release-0.16.1.yml
          git commit -m 'Document 0.16.1'
          git push origin HEAD:agent/release-0.16.1
