name: Refresh Task-B precedent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  refresh-precedent:
    if: >-
      github.event.issue.pull_request != null
      && github.event.comment.user.login == github.repository_owner
      && github.event.comment.body == 'AGENT_LOOP_REFRESH_TASK_B_PRECEDENT_457001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTE_ID: learning-note.2026-09-12.457001
      FINDING_ID: finding.2026-09-12.457001
      LEARNING_ROOT: .agent-loop/learning
      EVIDENCE_DIR: /tmp/agent-loop-task-b-precedent-refresh-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install released dependency set
        run: composer install --no-interaction --prefer-dist

      - name: Review current Learning evidence through owner API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"

          vendor/bin/agent-learning-note review \
            --root "${LEARNING_ROOT}" \
            --project-root "${GITHUB_WORKSPACE}" \
            "${NOTE_ID}" > "${EVIDENCE_DIR}/review-before.json"

          jq -e '
            .id == env.NOTE_ID
            and ([.repository_evidence[].state] | length == 2)
            and ([.repository_evidence[].state] | all(. == "current" or . == "review_needed"))
            and ([.repository_evidence[].state] | any(. == "review_needed"))
          ' "${EVIDENCE_DIR}/review-before.json" >/dev/null

      - name: Reconfirm bounded semantic anchors
        shell: bash
        run: |
          set -euo pipefail

          test_file='tests/Dogfood/LearningNoteTwoRunDogfoodTest.php'
          dogfood='tools/execution-contract-dogfood.php'

          grep -Fq 'run one teaches, transient context disappears, run two remembers' "${test_file}"
          grep -Fq 'LearningNoteService' "${test_file}"
          grep -Fq 'TASK-349-RECALL' "${test_file}"
          grep -Fq 'learning_precedent' "${test_file}"
          grep -Fq "self::assertSame('current', \$precedent->payload['evidence_state']);" "${test_file}"

          grep -Fq '## L2 Operational Prompt Construction' "${dogfood}"
          grep -Fq 'execution contract is missing' "${dogfood}"
          grep -Fq "'--status', 'ready'" "${dogfood}"
          grep -Fq "'--runner=mechanical'" "${dogfood}"

      - name: Prepare current owner authoring projection
        shell: bash
        run: |
          set -euo pipefail

          vendor/bin/agent-learning-note prepare \
            --root "${LEARNING_ROOT}" \
            --project-root "${GITHUB_WORKSPACE}" \
            --finding "${FINDING_ID}" > "${EVIDENCE_DIR}/prepare.json"

          jq -e '
            .pattern_key == "workflow.closed_loop_requires_real_precedent_handoff"
            and .existing_note.id == env.NOTE_ID
            and .existing_note.source_findings == [env.FINDING_ID]
          ' "${EVIDENCE_DIR}/prepare.json" >/dev/null

      - name: Build public authoring candidate from owner projection
        shell: bash
        run: |
          set -euo pipefail

          test_sha="$(sha256sum tests/Dogfood/LearningNoteTwoRunDogfoodTest.php | awk '{print $1}')"
          dogfood_sha="$(sha256sum tools/execution-contract-dogfood.php | awk '{print $1}')"

          jq \
            --arg test_sha "${test_sha}" \
            --arg dogfood_sha "${dogfood_sha}" '
            .existing_note as $note
            | {
                id: $note.id,
                source_findings: $note.source_findings,
                source_proposals: $note.source_proposals,
                tags: $note.tags,
                repository_evidence: [
                  {
                    source_ref: "tests/Dogfood/LearningNoteTwoRunDogfoodTest.php",
                    sha256: $test_sha
                  },
                  {
                    source_ref: "tools/execution-contract-dogfood.php",
                    sha256: $dogfood_sha
                  }
                ],
                content: $note.content
              }
          ' "${EVIDENCE_DIR}/prepare.json" > "${EVIDENCE_DIR}/candidate.json"

      - name: Publish only through Learning owner
        shell: bash
        run: |
          set -euo pipefail

          vendor/bin/agent-learning-note publish \
            --root "${LEARNING_ROOT}" \
            --project-root "${GITHUB_WORKSPACE}" \
            --input "${EVIDENCE_DIR}/candidate.json" > "${EVIDENCE_DIR}/publish.json"

          jq -e '
            .id == env.NOTE_ID
            and .pattern_key == "workflow.closed_loop_requires_real_precedent_handoff"
            and .source_findings == [env.FINDING_ID]
            and .evidence_state == "current"
          ' "${EVIDENCE_DIR}/publish.json" >/dev/null

          vendor/bin/agent-learning-note status \
            --root "${LEARNING_ROOT}" \
            --project-root "${GITHUB_WORKSPACE}" > "${EVIDENCE_DIR}/status.json"

          jq -e '
            [.notes[] | select(.id == env.NOTE_ID)]
            | length == 1
            and .[0].evidence_state == "current"
            and .[0].pattern_key == "workflow.closed_loop_requires_real_precedent_handoff"
          ' "${EVIDENCE_DIR}/status.json" >/dev/null

      - name: Verify owner produced only the expected durable mutation
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = "1"
          test "${changed[0]}" = ".agent-loop/learning/notes/active/${NOTE_ID}.json"

          git diff --check
          git diff -- ".agent-loop/learning/notes/active/${NOTE_ID}.json" \
            > "${EVIDENCE_DIR}/owner-note.diff"

      - name: Push owner-produced note refresh branch
        shell: bash
        run: |
          set -euo pipefail

          branch="experiment/task-b-precedent-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add ".agent-loop/learning/notes/active/${NOTE_ID}.json"
          git commit -m "dogfood: refresh Task B learning precedent evidence"
          git push origin "HEAD:refs/heads/${branch}"
