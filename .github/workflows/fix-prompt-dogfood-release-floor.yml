name: Fix prompt dogfood release floor

on:
  push:
    branches:
      - agent/outcome-honesty-self-correction

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outcome-honesty-self-correction
      - name: Derive Recall version from candidate Composer authority
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          prompt = Path('tools/prompt-primitives-dogfood.php')
          text = prompt.read_text()
          old = '''    private function writeConsumerComposer(): void
              {
                  $this->writeJson($this->consumerRoot . '/composer.json', [
          '''
          new = '''    private function writeConsumerComposer(): void
              {
                  $candidateComposer = $this->jsonFile($this->agentLoopRoot . '/composer.json');
                  $require = $candidateComposer['require'] ?? null;
                  $recallConstraint = is_array($require) ? ($require['voku/agent-recall-compiler'] ?? null) : null;
                  if (!is_string($recallConstraint)
                      || !preg_match('/^\\^(\\d+\\.\\d+\\.\\d+)$/', $recallConstraint, $matches)
                  ) {
                      throw new PromptPrimitivesDogfoodFailure(
                          'Expected candidate agent-loop to declare voku/agent-recall-compiler with an exact caret floor.',
                      );
                  }
                  $recallVersion = $matches[1];

                  $this->writeJson($this->consumerRoot . '/composer.json', [
          '''
          if old not in text:
              raise SystemExit('writeConsumerComposer anchor not found')
          text = text.replace(old, new, 1)
          old_req = "                'voku/agent-recall-compiler' => '0.11.999',"
          new_req = "                'voku/agent-recall-compiler' => $recallConstraint,"
          if text.count(old_req) != 1:
              raise SystemExit(f'expected one stale require alias, got {text.count(old_req)}')
          text = text.replace(old_req, new_req, 1)
          old_version = "                        'versions' => ['voku/agent-recall-compiler' => '0.11.999'],"
          new_version = "                        'versions' => ['voku/agent-recall-compiler' => $recallVersion],"
          if text.count(old_version) != 1:
              raise SystemExit(f'expected one stale path-repo alias, got {text.count(old_version)}')
          text = text.replace(old_version, new_version, 1)
          prompt.write_text(text)

          test = Path('tests/AgentFacingPathGuidanceTest.php')
          text = test.read_text()
          old = '''        foreach (['acceptance-criteria-candidate.yml', 'prompt-primitives-candidate.yml'] as $workflow) {
                      $contents = (string) file_get_contents($root . '/.github/workflows/' . $workflow);
                      self::assertStringContainsString(
                          'ref: ' . $minimumRelease,
                          $contents,
                          $workflow . ' must dogfood the minimum released Recall version declared by composer.json.',
                      );
                  }
              }
          '''
          new = '''        foreach (['acceptance-criteria-candidate.yml', 'prompt-primitives-candidate.yml'] as $workflow) {
                      $contents = (string) file_get_contents($root . '/.github/workflows/' . $workflow);
                      self::assertStringContainsString(
                          'ref: ' . $minimumRelease,
                          $contents,
                          $workflow . ' must dogfood the minimum released Recall version declared by composer.json.',
                      );
                  }

                  $promptHarness = (string) file_get_contents($root . '/tools/prompt-primitives-dogfood.php');
                  self::assertStringContainsString("$this->agentLoopRoot . '/composer.json'", $promptHarness);
                  self::assertStringContainsString("'voku/agent-recall-compiler' => $recallConstraint", $promptHarness);
                  self::assertStringContainsString("'voku/agent-recall-compiler' => $recallVersion", $promptHarness);
                  self::assertStringNotContainsString('0.11.999', $promptHarness);
              }
          '''
          if old not in text:
              raise SystemExit('AgentFacingPathGuidanceTest anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-prompt-dogfood-release-floor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prompt-primitives-dogfood.php tests/AgentFacingPathGuidanceTest.php .github/workflows/fix-prompt-dogfood-release-floor.yml
          git commit -m "Derive prompt dogfood Recall floor from Composer"
          git push origin HEAD:agent/outcome-honesty-self-correction
