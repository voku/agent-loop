name: Apply self-shape repeat-run fix

on:
  push:
    branches:
      - agent/self-shape-repeat-run

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/self-shape-repeat-run
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Apply candidate patch
        run: python .github/apply-self-shape-repeat-fix.py
      - name: Validate changed PHP syntax
        run: |
          php -l src/Workflow/WorkflowPlanCommand.php
          php -l src/Workflow/WorkflowApproveCommand.php
          php -l src/Dogfood/SelfShapeRunRecovery.php
          php -l tools/self-shape-dogfood.php
          php -l tests/SelfShapeRunRecoveryTest.php
          php -l tests/WorkflowRepeatRunTest.php
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make self-shape repeatable over governed state'
          git push origin HEAD:agent/self-shape-repeat-run
