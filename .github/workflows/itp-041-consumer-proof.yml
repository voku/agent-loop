name: ITP 0.4.1 consumer evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-consumer:
    if: github.head_ref == 'ci/itp-context-041-consumer-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Resolve and install the published dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          mkdir -p build/itp-041
          cp composer.lock build/itp-041/before.lock
          composer update voku/itp-context:0.4.1 --no-interaction --prefer-dist --no-progress
          composer validate --strict
          cp composer.lock build/itp-041/composer.lock
          git diff -- composer.lock > build/itp-041/composer-lock.diff
          jq -e '."packages-dev"[] | select(.name == "voku/itp-context") | .version == "0.4.1" and .source.reference == "fff29fd7f639be8b53ac415046a0846d1de26b32"' composer.lock
          jq -S '(.packages + ."packages-dev") | map(select(.name != "voku/itp-context"))' build/itp-041/before.lock > build/itp-041/before-other.json
          jq -S '(.packages + ."packages-dev") | map(select(.name != "voku/itp-context"))' composer.lock > build/itp-041/after-other.json
          cmp build/itp-041/before-other.json build/itp-041/after-other.json
          test -x vendor/bin/itp-context-source-hints
          php -r 'require "vendor/autoload.php"; if (Composer\InstalledVersions::getPrettyVersion("voku/itp-context") !== "0.4.1" || Composer\InstalledVersions::getReference("voku/itp-context") !== "fff29fd7f639be8b53ac415046a0846d1de26b32") { exit(1); }'
      - name: Discover a real annotated symbol and project its source hints
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/agent-map build --root=. --paths=src/Workflow
          vendor/bin/agent-map query WorkflowLearningRecorder > build/itp-041/map-query.txt
          source_path="$(grep -oE 'src/[A-Za-z0-9_./-]+\.php' build/itp-041/map-query.txt | sort -u | grep '/WorkflowLearningRecorder\.php$')"
          test "$source_path" = 'src/Workflow/WorkflowLearningRecorder.php'
          vendor/bin/itp-context-source-hints --root=. --file="$source_path" > build/itp-041/hints.json
          source_digest="sha256:$(sha256sum "$source_path" | cut -d' ' -f1)"
          jq -e --arg path "$source_path" --arg digest "$source_digest" --arg rule 'voku\AgentLoop\Context\ArchitectureRules::WorkflowActorIsAttribution' '
            .status == "ready" and .authority == "none" and .resolution == "syntax_only"
            and .inspected_files == [{"path": $path, "sha256": $digest}]
            and any(.rules[]; .rule_id == $rule and .evidence == "source_attribute_only" and (.files | index($path) != null))
          ' build/itp-041/hints.json
          # The owner metadata is inspected separately in this trusted checkout.
          vendor/bin/itp-context-summarize "$source_path" > build/itp-041/summary.md
          grep -Fq 'ArchitectureRules::WorkflowActorIsAttribution' build/itp-041/summary.md
          grep -Fq -- '- **When changing:** Do not describe --by' build/itp-041/summary.md
          grep -Fq -- '- **Proof:** voku\AgentLoop\Tests\ProductionDevDependencyBoundaryTest' build/itp-041/summary.md
          git diff --exit-code -- . ':!composer.lock'
          jq -n --arg head "$EXACT_HEAD" --arg path "$source_path" --arg digest "$source_digest" '
            {head: $head, package: "voku/itp-context", version: "0.4.1", source_path: $path, source_sha256: $digest,
             installed_consumer: "passed", acting_agent_ab_result: "NOT RUN", authority: "advisory only"}
          ' > build/itp-041/report.json
      - name: Check the production dependency boundary
        run: vendor/bin/phpunit tests/ProductionDevDependencyBoundaryTest.php
      - name: Upload generated lockfile and consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: itp-041-consumer-${{ env.EXACT_HEAD }}
          path: build/itp-041/
          if-no-files-found: error
