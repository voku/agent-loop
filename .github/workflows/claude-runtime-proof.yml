name: Claude runtime proof

on:
  pull_request:
    paths:
      - '.github/workflows/claude-runtime-proof.yml'
      - 'src/Init/**'
      - 'src/AgentGuidance/**'
      - 'resources/hooks/claude/**'
      - 'resources/instructions/**'
      - 'resources/skills/**'
      - 'resources/subagents/**'
      - 'tools/Dogfood/claude-runtime-proof-*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Claude 2.1.287 repository runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_VERSION: '2.1.287'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install repository dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install exact Claude runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
          claude --version

      - name: Project disposable Claude repository
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/agent-loop-claude-runtime-proof"
          runtime_home="${RUNNER_TEMP}/claude-runtime-home"
          evidence_root="${GITHUB_WORKSPACE}/build/claude-runtime-proof"

          rm -rf "${proof_root}" "${runtime_home}" "${evidence_root}"
          mkdir -p "${proof_root}" "${runtime_home}" "${evidence_root}"
          git -C "${proof_root}" init --initial-branch=main

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init scaffold --demo --agent=claude
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=claude

            projection_digest() {
              {
                sha256sum AGENTS.md CLAUDE.md
                find .claude/skills .claude/agents -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            }

            projection_digest > "${evidence_root}/projection-before-reinstall.sha256"
          )

          head_sha='${{ github.event.pull_request.head.sha }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          test -n "${head_sha}" || head_sha="${GITHUB_SHA}"
          test -n "${base_sha}" || base_sha="${GITHUB_SHA}"
          printf '%s\n' "${head_sha}" > "${evidence_root}/repository-head-sha.txt"
          printf '%s\n' "${base_sha}" > "${evidence_root}/repository-base-sha.txt"
          sha256sum "${GITHUB_WORKSPACE}/composer.lock" | cut -d' ' -f1 > "${evidence_root}/dependency-graph.sha256"

          echo "PROOF_ROOT=${proof_root}" >> "${GITHUB_ENV}"
          echo "CLAUDE_CONFIG_DIR=${runtime_home}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"

          cp "${proof_root}/AGENTS.md" "${evidence_root}/projected-AGENTS.md"
          cp "${proof_root}/CLAUDE.md" "${evidence_root}/projected-CLAUDE.md"

      - name: Start deterministic Anthropic-compatible provider
        shell: bash
        run: |
          set -euo pipefail
          port_path="${RUNNER_TEMP}/claude-runtime-proof-port"

          python3 "${GITHUB_WORKSPACE}/tools/Dogfood/claude-runtime-proof-provider.py" \
            --evidence-root "${EVIDENCE_ROOT}" \
            --proof-root "${PROOF_ROOT}" \
            --port-path "${port_path}" &
          server_pid=$!
          echo "CLAUDE_PROOF_SERVER_PID=${server_pid}" >> "${GITHUB_ENV}"

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          echo "CLAUDE_PROOF_PORT=$(cat "${port_path}")" >> "${GITHUB_ENV}"

      - name: Prove Claude instruction, skill, and subagent runtime
        shell: bash
        env:
          ANTHROPIC_API_KEY: proof-key
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          ENABLE_CLAUDEAI_MCP_SERVERS: 'false'
          MCP_CONNECTION_NONBLOCKING: 'true'
          CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: 'false'
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
          IS_DEMO: '1'
        run: |
          set -euo pipefail
          export ANTHROPIC_BASE_URL="http://127.0.0.1:${CLAUDE_PROOF_PORT}"

          claude --version | tee "${EVIDENCE_ROOT}/claude-version.txt"

          run_claude_proof() {
            label="$1"
            prompt="$2"
            (
              cd "${PROOF_ROOT}"
              claude -p \
                --model claude-sonnet-4-5 \
                --output-format json \
                "${prompt}"
            ) > "${EVIDENCE_ROOT}/claude-${label}.json"
            jq -e '(.type == "result") and (.subtype == "success") and (.result == "PROOF_OK")' \
              "${EVIDENCE_ROOT}/claude-${label}.json" >/dev/null
          }

          run_phase() {
            phase="$1"
            upper_phase="$(printf '%s' "${phase}" | tr '[:lower:]' '[:upper:]')"

            run_claude_proof \
              "instruction-${phase}" \
              "RUNTIME_PROOF_INSTRUCTION_${upper_phase} Return exactly PROOF_OK and do not use tools."

            run_claude_proof \
              "skill-${phase}" \
              "RUNTIME_PROOF_SKILL_${upper_phase} Invoke the exact project skill agent-loop-discipline with the Skill tool, then return exactly PROOF_OK."

            run_claude_proof \
              "subagent-${phase}" \
              "RUNTIME_PROOF_SUBAGENT_PARENT_${upper_phase} Select agent-loop-investigator with the Agent tool for a foreground child that returns SUBAGENT_PROOF_OK, then return exactly PROOF_OK."
          }

          run_phase before

          (
            cd "${PROOF_ROOT}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=claude

            projection_digest() {
              {
                sha256sum AGENTS.md CLAUDE.md
                find .claude/skills .claude/agents -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            }

            projection_digest > "${EVIDENCE_ROOT}/projection-after-reinstall.sha256"
          )

          test "$(cat "${EVIDENCE_ROOT}/projection-before-reinstall.sha256")" = \
            "$(cat "${EVIDENCE_ROOT}/projection-after-reinstall.sha256")"

          run_phase after

      - name: Prove Claude direct-form permission denies are honored live
        shell: bash
        env:
          ANTHROPIC_API_KEY: proof-key
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          ENABLE_CLAUDEAI_MCP_SERVERS: 'false'
          MCP_CONNECTION_NONBLOCKING: 'true'
          CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: 'false'
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
          IS_DEMO: '1'
        run: |
          set -euo pipefail
          export ANTHROPIC_BASE_URL="http://127.0.0.1:${CLAUDE_PROOF_PORT}"

          (
            cd "${PROOF_ROOT}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init sync-policy --agent=claude
          )

          test -f "${PROOF_ROOT}/.claude/settings.json"
          test ! -e "${PROOF_ROOT}/.claude/hooks/pre_tool_use_policy.php"
          jq -e '
            .permissions.deny
            | index("Bash(git push *)") != null
              and index("Bash(gh pr create *)") != null
              and index("Bash(gh pr merge *)") != null
          ' "${PROOF_ROOT}/.claude/settings.json" >/dev/null
          sha256sum "${PROOF_ROOT}/.claude/settings.json" > "${EVIDENCE_ROOT}/direct-permission-projection.sha256"

          wrapper_dir="${PROOF_ROOT}/permission-proof-bin"
          real_git="$(command -v git)"
          mkdir -p "${wrapper_dir}"

          cat > "${wrapper_dir}/git" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\$*" == 'push origin main' ]]; then
            printf '%s\n' "\$*" >> "${EVIDENCE_ROOT}/direct-permission-git_push-executed.log"
            exit 97
          fi
          exec "${real_git}" "\$@"
          EOF
          cat > "${wrapper_dir}/gh" <<EOF
          #!/usr/bin/env bash
          case "\$*" in
            'pr create --title proof --body proof')
              printf '%s\n' "\$*" >> "${EVIDENCE_ROOT}/direct-permission-gh_pr_create-executed.log"
              ;;
            'pr merge 1 --squash')
              printf '%s\n' "\$*" >> "${EVIDENCE_ROOT}/direct-permission-gh_pr_merge-executed.log"
              ;;
            *)
              printf '%s\n' "\$*" >> "${EVIDENCE_ROOT}/direct-permission-gh-unexpected-executed.log"
              ;;
          esac
          exit 97
          EOF
          chmod +x "${wrapper_dir}/git" "${wrapper_dir}/gh"

          run_permission_proof() {
            label="$1"
            marker="$2"
            (
              cd "${PROOF_ROOT}"
              PATH="${wrapper_dir}:${PATH}" claude -p \
                --debug-file "${EVIDENCE_ROOT}/claude-permission-${label}-debug.log" \
                --model claude-sonnet-4-5 \
                --output-format json \
                "${marker} Use the Bash tool exactly once with the command supplied by the model provider. Do not replace it with another tool or command."
            ) > "${EVIDENCE_ROOT}/claude-permission-${label}.json"
            jq -e '(.type == "result") and (.subtype == "success") and (.result == "PROOF_OK")' \
              "${EVIDENCE_ROOT}/claude-permission-${label}.json" >/dev/null
          }

          run_permission_proof git-push RUNTIME_PROOF_PERMISSION_DENY_GIT_PUSH
          run_permission_proof gh-pr-create RUNTIME_PROOF_PERMISSION_DENY_GH_PR_CREATE
          run_permission_proof gh-pr-merge RUNTIME_PROOF_PERMISSION_DENY_GH_PR_MERGE

          test ! -e "${EVIDENCE_ROOT}/direct-permission-git_push-executed.log"
          test ! -e "${EVIDENCE_ROOT}/direct-permission-gh_pr_create-executed.log"
          test ! -e "${EVIDENCE_ROOT}/direct-permission-gh_pr_merge-executed.log"
          test ! -e "${EVIDENCE_ROOT}/direct-permission-gh-unexpected-executed.log"

      - name: Prove Claude PreToolUse deny is honored live
        shell: bash
        env:
          ANTHROPIC_API_KEY: proof-key
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
          ENABLE_CLAUDEAI_MCP_SERVERS: 'false'
          MCP_CONNECTION_NONBLOCKING: 'true'
          CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION: 'false'
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: '1'
          IS_DEMO: '1'
        run: |
          set -euo pipefail
          export ANTHROPIC_BASE_URL="http://127.0.0.1:${CLAUDE_PROOF_PORT}"

          (
            cd "${PROOF_ROOT}"

            jq -n --arg source "${GITHUB_WORKSPACE}" '{
              repositories: [{
                type: "path",
                url: $source,
                options: {
                  symlink: false,
                  versions: {"voku/agent-loop": "dev-candidate"}
                }
              }],
              require: {"voku/agent-loop": "dev-candidate"}
            }' > composer.json

            composer install --no-interaction --prefer-dist --no-progress
            composer show voku/agent-loop --format=json > "${EVIDENCE_ROOT}/installed-agent-loop.json"

            test -x vendor/bin/agent-loop
            test -f vendor/voku/agent-loop/src/AgentGuidance/AgentDisciplineHook.php
            test "$(sha256sum vendor/voku/agent-loop/src/AgentGuidance/AgentDisciplineHook.php | cut -d' ' -f1)" = \
              "$(sha256sum "${GITHUB_WORKSPACE}/src/AgentGuidance/AgentDisciplineHook.php" | cut -d' ' -f1)"
            test "$(sha256sum vendor/voku/agent-loop/resources/hooks/claude/hooks/pre_tool_use_policy.php | cut -d' ' -f1)" = \
              "$(sha256sum "${GITHUB_WORKSPACE}/resources/hooks/claude/hooks/pre_tool_use_policy.php" | cut -d' ' -f1)"

            vendor/bin/agent-loop init install-assets --agent=claude --with-hooks
          )

          test -f "${PROOF_ROOT}/.claude/settings.json"
          test -f "${PROOF_ROOT}/.claude/hooks/pre_tool_use_policy.php"

          mkdir -p "${PROOF_ROOT}/proof-bin"
          fake_git="${PROOF_ROOT}/proof-bin/git"
          execution_sentinel="${EVIDENCE_ROOT}/alternate-publication-executed.log"

          cat > "${fake_git}" <<EOF
          #!/usr/bin/env bash
          printf '%s\n' "\$*" >> "${execution_sentinel}"
          exit 0
          EOF
          chmod +x "${fake_git}"

          sha256sum \
            "${PROOF_ROOT}/.claude/settings.json" \
            "${PROOF_ROOT}/.claude/hooks/pre_tool_use_policy.php" \
            "${PROOF_ROOT}/vendor/voku/agent-loop/src/AgentGuidance/AgentDisciplineHook.php" \
            > "${EVIDENCE_ROOT}/pretool-projection.sha256"

          export CLAUDE_CODE_DEBUG_LOG_LEVEL=verbose
          (
            cd "${PROOF_ROOT}"
            claude -p \
              --debug-file "${EVIDENCE_ROOT}/claude-pretool-debug.log" \
              --permission-mode bypassPermissions \
              --model claude-sonnet-4-5 \
              --output-format json \
              "RUNTIME_PROOF_PRETOOL_DENY Use the Bash tool exactly once with the command supplied by the model provider. Do not replace it with another tool or command."
          ) > "${EVIDENCE_ROOT}/claude-pretool-deny.json"

          test ! -e "${execution_sentinel}"

          python3 "${GITHUB_WORKSPACE}/tools/Dogfood/claude-runtime-proof-analyze.py" \
            --evidence-root "${EVIDENCE_ROOT}" \
            --output "${EVIDENCE_ROOT}/runtime-observations.json"

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "${EVIDENCE_ROOT}"

          if test -n "${CLAUDE_PROOF_SERVER_PID:-}"; then
            kill "${CLAUDE_PROOF_SERVER_PID}" 2>/dev/null || true
            wait "${CLAUDE_PROOF_SERVER_PID}" 2>/dev/null || true
          fi

          if test -s "${EVIDENCE_ROOT}/runtime-observations.json"; then
            runtime_observations="$(cat "${EVIDENCE_ROOT}/runtime-observations.json")"
          else
            runtime_observations='null'
          fi

          jq -n \
            --arg claude_version "$(cat "${EVIDENCE_ROOT}/claude-version.txt" 2>/dev/null || printf '%s' 'unknown')" \
            --arg repository_head_sha "$(cat "${EVIDENCE_ROOT}/repository-head-sha.txt")" \
            --arg repository_base_sha "$(cat "${EVIDENCE_ROOT}/repository-base-sha.txt")" \
            --arg dependency_graph_sha256 "$(cat "${EVIDENCE_ROOT}/dependency-graph.sha256")" \
            --arg projection_before "$(cat "${EVIDENCE_ROOT}/projection-before-reinstall.sha256")" \
            --arg projection_after "$(cat "${EVIDENCE_ROOT}/projection-after-reinstall.sha256" 2>/dev/null || printf '%s' 'unknown')" \
            --argjson runtime_observations "${runtime_observations}" \
            '{
              schema_version: "1.1",
              claude_version: $claude_version,
              repository: {
                head_sha: $repository_head_sha,
                base_sha: $repository_base_sha
              },
              dependency_graph_sha256: $dependency_graph_sha256,
              projection_identity: {
                before_reinstall: $projection_before,
                after_reinstall: $projection_after
              },
              observed: {
                instruction_consumption: {
                  evidence_class: "host_consumption",
                  mechanism: "fresh claude -p sessions classified by stable runtime-proof sentinels",
                  observations: ($runtime_observations.instruction_consumption // null),
                  status: (if $runtime_observations == null then "unverified" else "observed" end),
                  boundary: "Claude Code 2.1.287 sends the managed agent-loop router exactly once in fresh effective model requests before and after reinstall."
                },
                repository_skill_runtime: {
                  evidence_class: "host_discovery_and_invocation",
                  mechanism: "Skill listing in effective request plus deterministic native Skill tool invocation and loaded owned skill body in the follow-up request",
                  observations: ($runtime_observations.skill_runtime // null),
                  status: (if $runtime_observations == null then "unverified" else "observed" end),
                  boundary: "Proves discovery and invocation of projected agent-loop-discipline before and after reinstall; it does not prove every projected skill or model-selected routing quality."
                },
                repository_subagent_runtime: {
                  evidence_class: "host_discovery_and_selection",
                  mechanism: "Agent type listing in effective request plus deterministic native Agent selection and selected owned subagent body in the child provider request",
                  observations: ($runtime_observations.subagent_runtime // null),
                  status: (if $runtime_observations == null then "unverified" else "observed" end),
                  boundary: "Proves discovery and selection of projected agent-loop-investigator before and after reinstall; it does not prove read-only enforcement or arbitrary subagent behavior."
                },
                reinstall_convergence: {
                  evidence_class: "installed_projection",
                  mechanism: "two consecutive init install-assets --agent=claude runs with identical owned projection digest",
                  status: (if $projection_before == $projection_after then "observed" else "unverified" end)
                },
                direct_form_permission_deny_enforcement: {
                  evidence_class: "host_runtime_enforcement",
                  mechanism: "project .claude/settings.json deny rules plus three scenario-driven Bash tool requests with no repository hooks installed",
                  observations: ($runtime_observations.direct_permission_deny_runtime // null),
                  status: (if (($runtime_observations.direct_permission_deny_runtime // {}) | length) == 3 then "observed" else "unverified" end),
                  boundary: "Proves Claude Code 2.1.287 rejects the three managed canonical direct forms git push, gh pr create, and gh pr merge before the fake executables run. Alternate invocation, hooks, MCP, and other authority routes are separate evidence boundaries."
                },
                pretool_deny_enforcement: {
                  evidence_class: "host_runtime_enforcement",
                  mechanism: "installed candidate consumer plus scenario-driven Bash tool_use with bypassPermissions; repository PreToolUse hook denies and the fake git executable remains unexecuted",
                  observations: ($runtime_observations.pretool_deny_runtime // null),
                  status: (if ($runtime_observations.pretool_deny_runtime // null) == null then "unverified" else "observed" end),
                  boundary: "Proves the projected Claude PreToolUse Bash hook executes and its deny output suppresses one bounded alternate-publication command. It does not establish a universal shell, MCP, or security boundary and does not prove the separate hard direct-form permission rules."
                }
              },
              not_proven_by_this_slice: {
                session_start_exact_once_context: true,
                subagent_start_hook_execution: true,
                subagent_read_only_enforcement: true,
                mcp_authority_coverage: true,
                interactive_workspace_trust: true,
                resume_exact_once_context: true
              }
            }' > "${EVIDENCE_ROOT}/evidence.json"

          (
            cd "${EVIDENCE_ROOT}"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload Claude runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: build/claude-runtime-proof
