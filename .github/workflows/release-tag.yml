name: Tag release

on:
  push:
    branches: [main]
    paths:
      - '.release/*.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create requested release tags
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          markers=(.release/*.json)
          if [ "${#markers[@]}" -eq 0 ]; then
            echo 'No release markers found.' >&2
            exit 1
          fi

          frozen_main="$(git rev-parse HEAD)"
          for marker in "${markers[@]}"; do
            version="$(jq -er '.version' "$marker")"
            target="$(jq -er '.target_sha' "$marker")"
            if [[ "$version" != "$(basename "$marker" .json)" ]]; then
              echo "Marker filename/version mismatch: $marker -> $version" >&2
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi
            if [[ ! "$target" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "Invalid release target SHA: $target" >&2
              exit 1
            fi
            if ! grep -Fq "## [$version] - " CHANGELOG.md && ! grep -Fq "## $version - " CHANGELOG.md; then
              echo "CHANGELOG.md has no release section for $version" >&2
              exit 1
            fi
            git cat-file -e "${target}^{commit}"
            if ! git merge-base --is-ancestor "$target" "$frozen_main"; then
              echo "Release target $target is not reachable from frozen main $frozen_main" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              existing="$(git rev-list -n 1 "$version")"
              [[ "$existing" == "$target" ]] || { echo "Tag $version exists at $existing, expected $target" >&2; exit 1; }
              continue
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$version" "$target" -m "agent-loop $version"
            git push origin "refs/tags/$version"
          done
