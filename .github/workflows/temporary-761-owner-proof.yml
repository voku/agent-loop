name: Temporary owner-pinned matcher proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Prove typed review matcher with pinned owner
        run: vendor/bin/phpunit tests/SelfShapeMaintenanceReviewMatcherTest.php
      - name: Verify full static type contract without suppressing issues
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
