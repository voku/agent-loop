name: Temporary Codacy PR issue diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/codacy-pr-diagnostic.yml'

permissions:
  contents: read

jobs:
  public-issues:
    if: github.event.pull_request.number == 1044
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public Codacy PR findings without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact PR head: $PR_HEAD"
          endpoint="https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/$PR_NUMBER/issues?status=new&limit=100"
          curl --fail --show-error --silent --location --max-time 15 --retry 1 \
            --header 'Accept: application/json' "$endpoint" -o "$RUNNER_TEMP/codacy-public-issues.json"
          jq -e 'type == "object" and (.data | type == "array")' "$RUNNER_TEMP/codacy-public-issues.json" >/dev/null
          jq -cn --slurpfile issues "$RUNNER_TEMP/codacy-public-issues.json" '{
            count: ($issues[0].data | length),
            high_or_security: [
              $issues[0].data[] |
              select(
                ((.commitIssue.patternInfo.level // .commitIssue.level // .level // "") | tostring | ascii_downcase | test("high|error|critical")) or
                ((.commitIssue.patternInfo.category // .commitIssue.category // .category // "") | tostring | ascii_downcase | test("security"))
              ) |
              {
                path: .commitIssue.filePath,
                line: (.commitIssue.line // .commitIssue.lineNumber // .commitIssue.startLine),
                pattern: .commitIssue.patternInfo.id,
                title: .commitIssue.patternInfo.title,
                level: (.commitIssue.patternInfo.level // .commitIssue.level // .level),
                category: (.commitIssue.patternInfo.category // .commitIssue.category // .category),
                message: (.commitIssue.message // .message)
              }
            ],
            other_patterns: [
              $issues[0].data[] | {
                path: .commitIssue.filePath,
                pattern: .commitIssue.patternInfo.id,
                level: (.commitIssue.patternInfo.level // .commitIssue.level // .level),
                category: (.commitIssue.patternInfo.category // .commitIssue.category // .category)
              }
            ]
          }'
