name: Temporary 761 review-order proof

on:
  push:
    branches:
      - feat/review-bound-guidance-maintenance-761

permissions:
  contents: read

jobs:
  review-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install exact owner in disposable CI workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $json = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $json["require"]["voku/agent-learning"] = "dev-main";
            $json["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($json, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist --no-progress
      - name: Prove actual #758 PR ancestry against GitHub synthetic merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/758/head:refs/remotes/pull/758/head refs/pull/758/merge:refs/remotes/pull/758/merge
          review_base="$(git merge-base refs/remotes/pull/758/head origin/main)"
          synthetic_base="$(git merge-base refs/remotes/pull/758/merge origin/main)"
          test "$review_base" = 622c004e2cc642fce1c06dc63a4f04d4889637e2
          test "$review_base" != "$synthetic_base"
          review_hash="$(git diff --no-ext-diff --binary "$review_base" refs/remotes/pull/758/head -- | sha256sum | cut -d' ' -f1)"
          test "$review_hash" = b44eb7baf127d2b333bb3d75689fb10149d50a4b08d369c7d74af6af4ddef816
          printf 'actual_review_base=%s\\nsynthetic_ci_base=%s\\nexact_diff_hash=%s\\n' "$review_base" "$synthetic_base" "$review_hash"
      - name: Focused GitHub review provenance regression
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/phpunit --filter 'SelfShapeMaintenance(GitHubReader|ReviewCommentVerifier|ApprovalGate|ReviewMatcher)'
      - name: Static and formatting checks
        shell: bash
        run: |
          set -euo pipefail
          composer phpstan -- --no-progress
          composer cs
          git diff --check HEAD
      - name: Deterministic slop-scan regression
        shell: bash
        run: |
          set -euo pipefail
          composer install --working-dir=tools/slop-scan --no-interaction --prefer-dist --no-progress
          php tools/slop-scan/slop-scan.php scan . --config-file slop-scan.config.json --lint
