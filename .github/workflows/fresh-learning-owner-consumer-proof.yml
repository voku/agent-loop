name: Fresh Learning owner consumer proof

on:
  push:
    branches:
      - evidence/767-fresh-learning-consumer-20261011

permissions:
  contents: read

jobs:
  fresh-consumer:
    name: PHP ${{ matrix.php }} fresh consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      CANDIDATE_SHA: 2e6a4d016b261f7b6909767a18f5f2a0d4920f04
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v7
        with:
          ref: 2e6a4d016b261f7b6909767a18f5f2a0d4920f04
          persist-credentials: false
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install candidate dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prove dry-run, bootstrap, capture and idempotence in a fresh consumer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          cli="$GITHUB_WORKSPACE/bin/agent-loop"
          report="$GITHUB_WORKSPACE/build/fresh-learning-consumer/${{ matrix.php }}"
          consumer="$RUNNER_TEMP/learning-consumer-${{ matrix.php }}"
          mkdir -p "$report" "$consumer/dry-run" "$consumer/project"
          (
            cd "$consumer/dry-run"
            php "$cli" init scaffold --dry-run > "$report/dry-run.log"
            test ! -e .agent-loop
          )
          (
            cd "$consumer/project"
            php "$cli" init scaffold > "$report/scaffold-first.log"
            test -d .agent-loop/learning/findings
            test -z "$(find .agent-loop/learning/findings -mindepth 1 -print -quit)"
            php "$cli" learn validate --root .agent-loop/learning > "$report/validate-empty.log"
            php "$cli" learn capture \
              --id finding.2026-10-11.abc123 \
              --task TEST-1 \
              --by ci \
              --scope src/ \
              --observation "Fresh consumer bootstrap passes Learning validation." \
              --hypothesis "Creating the minimum recognized root fixes the bootstrap error." \
              --evidence "Isolated exact-commit GitHub Actions consumer proof." \
              > "$report/capture.log"
            finding=.agent-loop/learning/findings/candidate/finding.2026-10-11.abc123.json
            test -s "$finding"
            before="$(sha256sum "$finding" | cut -d' ' -f1)"
            php "$cli" learn validate --root .agent-loop/learning > "$report/validate-populated.log"
            php "$cli" init scaffold > "$report/scaffold-second.log"
            after="$(sha256sum "$finding" | cut -d' ' -f1)"
            test "$before" = "$after"
          )
          printf 'candidate=%s\nphp=%s\nresult=passed\n' "$CANDIDATE_SHA" "$(php -r 'echo PHP_VERSION;')" > "$report/receipt.txt"
      - name: Preserve exact-candidate consumer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: learning-root-consumer-${{ matrix.php }}-${{ github.sha }}
          if-no-files-found: warn
          path: build/fresh-learning-consumer/${{ matrix.php }}/
