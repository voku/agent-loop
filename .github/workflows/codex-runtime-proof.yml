name: Codex runtime proof

on:
  pull_request:
    paths:
      - '.github/workflows/codex-runtime-proof.yml'
      - 'src/Init/**'
      - 'resources/instructions/**'
      - 'resources/skills/**'
      - 'resources/subagents/**'
      - 'resources/hooks/codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Codex 0.157.0 host consumption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_VERSION: '0.157.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install repository dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install exact Codex runtime
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_NON_INTERACTIVE=1
          export CODEX_INSTALL_DIR="${RUNNER_TEMP}/codex-bin"
          export CODEX_HOME="${RUNNER_TEMP}/codex-install-home"
          curl -fsSL https://chatgpt.com/codex/install.sh |
            sh -s -- --release "${CODEX_VERSION}"
          echo "${CODEX_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Project disposable Codex repository
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/agent-loop-codex-runtime-proof"
          runtime_home="${RUNNER_TEMP}/codex-runtime-home"
          evidence_root="${GITHUB_WORKSPACE}/build/codex-runtime-proof"

          rm -rf "${proof_root}" "${runtime_home}" "${evidence_root}"
          mkdir -p "${proof_root}" "${runtime_home}" "${evidence_root}"
          git -C "${proof_root}" init --initial-branch=main

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init scaffold --demo --agent=codex
            "${GITHUB_WORKSPACE}/bin/agent-loop" init sync-policy --agent=codex
          )

          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${proof_root}"]
          trust_level = "trusted"
          EOF

          echo "PROOF_ROOT=${proof_root}" >> "${GITHUB_ENV}"
          echo "CODEX_HOME=${runtime_home}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"

          cp "${proof_root}/AGENTS.md" "${evidence_root}/projected-AGENTS.md"
          cp "${proof_root}/.codex/skills/.agent-loop-manifest.json" "${evidence_root}/projected-codex-skills-manifest.json"
          cp "${proof_root}/.codex/rules/agent-loop.rules" "${evidence_root}/projected-agent-loop.rules"

      - name: Prove AGENTS.md and repository skill host consumption
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          codex --version | tee "${EVIDENCE_ROOT}/codex-version.txt"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN               codex debug prompt-input
          ) > "${EVIDENCE_ROOT}/prompt-input.json"

          grep -Fq 'agent-loop workflow router' "${EVIDENCE_ROOT}/prompt-input.json"
          grep -Fq 'agent-loop-discipline' "${EVIDENCE_ROOT}/prompt-input.json"

      - name: Prove projected subagent role discovery and selection in Codex runtime
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          server_script="${RUNNER_TEMP}/codex-runtime-proof-server.py"
          request_prefix="${EVIDENCE_ROOT}/subagent-runtime-request"
          port_path="${RUNNER_TEMP}/codex-runtime-proof-port"

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          request_prefix = os.environ["REQUEST_PREFIX"]
          port_path = os.environ["PORT_PATH"]

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  request_number = Handler.request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  if request_number == 1:
                      events = [
                          {
                              "type": "response.created",
                              "response": {"id": "resp-agent-loop-parent"},
                          },
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-agent-loop-selection",
                                  "namespace": "multi_agent_v1",
                                  "name": "spawn_agent",
                                  "arguments": json.dumps({
                                      "message": "Return no content. Deterministic role-selection probe.",
                                      "agent_type": "agent-loop-investigator",
                                      "fork_context": False,
                                  }),
                              },
                          },
                          {
                              "type": "response.completed",
                              "response": {
                                  "id": "resp-agent-loop-parent",
                                  "usage": {
                                      "input_tokens": 0,
                                      "input_tokens_details": None,
                                      "output_tokens": 0,
                                      "output_tokens_details": None,
                                      "total_tokens": 0,
                                  },
                              },
                          },
                      ]
                  else:
                      request = json.loads(body)
                      spawn_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-selection"
                          ),
                          None,
                      )
                      wait_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-wait"
                          ),
                          None,
                      )
                      if spawn_output is not None and wait_output is None:
                          agent_id = json.loads(spawn_output["output"])["agent_id"]
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-wait"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-wait",
                                      "namespace": "multi_agent_v1",
                                      "name": "wait_agent",
                                      "arguments": json.dumps({
                                          "ids": [agent_id],
                                          "timeout_ms": 20000,
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-wait",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      else:
                          events = completed_events(f"resp-agent-loop-{request_number}")

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" python3 "${server_script}" &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          port="$(cat "${port_path}")"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex exec --json \
                -c 'model="proof-model"' \
                -c 'model_provider="mock"' \
                -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                'Delegate this deterministic probe to the agent-loop-investigator subagent.'
          ) > "${EVIDENCE_ROOT}/subagent-runtime-exec.jsonl" 2> "${EVIDENCE_ROOT}/subagent-runtime-exec.stderr"

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

          test -s "${request_prefix}-1.json"

          jq '[.. | objects | select(((.name? // "") | tostring) | test("spawn_agent$"))]' \
            "${request_prefix}-1.json" > "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          jq -e 'length > 0' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json" >/dev/null
          grep -Fq 'agent-loop-investigator' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          child_request=""
          for request in "${request_prefix}"-*.json; do
            if grep -Fq 'Locate. Verify. Report. Stop.' "${request}"; then
              child_request="${request}"
              break
            fi
          done
          test -n "${child_request}"
          cp "${child_request}" "${EVIDENCE_ROOT}/selected-investigator-child-request.json"

      - name: Prove forbidden decisions in Codex execpolicy engine
        shell: bash
        run: |
          set -euo pipefail
          rules="${PROOF_ROOT}/.codex/rules/agent-loop.rules"

          codex execpolicy check --pretty --rules "${rules}"             git push origin HEAD > "${EVIDENCE_ROOT}/execpolicy-git-push.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr create --title proof --body proof > "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr merge 1 > "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json"

          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-git-push.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json" >/dev/null

      - name: Record evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          codex_version="$(cat "${EVIDENCE_ROOT}/codex-version.txt")"

          jq -n             --arg codex_version "${codex_version}"             '{
              schema_version: "1.0",
              codex_version: $codex_version,
              observed: {
                agents_md: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input",
                  status: "observed"
                },
                repository_skill: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input",
                  projected_path: ".codex/skills/agent-loop-discipline/SKILL.md",
                  status: "observed"
                },
                forbidden_rules: {
                  evidence_class: "enforcement_engine",
                  mechanism: "codex execpolicy check with the projected rule file",
                  status: "observed",
                  boundary: "Explicit rule evaluation proves Codex execpolicy decisions; project-rule auto-loading and live shell-tool blocking are not claimed."
                },
                subagent_role_discovery: {
                  evidence_class: "host_consumption",
                  mechanism: "real codex exec request tool contract against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  status: "observed",
                  boundary: "The runtime exposed the projected role in its spawn_agent tool contract."
                },
                subagent_role_selection: {
                  evidence_class: "host_consumption",
                  mechanism: "real multi_agent_v1.spawn_agent call through Codex 0.157.0 against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  child_fingerprint: "Locate. Verify. Report. Stop.",
                  status: "observed",
                  boundary: "The selected child request contains the projected role developer instructions. Effective child permission authority remains a separate proof."
                }
              },
              not_proven_by_this_slice: {
                child_read_only_sandbox_enforcement: true,
                parent_runtime_override_interaction: true,
                hook_trust_or_execution: true,
                project_rule_autoload: true,
                mcp_authority_coverage: true
              }
            }' > "${EVIDENCE_ROOT}/evidence.json"

          (cd "${EVIDENCE_ROOT}" && sha256sum ./* > SHA256SUMS)

      - name: Upload Codex runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: build/codex-runtime-proof
