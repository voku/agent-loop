                                  "arguments": json.dumps({
                                      "cmd": "sed -i 's/before/after/' pre-tool-use-probe.txt",
                                  }),
                              },
                          },
                          {
                              "type": "response.completed",
                              "response": {
                                  "id": "resp-pre-tool-use-deny",
