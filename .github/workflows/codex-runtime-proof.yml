      - name: Prove bounded routing hint injection through paired Codex selection
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          server_script="${RUNNER_TEMP}/codex-routing-0a-server.py"
          fixture_id="routing-001"
          task_prompt="Locate the repository owner for a bounded source-validation question and delegate to exactly one managed specialist."
          base_sha="$(git rev-parse HEAD)"

          export ROUTING_FIXTURE_ID="${fixture_id}"
          export ROUTING_TASK_PROMPT="${task_prompt}"
          export ROUTING_BASE_SHA="${base_sha}"

          php <<'PHP'
          <?php
          require getenv('GITHUB_WORKSPACE') . '/vendor/autoload.php';

          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentFixture;

          $root = getenv('GITHUB_WORKSPACE');
          $evidence = getenv('EVIDENCE_ROOT');
          $fixtureId = getenv('ROUTING_FIXTURE_ID');
          $taskPrompt = getenv('ROUTING_TASK_PROMPT');
          if (!is_string($root) || !is_string($evidence) || !is_string($fixtureId) || !is_string($taskPrompt)) {
              throw new RuntimeException('Missing routing experiment environment.');
          }

          $baseline = RoutingExperimentFixture::baseline($root, $fixtureId, $taskPrompt);
          $hinted = RoutingExperimentFixture::hinted(
              $root,
              $fixtureId,
              $taskPrompt,
              'agent-loop-investigator',
              0.82,
          );

          file_put_contents($evidence . '/routing-0a-candidate-ids.json', json_encode(
              $baseline->candidateIds(),
              JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR,
          ) . "\n");
          file_put_contents($evidence . '/routing-0a-baseline-prompt.txt', $baseline->renderParentPrompt() . "\n");
          file_put_contents($evidence . '/routing-0a-hinted-prompt.txt', $hinted->renderParentPrompt() . "\n");
          PHP

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os
          import re

          arm = os.environ["ROUTING_ARM"]
          candidate_path = os.environ["ROUTING_CANDIDATE_PATH"]
          request_prefix = os.environ["ROUTING_REQUEST_PREFIX"]
          port_path = os.environ["ROUTING_PORT_PATH"]
          selected_path = os.environ["ROUTING_SELECTED_PATH"]

          with open(candidate_path, "r", encoding="utf-8") as handle:
              allowed_candidates = set(json.load(handle))

          def all_strings(value):
              if isinstance(value, str):
                  return [value]
              if isinstance(value, list):
                  result = []
                  for item in value:
                      result.extend(all_strings(item))
                  return result
              if isinstance(value, dict):
                  result = []
                  for item in value.values():
                      result.extend(all_strings(item))
                  return result
              return []

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          def output_for(request, call_id):
              return next(
                  (
                      item
                      for item in request.get("input", [])
                      if item.get("type") == "function_call_output"
                      and item.get("call_id") == call_id
                  ),
                  None,
              )

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0
              selected_candidate = None

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{Handler.request_count}.json", "wb") as handle:
                      handle.write(body)

                  request = json.loads(body)
                  request_text = "\n".join(all_strings(request))
                  spawn_output = output_for(request, "call-routing-0a-spawn")
                  wait_output = output_for(request, "call-routing-0a-wait")

                  fingerprints = {
                      "agent-loop-investigator": "Locate. Verify. Report. Stop.",
                      "agent-loop-code-reviewer": "Review only the supplied diff",
                  }
                  if Handler.selected_candidate is not None and fingerprints[Handler.selected_candidate] in request_text:
                      events = completed_events(f"resp-routing-child-{Handler.request_count}")
                  elif spawn_output is not None and wait_output is None:
                      agent_id = json.loads(spawn_output["output"])["agent_id"]
                      events = [
                          {"type": "response.created", "response": {"id": "resp-routing-wait"}},
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-routing-0a-wait",
                                  "namespace": "multi_agent_v1",
                                  "name": "wait_agent",
                                  "arguments": json.dumps({
                                      "targets": [agent_id],
                                      "timeout_ms": 20000,
                                  }),
                              },
                          },
                          *completed_events("resp-routing-wait-complete")[1:],
                      ]
                  elif wait_output is not None:
                      events = completed_events(f"resp-routing-parent-complete-{Handler.request_count}")
                  else:
                      marker = re.search(
                          r"<agent-loop-routing-hint>\s*(\{.*?\})\s*</agent-loop-routing-hint>",
                          request_text,
                          re.DOTALL,
                      )
                      if arm == "baseline":
                          if marker is not None:
                              raise RuntimeError("Baseline arm unexpectedly received a routing hint.")
                          selected = "agent-loop-code-reviewer"
                      else:
                          if marker is None:
                              raise RuntimeError("Hinted arm did not receive the routing hint.")
                          hint = json.loads(marker.group(1))
                          if hint.get("authority") != "advisory" or hint.get("host_retains_final_selection") is not True:
                              raise RuntimeError("Routing hint lost its advisory authority boundary.")
                          selected = hint["candidate_id"]

                      if selected not in allowed_candidates:
                          raise RuntimeError(f"Unknown routing candidate: {selected}")
                      if selected not in fingerprints:
                          raise RuntimeError(f"Fixture has no child fingerprint for: {selected}")

                      Handler.selected_candidate = selected
                      with open(selected_path, "w", encoding="utf-8") as handle:
                          handle.write(selected)

                      events = [
                          {"type": "response.created", "response": {"id": "resp-routing-spawn"}},
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-routing-0a-spawn",
                                  "namespace": "multi_agent_v1",
                                  "name": "spawn_agent",
                                  "arguments": json.dumps({
                                      "message": "Return no content. Deterministic bounded routing experiment.",
                                      "agent_type": selected,
                                      "fork_context": False,
                                  }),
                              },
                          },
                          *completed_events("resp-routing-spawn-complete")[1:],
                      ]

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          run_arm() {
            local arm="$1"
            local prompt_path="${EVIDENCE_ROOT}/routing-0a-${arm}-prompt.txt"
            local request_prefix="${EVIDENCE_ROOT}/routing-0a-${arm}-request"
            local selected_path="${EVIDENCE_ROOT}/routing-0a-${arm}-selected.txt"
            local port_path="${RUNNER_TEMP}/routing-0a-${arm}-port"
            local arm_home="${RUNNER_TEMP}/routing-0a-${arm}-home"

            rm -rf "${arm_home}"
            rm -f "${port_path}" "${selected_path}" "${request_prefix}"-*.json
            mkdir -p "${arm_home}"
            cat > "${arm_home}/config.toml" <<EOF
          [projects."${PROOF_ROOT}"]
          trust_level = "trusted"
          EOF

            ROUTING_ARM="${arm}" \
            ROUTING_CANDIDATE_PATH="${EVIDENCE_ROOT}/routing-0a-candidate-ids.json" \
            ROUTING_REQUEST_PREFIX="${request_prefix}" \
            ROUTING_PORT_PATH="${port_path}" \
            ROUTING_SELECTED_PATH="${selected_path}" \
              python3 "${server_script}" &
            local server_pid=$!

            for _ in $(seq 1 100); do
              if test -s "${port_path}"; then
                break
              fi
              sleep 0.05
            done
            test -s "${port_path}"
            local port
            port="$(cat "${port_path}")"

            (
              cd "${PROOF_ROOT}"
              CODEX_HOME="${arm_home}" env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
                codex exec --ephemeral --json \
                  -c 'model="proof-model"' \
                  -c 'model_provider="mock"' \
                  -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                  "$(cat "${prompt_path}")"
            ) > "${EVIDENCE_ROOT}/routing-0a-${arm}-exec.jsonl" \
              2> "${EVIDENCE_ROOT}/routing-0a-${arm}-exec.stderr"

            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true

            test -s "${selected_path}"
            local selected
            selected="$(cat "${selected_path}")"
            local fingerprint
            case "${selected}" in
              agent-loop-investigator) fingerprint='Locate. Verify. Report. Stop.' ;;
              agent-loop-code-reviewer) fingerprint='Review only the supplied diff' ;;
              *) printf 'unexpected selected candidate: %s\n' "${selected}" >&2; return 1 ;;
            esac

            local child_request=""
            local spawn_result=""
            local wait_result=""
            for request in "${request_prefix}"-*.json; do
              if grep -Fq "${fingerprint}" "${request}"; then
                child_request="${request}"
              fi
              if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-spawn")' "${request}" >/dev/null 2>&1; then
                spawn_result="${request}"
              fi
              if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-wait")' "${request}" >/dev/null 2>&1; then
                wait_result="${request}"
              fi
            done
            test -n "${child_request}"
            test -n "${spawn_result}"
            test -n "${wait_result}"
            jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-wait") | .output | fromjson | (.timed_out == false and (.status | length > 0))' \
              "${wait_result}" >/dev/null
          }

          run_arm baseline
          run_arm hinted

          test "$(cat "${EVIDENCE_ROOT}/routing-0a-baseline-selected.txt")" = 'agent-loop-code-reviewer'
          test "$(cat "${EVIDENCE_ROOT}/routing-0a-hinted-selected.txt")" = 'agent-loop-investigator'

          php <<'PHP'
          <?php
          require getenv('GITHUB_WORKSPACE') . '/vendor/autoload.php';

          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentFixture;
          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentReceipt;

          $root = getenv('GITHUB_WORKSPACE');
          $evidence = getenv('EVIDENCE_ROOT');
          $fixtureId = getenv('ROUTING_FIXTURE_ID');
          $taskPrompt = getenv('ROUTING_TASK_PROMPT');
          $baseSha = getenv('ROUTING_BASE_SHA');
          if (!is_string($root) || !is_string($evidence) || !is_string($fixtureId) || !is_string($taskPrompt) || !is_string($baseSha)) {
              throw new RuntimeException('Missing routing receipt environment.');
          }

          $fixtures = [
              'baseline' => RoutingExperimentFixture::baseline($root, $fixtureId, $taskPrompt),
              'hinted' => RoutingExperimentFixture::hinted(
                  $root,
                  $fixtureId,
                  $taskPrompt,
                  'agent-loop-investigator',
                  0.82,
              ),
          ];

          foreach ($fixtures as $arm => $fixture) {
              $selected = trim((string) file_get_contents($evidence . '/routing-0a-' . $arm . '-selected.txt'));
              $receipt = RoutingExperimentReceipt::observe(
                  $fixture,
                  $baseSha,
                  $selected,
                  true,
                  true,
                  true,
              );
              file_put_contents(
                  $evidence . '/routing-0a-' . $arm . '-receipt.json',
                  json_encode($receipt->toArray(), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n",
              );
          }
          PHP

          jq -e '.arm == "baseline" and .hint == null and .selected_candidate_id == "agent-loop-code-reviewer" and .spawn_observed and .child_started and .wait_completed' \
            "${EVIDENCE_ROOT}/routing-0a-baseline-receipt.json" >/dev/null
          jq -e '.arm == "hinted"
            and .hint == {"candidate_id":"agent-loop-investigator","probability":0.82}
            and (.hint | has("authority") | not)
            and (.hint | has("host_retains_final_selection") | not)' \
            "${EVIDENCE_ROOT}/routing-0a-hinted-receipt.json" >/dev/null
          jq -e '.arm == "hinted" and .hint.candidate_id == "agent-loop-investigator" and .selected_candidate_id == "agent-loop-investigator" and .spawn_observed and .child_started and .wait_completed' \
            "${EVIDENCE_ROOT}/routing-0a-hinted-receipt.json" >/dev/null

      - name: Prove forbidden decisions in Codex execpolicy engine
        shell: bash
        run: |
          set -euo pipefail
          rules="${PROOF_ROOT}/.codex/rules/agent-loop.rules"

          codex execpolicy check --pretty --rules "${rules}"             git push origin HEAD > "${EVIDENCE_ROOT}/execpolicy-git-push.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr create --title proof --body proof > "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr merge 1 > "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json"

          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-git-push.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json" >/dev/null

      - name: Record evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          codex_version="$(cat "${EVIDENCE_ROOT}/codex-version.txt")"
          parent_write_outcome="$(cat "${EVIDENCE_ROOT}/parent-write-outcome.txt")"
          child_write_outcome="$(cat "${EVIDENCE_ROOT}/child-write-outcome.txt")"
          child_authority_outcome="$(cat "${EVIDENCE_ROOT}/child-read-only-outcome.txt")"
          repository_head_sha="$(cat "${EVIDENCE_ROOT}/repository-head-sha.txt")"
          repository_base_sha="$(cat "${EVIDENCE_ROOT}/repository-base-sha.txt")"
          dependency_graph_sha256="$(cat "${EVIDENCE_ROOT}/dependency-graph.sha256")"
          projection_before="$(cat "${EVIDENCE_ROOT}/projection-before-reinstall.sha256")"
          projection_after="$(cat "${EVIDENCE_ROOT}/projection-after-reinstall.sha256")"
          prompt_marker_counts="$(cat "${EVIDENCE_ROOT}/prompt-marker-counts.json")"
          session_start_hook_proof="$(cat "${EVIDENCE_ROOT}/session-start-hook-proof.json")"
          persisted_hook_hash_trust_proof="$(cat "${EVIDENCE_ROOT}/persisted-hook-hash-trust-proof.json")"
          subagent_start_hook_proof="$(cat "${EVIDENCE_ROOT}/subagent-start-hook-proof.json")"
          pre_tool_use_hook_proof="$(cat "${EVIDENCE_ROOT}/pre-tool-use-hook-proof.json")"
          project_rule_live_proof="$(cat "${EVIDENCE_ROOT}/project-rule-live-proof.json")"

          jq -n \
            --arg codex_version "${codex_version}" \
            --arg repository_head_sha "${repository_head_sha}" \
            --arg repository_base_sha "${repository_base_sha}" \
            --arg dependency_graph_sha256 "${dependency_graph_sha256}" \
            --arg projection_before "${projection_before}" \
            --arg projection_after "${projection_after}" \
            --argjson prompt_marker_counts "${prompt_marker_counts}" \
            --argjson session_start_hook_proof "${session_start_hook_proof}" \
            --argjson persisted_hook_hash_trust_proof "${persisted_hook_hash_trust_proof}" \
            --argjson subagent_start_hook_proof "${subagent_start_hook_proof}" \
            --argjson pre_tool_use_hook_proof "${pre_tool_use_hook_proof}" \
            --argjson project_rule_live_proof "${project_rule_live_proof}" \
            --arg parent_write_outcome "${parent_write_outcome}" \
            --arg child_write_outcome "${child_write_outcome}" \
            --arg child_authority_outcome "${child_authority_outcome}" \
            '{
              schema_version: "1.0",
              codex_version: $codex_version,
              repository: {
                head_sha: $repository_head_sha,
                base_sha: $repository_base_sha
              },
              dependency_graph_sha256: $dependency_graph_sha256,
              projection_identity: {
                before_reinstall: $projection_before,
                after_reinstall: $projection_after
              },
              observed: {
                agents_md: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input",
                  status: "observed"
                },
                repository_skill: {
                  evidence_class: "host_runtime_discovery",
                  mechanism: "codex debug prompt-input skill inventory",
                  projected_path: ".codex/skills/agent-loop-discipline/SKILL.md",
                  discovery_entry_count: 1,
                  status: "observed",
                  boundary: "Codex advertises the installed repository skill once; its body is progressively disclosed and is not expected to be inlined into the initial prompt."
                },
                reinstall_convergence: {
                  evidence_class: "installed_projection",
                  mechanism: "two consecutive init install-assets --agent=codex runs with identical owned projection digest",
                  status: "observed"
                },
                exact_once_context_consumption: {
                  evidence_class: "host_consumption",
                  mechanism: "paired fresh codex debug prompt-input processes before and after reinstall",
                  marker_counts: $prompt_marker_counts,
                  status: "observed",
                  boundary: "This proves the always-on managed router is consumed once and the repository skill is discovered once in separate fresh runtime processes before and after reinstall. Skill-body loading is progressive and is not claimed here."
                },
                session_start_hook_trust_execution: {
                  evidence_class: "host_runtime_execution",
                  mechanism: "paired real codex exec requests from an installed consumer with package-vetted hook hash trust bypassed and project trust varied between trusted and untrusted",
                  trusted_context_marker_count: $session_start_hook_proof.trusted_context_marker_count,
                  untrusted_context_marker_count: $session_start_hook_proof.untrusted_context_marker_count,
                  status: "observed",
                  boundary: "This proves the projected project SessionStart hook executes for a trusted project and is not consumed for an untrusted project in Codex 0.157.0: the observed marker is a resume-hint line generated at hook runtime from a unique unfinished-run manifest and is absent from static projected skills/instructions. The CI-only --dangerously-bypass-hook-trust flag removes per-hook hash review as a variable in this paired project-trust proof. Persisted hash trust is recorded separately in persisted_hook_hash_trust; interactive /hooks review remains unproven. PreToolUse enforcement is recorded separately in pre_tool_use_hook_deny."
                },
                persisted_hook_hash_trust: {
                  evidence_class: "host_runtime_trust",
                  mechanism: "Codex 0.157.0 app-server hooks/list + config/batchWrite persisted trusted_hash, followed by fresh codex exec processes without --dangerously-bypass-hook-trust",
                  hook_key: $persisted_hook_hash_trust_proof.key,
                  initial_hash: $persisted_hook_hash_trust_proof.initial_hash,
                  modified_hash: $persisted_hook_hash_trust_proof.modified_hash,
                  initial_trust_status: $persisted_hook_hash_trust_proof.initial_trust_status,
                  trusted_trust_status: $persisted_hook_hash_trust_proof.trusted_trust_status,
                  modified_trust_status: $persisted_hook_hash_trust_proof.modified_trust_status,
                  session_start_invocations_before_trust: $persisted_hook_hash_trust_proof.session_start_invocations_before_trust,
                  session_start_invocations_after_trust: $persisted_hook_hash_trust_proof.session_start_invocations_after_trust,
                  session_start_invocations_after_modification: $persisted_hook_hash_trust_proof.session_start_invocations_after_modification,
                  runtime_bypass_hook_trust: $persisted_hook_hash_trust_proof.runtime_bypass_hook_trust,
                  status: "observed",
                  boundary: "This proves the non-interactive persisted trusted_hash contract for the projected SessionStart hook: an untrusted hook is skipped, the exact current hash persisted through Codex app-server makes a fresh runtime execute it, and a later hook-content hash change moves trust to modified and suppresses execution again. It does not prove the interactive /hooks review UI or its user interaction."
                },
                subagent_start_hook_execution: {
                  evidence_class: "host_runtime_execution",
                  mechanism: "a second real codex exec subagent selection run after the hook-free authority proof, with the byte-identical projected hook command observed through a PATH-only php invocation wrapper",
                  session_start_invocation_count: $subagent_start_hook_proof.session_start_invocation_count,
                  subagent_start_invocation_count: $subagent_start_hook_proof.subagent_start_invocation_count,
                  status: "observed",
                  boundary: "This proves Codex 0.157.0 invokes the projected context.php command with --event=SubagentStart for the selected agent-loop-investigator child. The observer changes PATH only and execs the same real PHP interpreter with the original arguments; it does not rewrite hooks.json or the projected hook script. Hook-hash review remains bypassed only for the package-vetted CI fixture. This record does not cover PreToolUse; see pre_tool_use_hook_deny."
                },
                pre_tool_use_hook_deny: {
                  evidence_class: "host_runtime_enforcement",
                  mechanism: "real Codex 0.157.0 exec_command request against a disposable file with the unchanged projected PreToolUse hook",
                  command: $pre_tool_use_hook_proof.command,
                  hook_invocation_count: $pre_tool_use_hook_proof.hook_invocation_count,
                  deny_reason: $pre_tool_use_hook_proof.deny_reason,
                  deny_reason_observed_in_tool_output: $pre_tool_use_hook_proof.deny_reason_observed_in_tool_output,
                  probe_after: $pre_tool_use_hook_proof.probe_after,
                  status: "observed",
                  boundary: "The live Codex turn invoked the projected PreToolUse policy exactly once, surfaced the hook denial as the tool result, and left the disposable file unchanged. This proves enforcement for the canonical exec_command/Bash route and this bounded in-place sed shape only; wrapper/path variants, MCP, and unrelated tool routes remain unclaimed. Hook-hash review remains bypassed only for the package-vetted CI fixture."
                },
                forbidden_rules: {
                  evidence_class: "enforcement_engine",
                  mechanism: "codex execpolicy check with the projected rule file",
                  status: "observed",
                  boundary: "Explicit rule evaluation independently proves the projected rule decisions."
                },
                project_rule_autoload_live_blocking: {
                  evidence_class: "host_runtime_enforcement",
                  mechanism: "real Codex 0.157.0 exec_command request with no explicit --rules argument and no projected hooks present",
                  command: $project_rule_live_proof.command,
                  projected_rule: $project_rule_live_proof.projected_rule,
                  explicit_rules_argument: $project_rule_live_proof.explicit_rules_argument,
                  git_process_invoked: $project_rule_live_proof.git_process_invoked,
                  rejection_observed_in_tool_output: $project_rule_live_proof.rejection_observed_in_tool_output,
                  rejection: $project_rule_live_proof.rejection,
                  status: "observed",
                  boundary: "This proves Codex 0.157.0 auto-loads the trusted project .codex/rules policy for the canonical exec_command shell route and rejects git push origin HEAD before the git process starts. Hooks are not projected at this point, so the denial cannot be attributed to PreToolUse. MCP and unrelated tool routes remain unclaimed."
                },
                subagent_role_discovery: {
                  evidence_class: "host_consumption",
                  mechanism: "real codex exec request tool contract against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  status: "observed",
                  boundary: "The runtime exposed the projected role in its spawn_agent tool contract."
                },
                subagent_role_selection: {
                  evidence_class: "host_consumption",
                  mechanism: "real multi_agent_v1.spawn_agent call through Codex 0.157.0 against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  child_fingerprint: "Locate. Verify. Report. Stop.",
                  status: "observed",
                  boundary: "The selected child request contains the projected role developer instructions."
                },
                subagent_read_only_authority: {
                  evidence_class: "runtime_authority",
                  mechanism: "parent control and selected child each execute the same real exec_command write attempt against disposable repository sentinels",
                  projected_role: "agent-loop-investigator",
                  projected_sandbox_mode: "read-only",
                  parent_write_outcome: $parent_write_outcome,
                  child_write_outcome: $child_write_outcome,
                  outcome: $child_authority_outcome,
                  status: "observed",
                  sandbox_backend: "bubblewrap",
                  runner_prerequisite: "GitHub runner AppArmor unprivileged-userns restriction disabled for the disposable proof job when that sysctl exists",
                  boundary: "No explicit parent sandbox override is supplied; hooks and MCP are not part of this proof. The runner prerequisite only permits the Codex bubblewrap sandbox to start; it does not alter the parent or child permission profile. Only a parent-success/child-filesystem-block differential proves read-only enforcement."
                }
              },
              not_proven_by_this_slice: {
                parent_runtime_override_interaction: true,
                interactive_hook_review_persistence: true,
                mcp_authority_coverage: true
              }
            }' > "${EVIDENCE_ROOT}/evidence.json"

          (cd "${EVIDENCE_ROOT}" && sha256sum ./* > SHA256SUMS)

      - name: Upload Codex runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: build/codex-runtime-proof
