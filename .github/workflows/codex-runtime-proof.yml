name: Codex runtime proof

on:
  pull_request:
    paths:
      - '.github/workflows/codex-runtime-proof.yml'
      - 'src/Init/**'
      - 'resources/instructions/**'
      - 'resources/skills/**'
      - 'resources/subagents/**'
      - 'tools/Dogfood/Routing/**'
      - 'resources/hooks/codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Codex 0.157.0 host consumption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_VERSION: '0.157.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install repository dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install exact Codex runtime
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_NON_INTERACTIVE=1
          export CODEX_INSTALL_DIR="${RUNNER_TEMP}/codex-bin"
          export CODEX_HOME="${RUNNER_TEMP}/codex-install-home"
          curl -fsSL https://chatgpt.com/codex/install.sh |
            sh -s -- --release "${CODEX_VERSION}"
          echo "${CODEX_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Project disposable Codex repository
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/agent-loop-codex-runtime-proof"
          runtime_home="${RUNNER_TEMP}/codex-runtime-home"
          evidence_root="${GITHUB_WORKSPACE}/build/codex-runtime-proof"

          rm -rf "${proof_root}" "${runtime_home}" "${evidence_root}"
          mkdir -p "${proof_root}" "${runtime_home}" "${evidence_root}"
          git -C "${proof_root}" init --initial-branch=main

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init scaffold --demo --agent=codex
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=codex

            projection_digest() {
              {
                sha256sum AGENTS.md
                find .codex/skills .codex/agents -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            }

            before="$(projection_digest)"
            printf '%s\n' "${before}" > "${evidence_root}/projection-before-reinstall.sha256"

            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=codex

            after="$(projection_digest)"
            printf '%s\n' "${after}" > "${evidence_root}/projection-after-reinstall.sha256"
            test "${before}" = "${after}"

            "${GITHUB_WORKSPACE}/bin/agent-loop" init sync-policy --agent=codex
          )

          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sysctl -n kernel.apparmor_restrict_unprivileged_userns > "${evidence_root}/apparmor-userns-before.txt"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            sysctl -n kernel.apparmor_restrict_unprivileged_userns > "${evidence_root}/apparmor-userns-after.txt"
            test "$(cat "${evidence_root}/apparmor-userns-after.txt")" = '0'
          else
            printf '%s\n' 'unavailable' > "${evidence_root}/apparmor-userns-before.txt"
            printf '%s\n' 'unavailable' > "${evidence_root}/apparmor-userns-after.txt"
          fi

          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${proof_root}"]
          trust_level = "trusted"
          EOF

          echo "PROOF_ROOT=${proof_root}" >> "${GITHUB_ENV}"
          echo "CODEX_HOME=${runtime_home}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"

          cp "${proof_root}/AGENTS.md" "${evidence_root}/projected-AGENTS.md"
          cp "${proof_root}/.codex/skills/.agent-loop-manifest.json" "${evidence_root}/projected-codex-skills-manifest.json"
          cp "${proof_root}/.codex/rules/agent-loop.rules" "${evidence_root}/projected-agent-loop.rules"

      - name: Prove AGENTS.md and repository skill host consumption
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          codex --version | tee "${EVIDENCE_ROOT}/codex-version.txt"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN               codex debug prompt-input
          ) > "${EVIDENCE_ROOT}/prompt-input.json"

          python3 - "${EVIDENCE_ROOT}/prompt-input.json" "${EVIDENCE_ROOT}/prompt-marker-counts.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from strings(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from strings(item)

          observed = "\n".join(strings(payload))
          markers = {
              "managed_router": "## agent-loop workflow router",
              "discipline_body": "# Agent Loop Discipline",
          }
          counts = {name: observed.count(marker) for name, marker in markers.items()}
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(counts, handle, indent=2, sort_keys=True)
              handle.write("\n")

          for name, count in counts.items():
              if count != 1:
                  raise SystemExit(f"{name} expected exactly once, observed {count}")
          PY

      - name: Prove projected subagent role discovery and selection in Codex runtime
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          server_script="${RUNNER_TEMP}/codex-runtime-proof-server.py"
          request_prefix="${EVIDENCE_ROOT}/subagent-runtime-request"
          port_path="${RUNNER_TEMP}/codex-runtime-proof-port"

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          request_prefix = os.environ["REQUEST_PREFIX"]
          port_path = os.environ["PORT_PATH"]

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  request_number = Handler.request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  if request_number == 1:
                      events = [
                          {
                              "type": "response.created",
                              "response": {"id": "resp-agent-loop-parent-write"},
                          },
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-agent-loop-parent-write",
                                  "name": "exec_command",
                                  "arguments": json.dumps({
                                      "cmd": "printf 'parent-authority-probe\\n' > .agent-loop-parent-authority-probe",
                                  }),
                              },
                          },
                          {
                              "type": "response.completed",
                              "response": {
                                  "id": "resp-agent-loop-parent-write",
                                  "usage": {
                                      "input_tokens": 0,
                                      "input_tokens_details": None,
                                      "output_tokens": 0,
                                      "output_tokens_details": None,
                                      "total_tokens": 0,
                                  },
                              },
                          },
                      ]
                  else:
                      request = json.loads(body)
                      request_text = body.decode("utf-8", errors="replace")
                      parent_write_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-parent-write"
                          ),
                          None,
                      )
                      child_write_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-child-write"
                          ),
                          None,
                      )
                      spawn_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-selection"
                          ),
                          None,
                      )
                      wait_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-wait"
                          ),
                          None,
                      )
                      if child_write_output is not None:
                          events = completed_events(f"resp-agent-loop-child-complete-{request_number}")
                      elif "Locate. Verify. Report. Stop." in request_text:
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-child-write"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-child-write",
                                      "name": "exec_command",
                                      "arguments": json.dumps({
                                          "cmd": "printf 'child-authority-probe\\n' > .agent-loop-child-authority-probe",
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-child-write",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      elif parent_write_output is not None and spawn_output is None:
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-parent-spawn"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-selection",
                                      "namespace": "multi_agent_v1",
                                      "name": "spawn_agent",
                                      "arguments": json.dumps({
                                          "message": "Return no content. Deterministic role-selection probe.",
                                          "agent_type": "agent-loop-investigator",
                                          "fork_context": False,
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-parent-spawn",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      elif spawn_output is not None and wait_output is None:
                          agent_id = json.loads(spawn_output["output"])["agent_id"]
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-wait"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-wait",
                                      "namespace": "multi_agent_v1",
                                      "name": "wait_agent",
                                      "arguments": json.dumps({
                                          "targets": [agent_id],
                                          "timeout_ms": 20000,
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-wait",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      else:
                          events = completed_events(f"resp-agent-loop-{request_number}")

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" python3 "${server_script}" &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          port="$(cat "${port_path}")"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex exec --json \
                -c 'model="proof-model"' \
                -c 'model_provider="mock"' \
                -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                'Delegate this deterministic probe to the agent-loop-investigator subagent.'
          ) > "${EVIDENCE_ROOT}/subagent-runtime-exec.jsonl" 2> "${EVIDENCE_ROOT}/subagent-runtime-exec.stderr"

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

          test -s "${request_prefix}-1.json"

          jq '[.. | objects | select(((.name? // "") | tostring) | test("spawn_agent$"))]' \
            "${request_prefix}-1.json" > "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          jq -e 'length > 0' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json" >/dev/null
          grep -Fq 'agent-loop-investigator' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          child_request=""
          for request in "${request_prefix}"-*.json; do
            if grep -Fq 'Locate. Verify. Report. Stop.' "${request}"; then
              child_request="${request}"
              break
            fi
          done
          test -n "${child_request}"
          cp "${child_request}" "${EVIDENCE_ROOT}/selected-investigator-child-request.json"

          parent_write_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-parent-write")' "${request}" >/dev/null 2>&1; then
              parent_write_result="${request}"
              break
            fi
          done
          test -n "${parent_write_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-parent-write")'             "${parent_write_result}" > "${EVIDENCE_ROOT}/parent-write-tool-output.json"

          child_write_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-child-write")' "${request}" >/dev/null 2>&1; then
              child_write_result="${request}"
              break
            fi
          done
          test -n "${child_write_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-child-write")'             "${child_write_result}" > "${EVIDENCE_ROOT}/child-write-tool-output.json"

          wait_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-wait")' "${request}" >/dev/null 2>&1; then
              wait_result="${request}"
              break
            fi
          done
          test -n "${wait_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-wait")'             "${wait_result}" > "${EVIDENCE_ROOT}/wait-agent-tool-output.json"
          jq -e '.output | fromjson | (.timed_out == false and (.status | length > 0))'             "${EVIDENCE_ROOT}/wait-agent-tool-output.json" >/dev/null

          classify_write() {
            local sentinel_path="$1"
            local output_path="$2"
            local result_path="$3"

            if test -f "${sentinel_path}"; then
              printf '%s\n' 'write_succeeded' > "${result_path}"
            elif grep -Eiq 'bwrap:.*(operation not permitted|permission denied)|failed rtm_newaddr' "${output_path}"; then
              printf '%s\n' 'sandbox_launch_failed' > "${result_path}"
            elif grep -Eiq 'read-only file system|permission denied' "${output_path}"; then
              printf '%s\n' 'filesystem_write_blocked' > "${result_path}"
            else
              printf '%s\n' 'write_failed_ambiguous' > "${result_path}"
            fi
          }

          classify_write             "${PROOF_ROOT}/.agent-loop-parent-authority-probe"             "${EVIDENCE_ROOT}/parent-write-tool-output.json"             "${EVIDENCE_ROOT}/parent-write-outcome.txt"
          classify_write             "${PROOF_ROOT}/.agent-loop-child-authority-probe"             "${EVIDENCE_ROOT}/child-write-tool-output.json"             "${EVIDENCE_ROOT}/child-write-outcome.txt"

          if test -f "${PROOF_ROOT}/.agent-loop-parent-authority-probe"; then
            cp "${PROOF_ROOT}/.agent-loop-parent-authority-probe" "${EVIDENCE_ROOT}/parent-write-sentinel.txt"
          fi
          if test -f "${PROOF_ROOT}/.agent-loop-child-authority-probe"; then
            cp "${PROOF_ROOT}/.agent-loop-child-authority-probe" "${EVIDENCE_ROOT}/child-write-sentinel.txt"
          fi

          parent_outcome="$(cat "${EVIDENCE_ROOT}/parent-write-outcome.txt")"
          child_outcome="$(cat "${EVIDENCE_ROOT}/child-write-outcome.txt")"
          if test "${parent_outcome}" = 'write_succeeded' && test "${child_outcome}" = 'filesystem_write_blocked'; then
            printf '%s\n' 'role_read_only_enforced' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          elif test "${parent_outcome}" = 'write_succeeded' && test "${child_outcome}" = 'write_succeeded'; then
            printf '%s\n' 'role_read_only_not_enforced' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          else
            printf '%s\n' 'inconclusive_environment' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          fi

      - name: Prove bounded routing hint injection through paired Codex selection
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          server_script="${RUNNER_TEMP}/codex-routing-0a-server.py"
          fixture_id="routing-001"
          task_prompt="Locate the repository owner for a bounded source-validation question and delegate to exactly one managed specialist."
          base_sha="$(git rev-parse HEAD)"

          export ROUTING_FIXTURE_ID="${fixture_id}"
          export ROUTING_TASK_PROMPT="${task_prompt}"
          export ROUTING_BASE_SHA="${base_sha}"

          php <<'PHP'
          <?php
          require getenv('GITHUB_WORKSPACE') . '/vendor/autoload.php';

          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentFixture;

          $root = getenv('GITHUB_WORKSPACE');
          $evidence = getenv('EVIDENCE_ROOT');
          $fixtureId = getenv('ROUTING_FIXTURE_ID');
          $taskPrompt = getenv('ROUTING_TASK_PROMPT');
          if (!is_string($root) || !is_string($evidence) || !is_string($fixtureId) || !is_string($taskPrompt)) {
              throw new RuntimeException('Missing routing experiment environment.');
          }

          $baseline = RoutingExperimentFixture::baseline($root, $fixtureId, $taskPrompt);
          $hinted = RoutingExperimentFixture::hinted(
              $root,
              $fixtureId,
              $taskPrompt,
              'agent-loop-investigator',
              0.82,
          );

          file_put_contents($evidence . '/routing-0a-candidate-ids.json', json_encode(
              $baseline->candidateIds(),
              JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR,
          ) . "\n");
          file_put_contents($evidence . '/routing-0a-baseline-prompt.txt', $baseline->renderParentPrompt() . "\n");
          file_put_contents($evidence . '/routing-0a-hinted-prompt.txt', $hinted->renderParentPrompt() . "\n");
          PHP

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os
          import re

          arm = os.environ["ROUTING_ARM"]
          candidate_path = os.environ["ROUTING_CANDIDATE_PATH"]
          request_prefix = os.environ["ROUTING_REQUEST_PREFIX"]
          port_path = os.environ["ROUTING_PORT_PATH"]
          selected_path = os.environ["ROUTING_SELECTED_PATH"]

          with open(candidate_path, "r", encoding="utf-8") as handle:
              allowed_candidates = set(json.load(handle))

          def all_strings(value):
              if isinstance(value, str):
                  return [value]
              if isinstance(value, list):
                  result = []
                  for item in value:
                      result.extend(all_strings(item))
                  return result
              if isinstance(value, dict):
                  result = []
                  for item in value.values():
                      result.extend(all_strings(item))
                  return result
              return []

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          def output_for(request, call_id):
              return next(
                  (
                      item
                      for item in request.get("input", [])
                      if item.get("type") == "function_call_output"
                      and item.get("call_id") == call_id
                  ),
                  None,
              )

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0
              selected_candidate = None

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{Handler.request_count}.json", "wb") as handle:
                      handle.write(body)

                  request = json.loads(body)
                  request_text = "\n".join(all_strings(request))
                  spawn_output = output_for(request, "call-routing-0a-spawn")
                  wait_output = output_for(request, "call-routing-0a-wait")

                  fingerprints = {
                      "agent-loop-investigator": "Locate. Verify. Report. Stop.",
                      "agent-loop-code-reviewer": "Review only the supplied diff",
                  }
                  if Handler.selected_candidate is not None and fingerprints[Handler.selected_candidate] in request_text:
                      events = completed_events(f"resp-routing-child-{Handler.request_count}")
                  elif spawn_output is not None and wait_output is None:
                      agent_id = json.loads(spawn_output["output"])["agent_id"]
                      events = [
                          {"type": "response.created", "response": {"id": "resp-routing-wait"}},
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-routing-0a-wait",
                                  "namespace": "multi_agent_v1",
                                  "name": "wait_agent",
                                  "arguments": json.dumps({
                                      "targets": [agent_id],
                                      "timeout_ms": 20000,
                                  }),
                              },
                          },
                          *completed_events("resp-routing-wait-complete")[1:],
                      ]
                  elif wait_output is not None:
                      events = completed_events(f"resp-routing-parent-complete-{Handler.request_count}")
                  else:
                      marker = re.search(
                          r"<agent-loop-routing-hint>\s*(\{.*?\})\s*</agent-loop-routing-hint>",
                          request_text,
                          re.DOTALL,
                      )
                      if arm == "baseline":
                          if marker is not None:
                              raise RuntimeError("Baseline arm unexpectedly received a routing hint.")
                          selected = "agent-loop-code-reviewer"
                      else:
                          if marker is None:
                              raise RuntimeError("Hinted arm did not receive the routing hint.")
                          hint = json.loads(marker.group(1))
                          if hint.get("authority") != "advisory" or hint.get("host_retains_final_selection") is not True:
                              raise RuntimeError("Routing hint lost its advisory authority boundary.")
                          selected = hint["candidate_id"]

                      if selected not in allowed_candidates:
                          raise RuntimeError(f"Unknown routing candidate: {selected}")
                      if selected not in fingerprints:
                          raise RuntimeError(f"Fixture has no child fingerprint for: {selected}")

                      Handler.selected_candidate = selected
                      with open(selected_path, "w", encoding="utf-8") as handle:
                          handle.write(selected)

                      events = [
                          {"type": "response.created", "response": {"id": "resp-routing-spawn"}},
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-routing-0a-spawn",
                                  "namespace": "multi_agent_v1",
                                  "name": "spawn_agent",
                                  "arguments": json.dumps({
                                      "message": "Return no content. Deterministic bounded routing experiment.",
                                      "agent_type": selected,
                                      "fork_context": False,
                                  }),
                              },
                          },
                          *completed_events("resp-routing-spawn-complete")[1:],
                      ]

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          run_arm() {
            local arm="$1"
            local prompt_path="${EVIDENCE_ROOT}/routing-0a-${arm}-prompt.txt"
            local request_prefix="${EVIDENCE_ROOT}/routing-0a-${arm}-request"
            local selected_path="${EVIDENCE_ROOT}/routing-0a-${arm}-selected.txt"
            local port_path="${RUNNER_TEMP}/routing-0a-${arm}-port"
            local arm_home="${RUNNER_TEMP}/routing-0a-${arm}-home"

            rm -rf "${arm_home}"
            rm -f "${port_path}" "${selected_path}" "${request_prefix}"-*.json
            mkdir -p "${arm_home}"
            cat > "${arm_home}/config.toml" <<EOF
          [projects."${PROOF_ROOT}"]
          trust_level = "trusted"
          EOF

            ROUTING_ARM="${arm}" \
            ROUTING_CANDIDATE_PATH="${EVIDENCE_ROOT}/routing-0a-candidate-ids.json" \
            ROUTING_REQUEST_PREFIX="${request_prefix}" \
            ROUTING_PORT_PATH="${port_path}" \
            ROUTING_SELECTED_PATH="${selected_path}" \
              python3 "${server_script}" &
            local server_pid=$!

            for _ in $(seq 1 100); do
              if test -s "${port_path}"; then
                break
              fi
              sleep 0.05
            done
            test -s "${port_path}"
            local port
            port="$(cat "${port_path}")"

            (
              cd "${PROOF_ROOT}"
              CODEX_HOME="${arm_home}" env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
                codex exec --ephemeral --json \
                  -c 'model="proof-model"' \
                  -c 'model_provider="mock"' \
                  -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                  "$(cat "${prompt_path}")"
            ) > "${EVIDENCE_ROOT}/routing-0a-${arm}-exec.jsonl" \
              2> "${EVIDENCE_ROOT}/routing-0a-${arm}-exec.stderr"

            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true

            test -s "${selected_path}"
            local selected
            selected="$(cat "${selected_path}")"
            local fingerprint
            case "${selected}" in
              agent-loop-investigator) fingerprint='Locate. Verify. Report. Stop.' ;;
              agent-loop-code-reviewer) fingerprint='Review only the supplied diff' ;;
              *) printf 'unexpected selected candidate: %s\n' "${selected}" >&2; return 1 ;;
            esac

            local child_request=""
            local spawn_result=""
            local wait_result=""
            for request in "${request_prefix}"-*.json; do
              if grep -Fq "${fingerprint}" "${request}"; then
                child_request="${request}"
              fi
              if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-spawn")' "${request}" >/dev/null 2>&1; then
                spawn_result="${request}"
              fi
              if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-wait")' "${request}" >/dev/null 2>&1; then
                wait_result="${request}"
              fi
            done
            test -n "${child_request}"
            test -n "${spawn_result}"
            test -n "${wait_result}"
            jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-routing-0a-wait") | .output | fromjson | (.timed_out == false and (.status | length > 0))' \
              "${wait_result}" >/dev/null
          }

          run_arm baseline
          run_arm hinted

          test "$(cat "${EVIDENCE_ROOT}/routing-0a-baseline-selected.txt")" = 'agent-loop-code-reviewer'
          test "$(cat "${EVIDENCE_ROOT}/routing-0a-hinted-selected.txt")" = 'agent-loop-investigator'

          php <<'PHP'
          <?php
          require getenv('GITHUB_WORKSPACE') . '/vendor/autoload.php';

          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentFixture;
          use voku\AgentLoop\Dogfood\Routing\RoutingExperimentReceipt;

          $root = getenv('GITHUB_WORKSPACE');
          $evidence = getenv('EVIDENCE_ROOT');
          $fixtureId = getenv('ROUTING_FIXTURE_ID');
          $taskPrompt = getenv('ROUTING_TASK_PROMPT');
          $baseSha = getenv('ROUTING_BASE_SHA');
          if (!is_string($root) || !is_string($evidence) || !is_string($fixtureId) || !is_string($taskPrompt) || !is_string($baseSha)) {
              throw new RuntimeException('Missing routing receipt environment.');
          }

          $fixtures = [
              'baseline' => RoutingExperimentFixture::baseline($root, $fixtureId, $taskPrompt),
              'hinted' => RoutingExperimentFixture::hinted(
                  $root,
                  $fixtureId,
                  $taskPrompt,
                  'agent-loop-investigator',
                  0.82,
              ),
          ];

          foreach ($fixtures as $arm => $fixture) {
              $selected = trim((string) file_get_contents($evidence . '/routing-0a-' . $arm . '-selected.txt'));
              $receipt = RoutingExperimentReceipt::observe(
                  $fixture,
                  $baseSha,
                  $selected,
                  true,
                  true,
                  true,
              );
              file_put_contents(
                  $evidence . '/routing-0a-' . $arm . '-receipt.json',
                  json_encode($receipt->toArray(), JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n",
              );
          }
          PHP

          jq -e '.arm == "baseline" and .hint == null and .selected_candidate_id == "agent-loop-code-reviewer" and .spawn_observed and .child_started and .wait_completed' \
            "${EVIDENCE_ROOT}/routing-0a-baseline-receipt.json" >/dev/null
          jq -e '.arm == "hinted"
            and .hint == {"candidate_id":"agent-loop-investigator","probability":0.82}
            and (.hint | has("authority") | not)
            and (.hint | has("host_retains_final_selection") | not)' \
            "${EVIDENCE_ROOT}/routing-0a-hinted-receipt.json" >/dev/null
          jq -e '.arm == "hinted" and .hint.candidate_id == "agent-loop-investigator" and .selected_candidate_id == "agent-loop-investigator" and .spawn_observed and .child_started and .wait_completed' \
            "${EVIDENCE_ROOT}/routing-0a-hinted-receipt.json" >/dev/null

      - name: Prove forbidden decisions in Codex execpolicy engine
        shell: bash
        run: |
          set -euo pipefail
          rules="${PROOF_ROOT}/.codex/rules/agent-loop.rules"

          codex execpolicy check --pretty --rules "${rules}"             git push origin HEAD > "${EVIDENCE_ROOT}/execpolicy-git-push.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr create --title proof --body proof > "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json"
          codex execpolicy check --pretty --rules "${rules}"             gh pr merge 1 > "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json"

          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-git-push.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-create.json" >/dev/null
          jq -e '.decision == "forbidden"' "${EVIDENCE_ROOT}/execpolicy-gh-pr-merge.json" >/dev/null

      - name: Record evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          codex_version="$(cat "${EVIDENCE_ROOT}/codex-version.txt")"
          parent_write_outcome="$(cat "${EVIDENCE_ROOT}/parent-write-outcome.txt")"
          child_write_outcome="$(cat "${EVIDENCE_ROOT}/child-write-outcome.txt")"
          child_authority_outcome="$(cat "${EVIDENCE_ROOT}/child-read-only-outcome.txt")"

          jq -n             --arg codex_version "${codex_version}"             --arg parent_write_outcome "${parent_write_outcome}"             --arg child_write_outcome "${child_write_outcome}"             --arg child_authority_outcome "${child_authority_outcome}"             '{
              schema_version: "1.0",
              codex_version: $codex_version,
              observed: {
                agents_md: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input",
                  status: "observed"
                },
                repository_skill: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input",
                  projected_path: ".codex/skills/agent-loop-discipline/SKILL.md",
                  status: "observed"
                },
                reinstall_convergence: {
                  evidence_class: "installed_projection",
                  mechanism: "two consecutive init install-assets --agent=codex runs with identical owned projection digest",
                  status: "observed"
                },
                exact_once_context_consumption: {
                  evidence_class: "host_consumption",
                  mechanism: "codex debug prompt-input marker counts",
                  router_marker_count: 1,
                  discipline_marker_count: 1,
                  status: "observed",
                  boundary: "This proves one effective copy in the current debug prompt-input projection; it does not claim SessionStart hook execution or model-side attention."
                },
                forbidden_rules: {
                  evidence_class: "enforcement_engine",
                  mechanism: "codex execpolicy check with the projected rule file",
                  status: "observed",
                  boundary: "Explicit rule evaluation proves Codex execpolicy decisions; project-rule auto-loading and live shell-tool blocking are not claimed."
                },
                subagent_role_discovery: {
                  evidence_class: "host_consumption",
                  mechanism: "real codex exec request tool contract against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  status: "observed",
                  boundary: "The runtime exposed the projected role in its spawn_agent tool contract."
                },
                subagent_role_selection: {
                  evidence_class: "host_consumption",
                  mechanism: "real multi_agent_v1.spawn_agent call through Codex 0.157.0 against a local Responses-compatible provider",
                  projected_role: "agent-loop-investigator",
                  child_fingerprint: "Locate. Verify. Report. Stop.",
                  status: "observed",
                  boundary: "The selected child request contains the projected role developer instructions."
                },
                subagent_read_only_authority: {
                  evidence_class: "runtime_authority",
                  mechanism: "parent control and selected child each execute the same real exec_command write attempt against disposable repository sentinels",
                  projected_role: "agent-loop-investigator",
                  projected_sandbox_mode: "read-only",
                  parent_write_outcome: $parent_write_outcome,
                  child_write_outcome: $child_write_outcome,
                  outcome: $child_authority_outcome,
                  status: "observed",
                  sandbox_backend: "bubblewrap",
                  runner_prerequisite: "GitHub runner AppArmor unprivileged-userns restriction disabled for the disposable proof job when that sysctl exists",
                  boundary: "No explicit parent sandbox override is supplied; hooks and MCP are not part of this proof. The runner prerequisite only permits the Codex bubblewrap sandbox to start; it does not alter the parent or child permission profile. Only a parent-success/child-filesystem-block differential proves read-only enforcement."
                }
              },
              not_proven_by_this_slice: {
                parent_runtime_override_interaction: true,
                hook_trust_or_execution: true,
                project_rule_autoload: true,
                mcp_authority_coverage: true
              }
            }' > "${EVIDENCE_ROOT}/evidence.json"

          (cd "${EVIDENCE_ROOT}" && sha256sum ./* > SHA256SUMS)

      - name: Upload Codex runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-runtime-proof-${{ github.sha }}
          if-no-files-found: error
          path: build/codex-runtime-proof
