          subagent_hook_port="$(cat "${subagent_hook_port_path}")"

          (
            cd "${PROOF_ROOT}"
            PATH="${php_wrapper_dir}:${PATH}" env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
