                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  if request_number == 1:
                      events = [
                          {
                              "type": "response.created",
                              "response": {"id": "resp-pre-tool-use-deny"},
                          },
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-pre-tool-use-deny",
