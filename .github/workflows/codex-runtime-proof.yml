          ' "${hook_stdout}" >/dev/null
          pre_tool_use_invocations="$(grep -Fc -- 'pre_tool_use_policy.php' "${hook_invocation_log}" || true)"
          test "${pre_tool_use_invocations}" -eq 1

          tool_result_request=""
          for request in "${request_prefix}"-*.json; do
