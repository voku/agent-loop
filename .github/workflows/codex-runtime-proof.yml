name: Codex runtime proof

on:
  pull_request:
    paths:
      - '.github/workflows/codex-runtime-proof.yml'
      - 'src/Init/**'
      - 'resources/instructions/**'
      - 'resources/skills/**'
      - 'resources/subagents/**'
      - 'tools/Dogfood/Routing/**'
      - 'resources/hooks/codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Codex 0.157.0 host consumption
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_VERSION: '0.157.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install repository dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install exact Codex runtime
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_NON_INTERACTIVE=1
          export CODEX_INSTALL_DIR="${RUNNER_TEMP}/codex-bin"
          export CODEX_HOME="${RUNNER_TEMP}/codex-install-home"
          curl -fsSL https://chatgpt.com/codex/install.sh |
            sh -s -- --release "${CODEX_VERSION}"
          echo "${CODEX_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Project disposable Codex repository
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/agent-loop-codex-runtime-proof"
          runtime_home="${RUNNER_TEMP}/codex-runtime-home"
          evidence_root="${GITHUB_WORKSPACE}/build/codex-runtime-proof"

          rm -rf "${proof_root}" "${runtime_home}" "${evidence_root}"
          mkdir -p "${proof_root}" "${runtime_home}" "${evidence_root}"
          git -C "${proof_root}" init --initial-branch=main

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init scaffold --demo --agent=codex
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=codex

            projection_digest() {
              {
                sha256sum AGENTS.md
                find .codex/skills .codex/agents -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            }

            before="$(projection_digest)"
            printf '%s\n' "${before}" > "${evidence_root}/projection-before-reinstall.sha256"
          )

          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${proof_root}"]
          trust_level = "trusted"
          EOF

          (
            cd "${proof_root}"
            CODEX_HOME="${runtime_home}" env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex debug prompt-input
          ) > "${evidence_root}/prompt-input-before-reinstall.json"

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=codex

            projection_digest() {
              {
                sha256sum AGENTS.md
                find .codex/skills .codex/agents -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              } | sha256sum | cut -d' ' -f1
            }

            after="$(projection_digest)"
            printf '%s\n' "${after}" > "${evidence_root}/projection-after-reinstall.sha256"
            test "$(cat "${evidence_root}/projection-before-reinstall.sha256")" = "${after}"

            "${GITHUB_WORKSPACE}/bin/agent-loop" init sync-policy --agent=codex
          )

          head_sha='${{ github.event.pull_request.head.sha }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          test -n "${head_sha}" || head_sha="${GITHUB_SHA}"
          test -n "${base_sha}" || base_sha="${GITHUB_SHA}"
          printf '%s\n' "${head_sha}" > "${evidence_root}/repository-head-sha.txt"
          printf '%s\n' "${base_sha}" > "${evidence_root}/repository-base-sha.txt"
          sha256sum "${GITHUB_WORKSPACE}/composer.lock" | cut -d' ' -f1 > "${evidence_root}/dependency-graph.sha256"

          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sysctl -n kernel.apparmor_restrict_unprivileged_userns > "${evidence_root}/apparmor-userns-before.txt"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            sysctl -n kernel.apparmor_restrict_unprivileged_userns > "${evidence_root}/apparmor-userns-after.txt"
            test "$(cat "${evidence_root}/apparmor-userns-after.txt")" = '0'
          else
            printf '%s\n' 'unavailable' > "${evidence_root}/apparmor-userns-before.txt"
            printf '%s\n' 'unavailable' > "${evidence_root}/apparmor-userns-after.txt"
          fi

          echo "PROOF_ROOT=${proof_root}" >> "${GITHUB_ENV}"
          echo "CODEX_HOME=${runtime_home}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"

          cp "${proof_root}/AGENTS.md" "${evidence_root}/projected-AGENTS.md"
          cp "${proof_root}/.codex/skills/.agent-loop-manifest.json" "${evidence_root}/projected-codex-skills-manifest.json"
          cp "${proof_root}/.codex/rules/agent-loop.rules" "${evidence_root}/projected-agent-loop.rules"

      - name: Prove host consumption survives reinstall exactly once
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          codex --version | tee "${EVIDENCE_ROOT}/codex-version.txt"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex debug prompt-input
          ) > "${EVIDENCE_ROOT}/prompt-input-after-reinstall.json"
          cp "${EVIDENCE_ROOT}/prompt-input-after-reinstall.json" "${EVIDENCE_ROOT}/prompt-input.json"

          python3 - \
            "${EVIDENCE_ROOT}/prompt-input-before-reinstall.json" \
            "${EVIDENCE_ROOT}/prompt-input-after-reinstall.json" \
            "${EVIDENCE_ROOT}/prompt-marker-counts.json" <<'PY'
          import json
          import sys

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from strings(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from strings(item)

          def observe(path):
              with open(path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)

              observed = "\n".join(strings(payload))
              return {
                  "managed_router": observed.count("## agent-loop workflow router"),
                  "discipline_discovery_entry": sum(
                      1
                      for line in observed.splitlines()
                      if line.startswith("- agent-loop-discipline:")
                      and "/agent-loop-discipline/SKILL.md)" in line
                  ),
              }

          counts = {
              "before_reinstall": observe(sys.argv[1]),
              "after_reinstall": observe(sys.argv[2]),
          }

          with open(sys.argv[3], "w", encoding="utf-8") as handle:
              json.dump(counts, handle, indent=2, sort_keys=True)
              handle.write("\n")

          for phase, phase_counts in counts.items():
              for marker, count in phase_counts.items():
                  if count != 1:
                      raise SystemExit(
                          f"{phase} {marker} expected exactly once, observed {count}"
                      )

          if counts["before_reinstall"] != counts["after_reinstall"]:
              raise SystemExit(
                  "Runtime marker counts changed across reinstall: "
                  f"{counts['before_reinstall']} != {counts['after_reinstall']}"
              )
          PY

      - name: Prove projected rules auto-load and block live shell command
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          runtime_home="${RUNNER_TEMP}/codex-project-rule-home"
          server_script="${RUNNER_TEMP}/codex-project-rule-proof-server.py"
          request_prefix="${EVIDENCE_ROOT}/project-rule-request"
          port_path="${RUNNER_TEMP}/codex-project-rule-proof-port"
          git_wrapper_dir="${RUNNER_TEMP}/codex-project-rule-git-wrapper"
          git_invocation_log="${EVIDENCE_ROOT}/project-rule-git-invocations.log"
          tool_output="${EVIDENCE_ROOT}/project-rule-tool-output.json"
          real_git="$(command -v git)"
          command='git push origin HEAD'

          test -f "${PROOF_ROOT}/.codex/rules/agent-loop.rules"

          rm -rf "${runtime_home}" "${git_wrapper_dir}"
          rm -f "${port_path}" "${request_prefix}"-*.json "${git_invocation_log}" "${tool_output}"
          mkdir -p "${runtime_home}" "${git_wrapper_dir}"
          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${PROOF_ROOT}"]
          trust_level = "trusted"
          EOF

          cat > "${git_wrapper_dir}/git" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\$*" == 'push origin HEAD' ]]; then
            printf '%s\\n' "\$*" >> "${git_invocation_log}"
            exit 97
          fi
          exec "${real_git}" "\$@"
          EOF
          chmod +x "${git_wrapper_dir}/git"

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          request_prefix = os.environ["REQUEST_PREFIX"]
          port_path = os.environ["PORT_PATH"]

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  request_number = Handler.request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  if request_number == 1:
                      events = [
                          {
                              "type": "response.created",
                              "response": {"id": "resp-project-rule-deny"},
                          },
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-project-rule-deny",
                                  "name": "exec_command",
                                  "arguments": json.dumps({
                                      "cmd": "git push origin HEAD",
                                  }),
                              },
                          },
                          {
                              "type": "response.completed",
                              "response": {
                                  "id": "resp-project-rule-deny",
                                  "usage": {
                                      "input_tokens": 0,
                                      "input_tokens_details": None,
                                      "output_tokens": 0,
                                      "output_tokens_details": None,
                                      "total_tokens": 0,
                                  },
                              },
                          },
                      ]
                  else:
                      events = completed_events(f"resp-project-rule-complete-{request_number}")

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" \
            python3 "${server_script}" &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          port="$(cat "${port_path}")"

          (
            cd "${PROOF_ROOT}"
            CODEX_HOME="${runtime_home}" PATH="${git_wrapper_dir}:${PATH}" \
              env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex exec --ephemeral --json \
                -c 'model="proof-model"' \
                -c 'model_provider="mock"' \
                -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                'Execute the deterministic shell command requested by the provider.'
          ) > "${EVIDENCE_ROOT}/project-rule-exec.jsonl" \
            2> "${EVIDENCE_ROOT}/project-rule-exec.stderr"

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

          if test -s "${git_invocation_log}"; then
            cat "${git_invocation_log}" >&2
            exit 1
          fi

          tool_result_request=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-project-rule-deny")' "${request}" >/dev/null 2>&1; then
              tool_result_request="${request}"
              break
            fi
          done
          test -n "${tool_result_request}"

          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-project-rule-deny")' \
            "${tool_result_request}" > "${tool_output}"
          grep -Fq 'git push origin HEAD' "${tool_output}"
          grep -Fq 'Direct git push is forbidden in Codex; publish outside the autonomous Codex path after explicit human authority.' "${tool_output}"

          jq -n \
            --arg command "${command}" \
            --arg projected_rule ".codex/rules/agent-loop.rules" \
            --arg rejection 'Direct git push is forbidden in Codex; publish outside the autonomous Codex path after explicit human authority.' \
            '{
              command: $command,
              projected_rule: $projected_rule,
              explicit_rules_argument: false,
              git_process_invoked: false,
              rejection_observed_in_tool_output: true,
              rejection: $rejection
            }' > "${EVIDENCE_ROOT}/project-rule-live-proof.json"

      - name: Prove SessionStart project hook trust and execution
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          hook_root="${RUNNER_TEMP}/agent-loop-codex-hook-proof"
          server_script="${RUNNER_TEMP}/codex-session-start-proof-server.py"
          rm -rf "${hook_root}"
          mkdir -p "${hook_root}"

          cat > "${hook_root}/composer.json" <<JSON
          {
            "name": "voku/codex-session-start-hook-proof",
            "type": "project",
            "require": {
              "voku/agent-loop": "dev-main"
            },
            "repositories": [
              {
                "type": "path",
                "url": "${GITHUB_WORKSPACE}",
                "options": {
                  "symlink": false,
                  "versions": {"voku/agent-loop": "dev-main"}
                }
              }
            ],
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": {
              "allow-plugins": false,
              "sort-packages": true
            }
          }
          JSON

          composer install \
            --working-dir="${hook_root}" \
            --no-interaction \
            --prefer-dist \
            --no-progress

          git -C "${hook_root}" init --initial-branch=main
          (
            cd "${hook_root}"
            env -u CODEX_HOME vendor/bin/agent-loop init scaffold --demo --agent=codex
            env -u CODEX_HOME vendor/bin/agent-loop init install-assets --agent=codex --with-hooks
          )

          test -f "${hook_root}/.codex/hooks.json"
          test -f "${hook_root}/.codex/hooks/context.php"

          resume_task="CODEX-HOOK-TRUST-PROBE"
          mkdir -p "${hook_root}/.agent-loop/runs/${resume_task}"
          cat > "${hook_root}/.agent-loop/runs/${resume_task}/manifest.json" <<JSON
          {
            "schema_version": "1.0",
            "task_id": "${resume_task}",
            "state": "incomplete",
            "next_action": "UNTRUSTED-NEXT-ACTION-MUST-NOT-BECOME-HOOK-AUTHORITY"
          }
          JSON

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          request_prefix = os.environ["REQUEST_PREFIX"]
          port_path = os.environ["PORT_PATH"]

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  request_number = Handler.request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  events = [
                      {"type": "response.created", "response": {"id": f"resp-session-start-{request_number}"}},
                      {
                          "type": "response.completed",
                          "response": {
                              "id": f"resp-session-start-{request_number}",
                              "usage": {
                                  "input_tokens": 0,
                                  "input_tokens_details": None,
                                  "output_tokens": 0,
                                  "output_tokens_details": None,
                                  "total_tokens": 0,
                              },
                          },
                      },
                  ]
                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          run_probe() {
            local trust_level="$1"
            local home="${RUNNER_TEMP}/codex-session-start-${trust_level}-home"
            local port_path="${RUNNER_TEMP}/codex-session-start-${trust_level}-port"
            local request_prefix="${EVIDENCE_ROOT}/session-start-${trust_level}-request"

            rm -rf "${home}"
            rm -f "${port_path}" "${request_prefix}"-*.json
            mkdir -p "${home}"
            cat > "${home}/config.toml" <<EOF
          [projects."${hook_root}"]
          trust_level = "${trust_level}"
          EOF

            REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" \
              python3 "${server_script}" &
            local server_pid=$!
            trap 'kill "${server_pid}" 2>/dev/null || true' RETURN

            for _ in $(seq 1 100); do
              if test -s "${port_path}"; then
                break
              fi
              sleep 0.05
            done
            test -s "${port_path}"
            local port
            port="$(cat "${port_path}")"

            (
              cd "${hook_root}"
              CODEX_HOME="${home}" env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
                codex exec --ephemeral --json --dangerously-bypass-hook-trust \
                  -c 'model="proof-model"' \
                  -c 'model_provider="mock"' \
                  -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                  'Return no content. SessionStart hook trust probe.'
            ) > "${EVIDENCE_ROOT}/session-start-${trust_level}-exec.jsonl" \
              2> "${EVIDENCE_ROOT}/session-start-${trust_level}-exec.stderr"

            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            trap - RETURN

            test -s "${request_prefix}-1.json"
          }

          run_probe trusted
          run_probe untrusted

          python3 - \
            "${EVIDENCE_ROOT}/session-start-trusted-request-1.json" \
            "${EVIDENCE_ROOT}/session-start-untrusted-request-1.json" \
            "${EVIDENCE_ROOT}/session-start-hook-proof.json" <<'PY'
          import json
          import sys

          marker = "- observed task: `CODEX-HOOK-TRUST-PROBE`; projected state: `incomplete`."

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              trusted = handle.read()
          with open(sys.argv[2], "r", encoding="utf-8") as handle:
              untrusted = handle.read()

          trusted_count = trusted.count(marker)
          untrusted_count = untrusted.count(marker)

          if trusted_count != 1:
              raise SystemExit(
                  f"trusted SessionStart context marker expected exactly once, observed {trusted_count}"
              )
          if untrusted_count != 0:
              raise SystemExit(
                  f"untrusted SessionStart context marker expected zero times, observed {untrusted_count}"
              )

          with open(sys.argv[3], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "marker": marker,
                      "trusted_context_marker_count": trusted_count,
                      "untrusted_context_marker_count": untrusted_count,
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
              handle.write("\n")
          PY

      - name: Prove persisted hook hash trust and invalidation
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          source_hook_root="${RUNNER_TEMP}/agent-loop-codex-hook-proof"
          trust_root="${RUNNER_TEMP}/agent-loop-codex-persisted-hook-trust-proof"
          runtime_home="${RUNNER_TEMP}/codex-persisted-hook-trust-home"
          php_wrapper_dir="${RUNNER_TEMP}/codex-persisted-hook-trust-php-wrapper"
          hook_invocation_log="${EVIDENCE_ROOT}/persisted-hook-trust-invocations.log"
          trust_state="${EVIDENCE_ROOT}/persisted-hook-trust-state.json"
          hook_list_before="${EVIDENCE_ROOT}/persisted-hook-list-before.json"
          trust_git_root="${EVIDENCE_ROOT}/persisted-hook-trust-git-root.txt"
          trust_config="${EVIDENCE_ROOT}/persisted-hook-trust-config.toml"
          modified_state="${EVIDENCE_ROOT}/persisted-hook-modified-state.json"
          proof="${EVIDENCE_ROOT}/persisted-hook-hash-trust-proof.json"
          port_path="${RUNNER_TEMP}/codex-persisted-hook-trust-port"
          request_prefix="${EVIDENCE_ROOT}/persisted-hook-trust-request"
          server_script="${RUNNER_TEMP}/codex-session-start-proof-server.py"
          real_php="$(command -v php)"

          test -d "${source_hook_root}/vendor"
          test -f "${source_hook_root}/.codex/hooks.json"
          test -f "${server_script}"

          rm -rf "${trust_root}" "${runtime_home}" "${php_wrapper_dir}"
          rm -f "${hook_invocation_log}" "${trust_state}" "${modified_state}" "${proof}" \
            "${hook_list_before}" "${trust_git_root}" "${trust_config}" \
            "${port_path}" "${request_prefix}"-*.json
          cp -a "${source_hook_root}" "${trust_root}"
          mkdir -p "${runtime_home}" "${php_wrapper_dir}"

          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${trust_root}"]
          trust_level = "trusted"
          EOF

          git -C "${trust_root}" rev-parse --show-toplevel > "${trust_git_root}"
          cp "${runtime_home}/config.toml" "${trust_config}"

          cat > "${php_wrapper_dir}/php" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\\n' "\$*" >> "${hook_invocation_log}"
          exec "${real_php}" "\$@"
          EOF
          chmod +x "${php_wrapper_dir}/php"

          REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" \
            python3 "${server_script}" &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          port="$(cat "${port_path}")"

          run_exec() {
            local phase="$1"
            (
              cd "${trust_root}"
              CODEX_HOME="${runtime_home}" PATH="${php_wrapper_dir}:${PATH}" \
                env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
                codex exec --ephemeral --json \
                  -c 'model="proof-model"' \
                  -c 'model_provider="mock"' \
                  -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                  "Return no content. Persisted hook trust phase: ${phase}."
            ) > "${EVIDENCE_ROOT}/persisted-hook-trust-${phase}-exec.jsonl" \
              2> "${EVIDENCE_ROOT}/persisted-hook-trust-${phase}-exec.stderr"
          }

          session_start_invocations() {
            if ! test -f "${hook_invocation_log}"; then
              printf '%s\n' '0'
              return
            fi
            grep -Fc -- '--event=SessionStart' "${hook_invocation_log}" || true
          }

          run_exec untrusted
          untrusted_invocations="$(session_start_invocations)"
          test "${untrusted_invocations}" -eq 0

          CODEX_HOME="${runtime_home}" TRUST_ROOT="${trust_root}" TRUST_STATE="${trust_state}" \
            HOOK_LIST_BEFORE="${hook_list_before}" \
            python3 <<'PY'
          import json
          import os
          import select
          import subprocess

          codex_home = os.environ["CODEX_HOME"]
          trust_root = os.environ["TRUST_ROOT"]
          state_path = os.environ["TRUST_STATE"]
          hook_list_before_path = os.environ["HOOK_LIST_BEFORE"]

          env = os.environ.copy()
          env["CODEX_HOME"] = codex_home
          env.pop("OPENAI_API_KEY", None)
          env.pop("CODEX_ACCESS_TOKEN", None)

          process = subprocess.Popen(
              ["codex", "app-server", "--stdio"],
              cwd=trust_root,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
              encoding="utf-8",
              bufsize=1,
          )
          if process.stdin is None or process.stdout is None:
              raise SystemExit("Codex app-server stdio was unavailable")

          next_id = 1

          def send_request(method, params):
              global next_id
              request_id = next_id
              next_id += 1
              payload = {"id": request_id, "method": method}
              if params is not None:
                  payload["params"] = params
              process.stdin.write(json.dumps(payload) + "\n")
              process.stdin.flush()
              while True:
                  readable, _, _ = select.select([process.stdout], [], [], 15)
                  if not readable:
                      raise SystemExit(f"Codex app-server timed out while waiting for {method}")
                  line = process.stdout.readline()
                  if line == "":
                      raise SystemExit(f"Codex app-server closed while waiting for {method}")
                  message = json.loads(line)
                  if message.get("id") != request_id:
                      continue
                  if "error" in message:
                      raise SystemExit(f"{method} failed: {message['error']}")
                  return message.get("result")

          try:
              send_request(
                  "initialize",
                  {"clientInfo": {"name": "agent-loop-runtime-proof", "version": "1"}},
              )
              process.stdin.write(json.dumps({"method": "initialized"}) + "\n")
              process.stdin.flush()

              before = send_request("hooks/list", {"cwds": [trust_root]})
              with open(hook_list_before_path, "w", encoding="utf-8") as handle:
                  json.dump(before, handle, indent=2, sort_keys=True)
                  handle.write("\n")
              hooks = [
                  hook
                  for entry in before["data"]
                  for hook in entry["hooks"]
                  if hook["eventName"] == "SessionStart"
              ]
              if len(hooks) != 1:
                  raise SystemExit(
                      f"expected one SessionStart hook, observed {len(hooks)}"
                  )
              hook = hooks[0]
              if hook["trustStatus"] != "untrusted":
                  raise SystemExit(
                      "SessionStart hook must begin untrusted, observed "
                      + repr(hook["trustStatus"])
                  )

              send_request(
                  "config/batchWrite",
                  {
                      "edits": [
                          {
                              "keyPath": "hooks.state",
                              "value": {
                                  hook["key"]: {
                                      "trusted_hash": hook["currentHash"],
                                  }
                              },
                              "mergeStrategy": "upsert",
                          }
                      ],
                      "filePath": None,
                      "expectedVersion": None,
                      "reloadUserConfig": True,
                  },
              )

              after = send_request("hooks/list", {"cwds": [trust_root]})
              trusted_hooks = [
                  candidate
                  for entry in after["data"]
                  for candidate in entry["hooks"]
                  if candidate["eventName"] == "SessionStart"
              ]
              if len(trusted_hooks) != 1:
                  raise SystemExit(
                      f"expected one trusted SessionStart hook, observed {len(trusted_hooks)}"
                  )
              trusted = trusted_hooks[0]
              if trusted["key"] != hook["key"]:
                  raise SystemExit("SessionStart hook key changed while trusting")
              if trusted["currentHash"] != hook["currentHash"]:
                  raise SystemExit("SessionStart hook hash changed while trusting")
              if trusted["trustStatus"] != "trusted":
                  raise SystemExit(
                      "SessionStart hook must become trusted, observed "
                      + repr(trusted["trustStatus"])
                  )

              with open(state_path, "w", encoding="utf-8") as handle:
                  json.dump(
                      {
                          "key": hook["key"],
                          "initial_hash": hook["currentHash"],
                          "initial_trust_status": hook["trustStatus"],
                          "trusted_trust_status": trusted["trustStatus"],
                      },
                      handle,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")
          finally:
              try:
                  process.terminate()
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              try:
                  process.stdin.close()
              except Exception:
                  pass
          PY

          test -s "${runtime_home}/config.toml"
          grep -Fq 'trusted_hash' "${runtime_home}/config.toml"

          run_exec trusted
          trusted_invocations="$(session_start_invocations)"
          test "${trusted_invocations}" -eq 1

          TRUST_ROOT="${trust_root}" python3 <<'PY'
          import json
          import os

          path = os.path.join(os.environ["TRUST_ROOT"], ".codex", "hooks.json")
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          session_start = payload["hooks"]["SessionStart"][0]["hooks"][0]
          session_start["statusMessage"] = "modified persisted-hook-trust proof"

          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY

          CODEX_HOME="${runtime_home}" TRUST_ROOT="${trust_root}" \
            MODIFIED_STATE="${modified_state}" TRUST_STATE="${trust_state}" \
            python3 <<'PY'
          import json
          import os
          import select
          import subprocess

          codex_home = os.environ["CODEX_HOME"]
          trust_root = os.environ["TRUST_ROOT"]
          modified_state_path = os.environ["MODIFIED_STATE"]
          trust_state_path = os.environ["TRUST_STATE"]

          with open(trust_state_path, "r", encoding="utf-8") as handle:
              trusted_state = json.load(handle)

          env = os.environ.copy()
          env["CODEX_HOME"] = codex_home
          env.pop("OPENAI_API_KEY", None)
          env.pop("CODEX_ACCESS_TOKEN", None)

          process = subprocess.Popen(
              ["codex", "app-server", "--stdio"],
              cwd=trust_root,
              env=env,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
              encoding="utf-8",
              bufsize=1,
          )
          if process.stdin is None or process.stdout is None:
              raise SystemExit("Codex app-server stdio was unavailable")

          next_id = 1

          def send_request(method, params):
              global next_id
              request_id = next_id
              next_id += 1
              payload = {"id": request_id, "method": method}
              if params is not None:
                  payload["params"] = params
              process.stdin.write(json.dumps(payload) + "\n")
              process.stdin.flush()
              while True:
                  readable, _, _ = select.select([process.stdout], [], [], 15)
                  if not readable:
                      raise SystemExit(f"Codex app-server timed out while waiting for {method}")
                  line = process.stdout.readline()
                  if line == "":
                      raise SystemExit(f"Codex app-server closed while waiting for {method}")
                  message = json.loads(line)
                  if message.get("id") != request_id:
                      continue
                  if "error" in message:
                      raise SystemExit(f"{method} failed: {message['error']}")
                  return message.get("result")

          try:
              send_request(
                  "initialize",
                  {"clientInfo": {"name": "agent-loop-runtime-proof", "version": "1"}},
              )
              process.stdin.write(json.dumps({"method": "initialized"}) + "\n")
              process.stdin.flush()

              response = send_request("hooks/list", {"cwds": [trust_root]})
              hooks = [
                  hook
                  for entry in response["data"]
                  for hook in entry["hooks"]
                  if hook["eventName"] == "SessionStart"
              ]
              if len(hooks) != 1:
                  raise SystemExit(
                      f"expected one modified SessionStart hook, observed {len(hooks)}"
                  )
              modified = hooks[0]
              if modified["key"] != trusted_state["key"]:
                  raise SystemExit("SessionStart hook key changed after content modification")
              if modified["currentHash"] == trusted_state["initial_hash"]:
                  raise SystemExit("SessionStart hook hash did not change after modification")
              if modified["trustStatus"] != "modified":
                  raise SystemExit(
                      "SessionStart hook must become modified, observed "
                      + repr(modified["trustStatus"])
                  )

              with open(modified_state_path, "w", encoding="utf-8") as handle:
                  json.dump(
                      {
                          "modified_hash": modified["currentHash"],
                          "modified_trust_status": modified["trustStatus"],
                      },
                      handle,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")
          finally:
              try:
                  process.terminate()
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
              try:
                  process.stdin.close()
              except Exception:
                  pass
          PY

          run_exec modified
          modified_invocations="$(session_start_invocations)"
          test "${modified_invocations}" -eq 1

          python3 - \
            "${trust_state}" \
            "${modified_state}" \
            "${untrusted_invocations}" \
            "${trusted_invocations}" \
            "${modified_invocations}" \
            "${proof}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              trusted = json.load(handle)
          with open(sys.argv[2], "r", encoding="utf-8") as handle:
              modified = json.load(handle)

          proof = {
              **trusted,
              **modified,
              "session_start_invocations_before_trust": int(sys.argv[3]),
              "session_start_invocations_after_trust": int(sys.argv[4]),
              "session_start_invocations_after_modification": int(sys.argv[5]),
              "trust_write_surface": "Codex app-server hooks/list + config/batchWrite",
              "runtime_bypass_hook_trust": False,
          }
          with open(sys.argv[6], "w", encoding="utf-8") as handle:
              json.dump(proof, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

      - name: Prove projected subagent role discovery and selection in Codex runtime
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          server_script="${RUNNER_TEMP}/codex-runtime-proof-server.py"
          request_prefix="${EVIDENCE_ROOT}/subagent-runtime-request"
          port_path="${RUNNER_TEMP}/codex-runtime-proof-port"

          cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          request_prefix = os.environ["REQUEST_PREFIX"]
          port_path = os.environ["PORT_PATH"]

          def completed_events(response_id):
              return [
                  {"type": "response.created", "response": {"id": response_id}},
                  {
                      "type": "response.completed",
                      "response": {
                          "id": response_id,
                          "usage": {
                              "input_tokens": 0,
                              "input_tokens_details": None,
                              "output_tokens": 0,
                              "output_tokens_details": None,
                              "total_tokens": 0,
                          },
                      },
                  },
              ]

          class Handler(http.server.BaseHTTPRequestHandler):
              request_count = 0

              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  Handler.request_count += 1
                  request_number = Handler.request_count
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  with open(f"{request_prefix}-{request_number}.json", "wb") as handle:
                      handle.write(body)

                  if request_number == 1:
                      events = [
                          {
                              "type": "response.created",
                              "response": {"id": "resp-agent-loop-parent-write"},
                          },
                          {
                              "type": "response.output_item.done",
                              "item": {
                                  "type": "function_call",
                                  "call_id": "call-agent-loop-parent-write",
                                  "name": "exec_command",
                                  "arguments": json.dumps({
                                      "cmd": "printf 'parent-authority-probe\\n' > .agent-loop-parent-authority-probe",
                                  }),
                              },
                          },
                          {
                              "type": "response.completed",
                              "response": {
                                  "id": "resp-agent-loop-parent-write",
                                  "usage": {
                                      "input_tokens": 0,
                                      "input_tokens_details": None,
                                      "output_tokens": 0,
                                      "output_tokens_details": None,
                                      "total_tokens": 0,
                                  },
                              },
                          },
                      ]
                  else:
                      request = json.loads(body)
                      request_text = body.decode("utf-8", errors="replace")
                      parent_write_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-parent-write"
                          ),
                          None,
                      )
                      child_write_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-child-write"
                          ),
                          None,
                      )
                      spawn_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-selection"
                          ),
                          None,
                      )
                      wait_output = next(
                          (
                              item
                              for item in request.get("input", [])
                              if item.get("type") == "function_call_output"
                              and item.get("call_id") == "call-agent-loop-wait"
                          ),
                          None,
                      )
                      if child_write_output is not None:
                          events = completed_events(f"resp-agent-loop-child-complete-{request_number}")
                      elif "Locate. Verify. Report. Stop." in request_text:
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-child-write"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-child-write",
                                      "name": "exec_command",
                                      "arguments": json.dumps({
                                          "cmd": "printf 'child-authority-probe\\n' > .agent-loop-child-authority-probe",
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-child-write",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      elif parent_write_output is not None and spawn_output is None:
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-parent-spawn"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-selection",
                                      "namespace": "multi_agent_v1",
                                      "name": "spawn_agent",
                                      "arguments": json.dumps({
                                          "message": "Return no content. Deterministic role-selection probe.",
                                          "agent_type": "agent-loop-investigator",
                                          "fork_context": False,
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-parent-spawn",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      elif spawn_output is not None and wait_output is None:
                          agent_id = json.loads(spawn_output["output"])["agent_id"]
                          events = [
                              {
                                  "type": "response.created",
                                  "response": {"id": "resp-agent-loop-wait"},
                              },
                              {
                                  "type": "response.output_item.done",
                                  "item": {
                                      "type": "function_call",
                                      "call_id": "call-agent-loop-wait",
                                      "namespace": "multi_agent_v1",
                                      "name": "wait_agent",
                                      "arguments": json.dumps({
                                          "targets": [agent_id],
                                          "timeout_ms": 20000,
                                      }),
                                  },
                              },
                              {
                                  "type": "response.completed",
                                  "response": {
                                      "id": "resp-agent-loop-wait",
                                      "usage": {
                                          "input_tokens": 0,
                                          "input_tokens_details": None,
                                          "output_tokens": 0,
                                          "output_tokens_details": None,
                                          "total_tokens": 0,
                                      },
                                  },
                              },
                          ]
                      else:
                          events = completed_events(f"resp-agent-loop-{request_number}")

                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

          REQUEST_PREFIX="${request_prefix}" PORT_PATH="${port_path}" python3 "${server_script}" &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            if test -s "${port_path}"; then
              break
            fi
            sleep 0.05
          done
          test -s "${port_path}"
          port="$(cat "${port_path}")"

          (
            cd "${PROOF_ROOT}"
            env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
              codex exec --json \
                -c 'model="proof-model"' \
                -c 'model_provider="mock"' \
                -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                'Delegate this deterministic probe to the agent-loop-investigator subagent.'
          ) > "${EVIDENCE_ROOT}/subagent-runtime-exec.jsonl" 2> "${EVIDENCE_ROOT}/subagent-runtime-exec.stderr"

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

          test -s "${request_prefix}-1.json"

          jq '[.. | objects | select(((.name? // "") | tostring) | test("spawn_agent$"))]' \
            "${request_prefix}-1.json" > "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          jq -e 'length > 0' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json" >/dev/null
          grep -Fq 'agent-loop-investigator' "${EVIDENCE_ROOT}/spawn-agent-tool-contract.json"

          child_request=""
          for request in "${request_prefix}"-*.json; do
            if grep -Fq 'Locate. Verify. Report. Stop.' "${request}"; then
              child_request="${request}"
              break
            fi
          done
          test -n "${child_request}"
          cp "${child_request}" "${EVIDENCE_ROOT}/selected-investigator-child-request.json"

          parent_write_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-parent-write")' "${request}" >/dev/null 2>&1; then
              parent_write_result="${request}"
              break
            fi
          done
          test -n "${parent_write_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-parent-write")'             "${parent_write_result}" > "${EVIDENCE_ROOT}/parent-write-tool-output.json"

          child_write_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-child-write")' "${request}" >/dev/null 2>&1; then
              child_write_result="${request}"
              break
            fi
          done
          test -n "${child_write_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-child-write")'             "${child_write_result}" > "${EVIDENCE_ROOT}/child-write-tool-output.json"

          wait_result=""
          for request in "${request_prefix}"-*.json; do
            if jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-wait")' "${request}" >/dev/null 2>&1; then
              wait_result="${request}"
              break
            fi
          done
          test -n "${wait_result}"
          jq -e '.input[]? | select(.type == "function_call_output" and .call_id == "call-agent-loop-wait")'             "${wait_result}" > "${EVIDENCE_ROOT}/wait-agent-tool-output.json"
          jq -e '.output | fromjson | (.timed_out == false and (.status | length > 0))'             "${EVIDENCE_ROOT}/wait-agent-tool-output.json" >/dev/null

          classify_write() {
            local sentinel_path="$1"
            local output_path="$2"
            local result_path="$3"

            if test -f "${sentinel_path}"; then
              printf '%s\n' 'write_succeeded' > "${result_path}"
            elif grep -Eiq 'bwrap:.*(operation not permitted|permission denied)|failed rtm_newaddr' "${output_path}"; then
              printf '%s\n' 'sandbox_launch_failed' > "${result_path}"
            elif grep -Eiq 'read-only file system|permission denied' "${output_path}"; then
              printf '%s\n' 'filesystem_write_blocked' > "${result_path}"
            else
              printf '%s\n' 'write_failed_ambiguous' > "${result_path}"
            fi
          }

          classify_write             "${PROOF_ROOT}/.agent-loop-parent-authority-probe"             "${EVIDENCE_ROOT}/parent-write-tool-output.json"             "${EVIDENCE_ROOT}/parent-write-outcome.txt"
          classify_write             "${PROOF_ROOT}/.agent-loop-child-authority-probe"             "${EVIDENCE_ROOT}/child-write-tool-output.json"             "${EVIDENCE_ROOT}/child-write-outcome.txt"

          if test -f "${PROOF_ROOT}/.agent-loop-parent-authority-probe"; then
            cp "${PROOF_ROOT}/.agent-loop-parent-authority-probe" "${EVIDENCE_ROOT}/parent-write-sentinel.txt"
          fi
          if test -f "${PROOF_ROOT}/.agent-loop-child-authority-probe"; then
            cp "${PROOF_ROOT}/.agent-loop-child-authority-probe" "${EVIDENCE_ROOT}/child-write-sentinel.txt"
          fi

          parent_outcome="$(cat "${EVIDENCE_ROOT}/parent-write-outcome.txt")"
          child_outcome="$(cat "${EVIDENCE_ROOT}/child-write-outcome.txt")"
          if test "${parent_outcome}" = 'write_succeeded' && test "${child_outcome}" = 'filesystem_write_blocked'; then
            printf '%s\n' 'role_read_only_enforced' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          elif test "${parent_outcome}" = 'write_succeeded' && test "${child_outcome}" = 'write_succeeded'; then
            printf '%s\n' 'role_read_only_not_enforced' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          else
            printf '%s\n' 'inconclusive_environment' > "${EVIDENCE_ROOT}/child-read-only-outcome.txt"
          fi

          # Keep the authority proof above hook-free. Only after its outcome is
          # frozen do we project hooks and run a second independent subagent
          # execution whose sole purpose is observing SubagentStart.
