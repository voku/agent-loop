            --argjson subagent_start_invocations "${subagent_start_invocations}" \
            '{
              observer: "PATH-only php invocation wrapper around the unchanged projected hook command",
              session_start_invocation_count: $session_start_invocations,
              subagent_start_invocation_count: $subagent_start_invocations
            }' > "${EVIDENCE_ROOT}/subagent-start-hook-proof.json"

