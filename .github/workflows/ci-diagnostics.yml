name: CI diagnostics

on:
  pull_request:

concurrency:
  group: ci-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Composer metadata
        run: composer validate --strict
      - name: PHPUnit
        run: vendor/bin/phpunit --log-junit=build/phpunit-${{ matrix.php }}.xml
      - name: Upload PHPUnit result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phpunit-${{ matrix.php }}-${{ github.sha }}
          if-no-files-found: warn
          path: build/phpunit-${{ matrix.php }}.xml
      - name: PHPStan
        if: success()
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M --error-format=json > build/phpstan-${{ matrix.php }}.json
      - name: Upload PHPStan result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phpstan-${{ matrix.php }}-${{ github.sha }}
          if-no-files-found: warn
          path: build/phpstan-${{ matrix.php }}.json
      - name: Project PHPStan rules
        if: success()
        run: composer test:project-phpstan-rules
      - name: Discipline dogfood
        if: success()
        run: composer dogfood:discipline
