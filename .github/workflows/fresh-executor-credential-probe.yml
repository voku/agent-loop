name: Fresh executor credential boundary diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/fresh-executor-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - name: Report provider credential availability without disclosure
        shell: bash
        run: |
          set -euo pipefail
          for name in OPENAI_API_KEY CODEX_API_KEY ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN GEMINI_API_KEY GOOGLE_API_KEY; do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=absent\n' "$name"
            fi
          done
