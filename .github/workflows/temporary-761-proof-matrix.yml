name: Temporary S2f pinned-owner CI matrix

on:
  pull_request:

permissions:
  contents: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Use exact owner only in transient proof checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Focused reviewed-guidance tests
        run: vendor/bin/phpunit --filter 'SelfShapeMaintenance(GitHubReader|ReviewCommentVerifier|ApprovalGate|ReviewMatcher)|SelfShapeEvidence'
      - name: Analyze whole repository without ignoring failures
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
      - name: Style verification
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --show-progress=none
      - name: Record immutable verification receipt
        if: always()
        shell: bash
        run: |
          mkdir -p build
          printf 'branch_head=%s\nphp=%s\nowner_sha=%s\nproduction_pin=unreleased\nproof_only=true\n' \
            "$(git rev-parse HEAD)" "${{ matrix.php }}" e5fd38ccc32f878b8926a0920c4dd9f109714cef \
            > "build/review-matrix-php-${{ matrix.php }}.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-matrix-php-${{ matrix.php }}
          path: build/review-matrix-php-${{ matrix.php }}.txt
          if-no-files-found: error
