name: Prepare 0.18.2 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-0182-helper.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Insert release notes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## Unreleased\n'
          section = '''## 0.18.2 - 2026-08-26\n\n### Added\n\n- Publish immutable deterministic `WorkflowPromptEnvelope` projections and the read-only `WorkflowPromptService::startTask()` / `continueTask()` embedding boundary, including current Contract/Run/Recall lineage, owner disagreements, canonical next action, and explicit mutation authority without parsing CLI prose or mutating workflow state.\n- Track acceptance-criterion observation coverage as durable Contract-side semantics without creating a second Session/execution evidence authority.\n\n### Changed\n\n- After the exact task Contract has been explicitly approved, ordinary review acknowledgement and Learning disposition are model-owned command-template work by default; Contract changes, accepted risk, destructive/irreversible actions, and genuinely new product intent remain human authority boundaries.\n- Keep the HTML review workbench visible through neutral `review_presentation` metadata even when review acknowledgement is delegated post-approval, and retain `WorkflowHumanDecisionService` for stricter/manual hosts.\n\n### Fixed\n\n- Restore margin under the bounded agent-discipline context budget after navigation/tooling guidance expansion.\n- Keep workflow prompt-envelope runtime guards fail-closed and PHPStan-valid while preserving immutable deep-snapshot digest provenance.\n\n### Validation\n\n- PR #306 passed PHP 8.3/8.4/8.5 CI, diagnostics, PHPStan/project rules, installed release-set/refactor lifecycles, governed execution-contract dogfood, deterministic slop review, and self-shape before merge.\n- PR #309 merged the typed prompt-envelope boundary after exact-head lifecycle/PHPUnit/PHPStan verification; the subsequent context-budget and runtime-guard fixes plus acceptance-observation regressions are included in this release target.\n\n'''
          if '## 0.18.2 - 2026-08-26' in text:
              raise SystemExit('0.18.2 already documented')
          if text.count(marker) != 1:
              raise SystemExit('unexpected Unreleased marker count')
          path.write_text(text.replace(marker, marker + '\n' + section, 1))
          PY
          rm .github/workflows/release-0182-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/release-0182-helper.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.18.2'
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Request exact release tag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release
          cat > .release/0.18.2.json <<JSON
          {
            "target_sha": "${TARGET_SHA}",
            "version": "0.18.2"
          }
          JSON
          git add .release/0.18.2.json
          git diff --cached --check
          git commit -m 'release: request 0.18.2'
          git push origin HEAD:main