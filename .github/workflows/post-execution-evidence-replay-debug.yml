name: LOOP-132 post-execution replay diagnostic

on:
  pull_request:

jobs:
  replay-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run replay but preserve diagnostics
        shell: bash
        run: |
          set +e
          php tools/post-execution-evidence-replay.php
          status=$?
          printf '%s\n' "$status" > build/post-execution-evidence-replay/replay-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: post-execution-replay-diagnostic-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            build/post-execution-evidence-replay/command-log.txt
            build/post-execution-evidence-replay/replay-exit.txt
            build/post-execution-evidence-replay/init-status.txt
            build/post-execution-evidence-replay/context.json
            build/post-execution-evidence-replay/stale-close.txt
            build/post-execution-evidence-replay/close-b.txt
            build/post-execution-evidence-replay/report.json
            build/post-execution-evidence-replay/consumed-system.md
            build/post-execution-evidence-replay/.agent-loop/contracts/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/runs/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/recall/DEMO-1
            build/post-execution-evidence-replay/.agent-loop/sessions
