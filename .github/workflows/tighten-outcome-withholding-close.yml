name: Tighten outcome withholding close evidence

on:
  push:
    branches:
      - agent/outcome-honesty-self-correction

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/outcome-honesty-self-correction
      - name: Tighten close accounting and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          close = Path('src/Workflow/WorkflowCloseCommand.php')
          text = close.read_text()
          old = '''        $outcomesPath = rtrim($learningRoot, '/') . '/history/outcomes.jsonl';
                  $recorded = [];
                  foreach (file($outcomesPath, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES) ?: [] as $line) {
          '''
          new = '''        $outcomesPath = rtrim($learningRoot, '/') . '/history/outcomes.jsonl';
                  $outcomeLines = [];
                  if (is_file($outcomesPath)) {
                      $outcomeLines = file($outcomesPath, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
                      if ($outcomeLines === false) {
                          return 'cannot read history/outcomes.jsonl for selected guidance';
                      }
                  }
                  $recorded = [];
                  foreach ($outcomeLines as $line) {
          '''
          if old not in text:
              raise SystemExit('outcomes read anchor not found')
          text = text.replace(old, new, 1)

          old = '''        $withheld = $this->declaredWithholdings($learningRoot, $taskId, $compilationId);
                  $missing = array_values(array_filter(
                      array_unique($selected),
                      static fn (string $id): bool => !isset($recorded[$id]) && !isset($withheld[$id]),
                  ));
          '''
          new = '''        $selected = array_values(array_unique($selected));
                  $selectedSet = array_fill_keys($selected, true);
                  $withheld = array_intersect_key(
                      $this->declaredWithholdings($learningRoot, $taskId, $compilationId),
                      $selectedSet,
                  );
                  $missing = array_values(array_filter(
                      $selected,
                      static fn (string $id): bool => !isset($recorded[$id]) && !isset($withheld[$id]),
                  ));
          '''
          if old not in text:
              raise SystemExit('withheld accounting anchor not found')
          text = text.replace(old, new, 1)

          old = '''                && ($event['compilation_id'] ?? null) === $compilationId
                          && is_string($event['guidance_id'] ?? null)
          '''
          new = '''                && ($event['compilation_id'] ?? null) === $compilationId
                          && ($event['selected'] ?? null) === true
                          && is_string($event['guidance_id'] ?? null)
          '''
          if old not in text:
              raise SystemExit('selected event anchor not found')
          close.write_text(text.replace(old, new, 1))

          test = Path('tests/WorkflowCloseCommandTest.php')
          text = test.read_text()
          old = '''    public function testCloseStillRefusesAnEmptyWithheldReason(): void
              {
                  $this->writeRecallMeta([
                      'task_id' => 'ABC-123',
                      'compilation_id' => 'compilation.abc.003',
                      'selected_guidance' => ['G-003'],
                  ]);
                  $this->writeReviewReport(['status' => 'ok']);
                  $this->writeSelectionEvent('compilation.abc.003', 'G-003', '   ');

                  $result = $this->runClose();

                  self::assertSame(1, $result['exit']);
                  self::assertStringContainsString('missing explicit recall outcome for: G-003', $result['output']);
              }

              private function writeSelectionEvent(string $compilationId, string $guidanceId, string $withheldReason): void
          '''
          new = '''    public function testCloseStillRefusesAnEmptyWithheldReason(): void
              {
                  $this->writeRecallMeta([
                      'task_id' => 'ABC-123',
                      'compilation_id' => 'compilation.abc.003',
                      'selected_guidance' => ['G-003'],
                  ]);
                  $this->writeReviewReport(['status' => 'ok']);
                  $this->writeSelectionEvent('compilation.abc.003', 'G-003', '   ');

                  $result = $this->runClose();

                  self::assertSame(1, $result['exit']);
                  self::assertStringContainsString('missing explicit recall outcome for: G-003', $result['output']);
              }

              public function testCloseRefusesWithholdingFromAnUnselectedEvent(): void
              {
                  $this->writeRecallMeta([
                      'task_id' => 'ABC-123',
                      'compilation_id' => 'compilation.abc.004',
                      'selected_guidance' => ['G-004'],
                  ]);
                  $this->writeReviewReport(['status' => 'ok']);
                  $this->writeSelectionEvent(
                      'compilation.abc.004',
                      'G-004',
                      'This row was evaluated but not selected.',
                      false,
                  );

                  $result = $this->runClose();

                  self::assertSame(1, $result['exit']);
                  self::assertStringContainsString('missing explicit recall outcome for: G-004', $result['output']);
              }

              private function writeSelectionEvent(
                  string $compilationId,
                  string $guidanceId,
                  string $withheldReason,
                  bool $selected = true,
              ): void
          '''
          if old not in text:
              raise SystemExit('workflow close test anchor not found')
          text = text.replace(old, new, 1)
          old = '''            'eligible' => true,
                      'selected' => true,
          '''
          new = '''            'eligible' => true,
                      'selected' => $selected,
          '''
          if old not in text:
              raise SystemExit('selection event selected anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tighten-outcome-withholding-close.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Workflow/WorkflowCloseCommand.php tests/WorkflowCloseCommandTest.php .github/workflows/tighten-outcome-withholding-close.yml
          git commit -m "Tighten close evidence for withheld outcomes"
          git push origin HEAD:agent/outcome-honesty-self-correction
