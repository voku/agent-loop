name: Temporary #761 authenticated-reader regression proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install immutable owner locally without release/semver deception
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $data = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $data["require"]["voku/agent-learning"] = "dev-main";
            $data["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Assert API rate-limit, stale-head, permission and pagination regressions
        run: |
          vendor/bin/phpunit tests/SelfShapeMaintenanceGitHubReaderTest.php
          vendor/bin/phpunit tests/SelfShapeMaintenanceApprovalGateTest.php
          vendor/bin/phpunit tests/SelfShapeEvidenceTest.php
      - name: Full PHPStan analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
      - name: Style contract
        run: vendor/bin/php-cs-fixer check --config=.php-cs-fixer.dist.php --diff --show-progress=none
