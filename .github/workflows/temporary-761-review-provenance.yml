name: Temporary provenance validation (remove after green)

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install immutable owner from local path in temporary consumer only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $path = "composer.json";
            $data = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
            $data["require"]["voku/agent-learning"] = "dev-main";
            $data["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Assert bounded review provenance and unchanged fail-closed gate
        run: |
          vendor/bin/phpunit tests/SelfShapeMaintenanceReviewCommentVerifierTest.php tests/SelfShapeMaintenanceReviewMatcherTest.php tests/SelfShapeEvidenceTest.php
      - name: Analyze all mapped classes under PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
