name: Temporary 761 review-preflight regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused-owner-verified:
    name: review-preflight PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install immutable merged Learning owner in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Prove permission-API preflight and existing review invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/761-preflight
          php -l tools/Dogfood/SelfShapeMaintenanceReviewCommentVerifier.php
          php -l tools/Dogfood/SelfShapeMaintenanceGitHubReader.php
          vendor/bin/phpunit --filter SelfShapeMaintenance | tee build/761-preflight/phpunit.log
          composer phpstan | tee build/761-preflight/phpstan.log
          composer cs | tee build/761-preflight/style.log
          printf 'owner_commit=%s\nloop_checkout=%s\nphp=%s\nhuman_review=NOT_CLAIMED\n' \
            "$(git -C build/agent-learning-owner rev-parse HEAD)" \
            "$(git rev-parse HEAD)" \
            "$(php -r 'echo PHP_VERSION;')" > build/761-preflight/provenance.txt
      - name: Upload scoped evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-preflight-php-${{ matrix.php }}
          if-no-files-found: warn
          path: build/761-preflight/
