name: Temporary #758 reanchor truth proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install pinned merged Learning owner without releasing a tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
      - name: Inspect current real #758 HEAD and strict owner proof
        shell: bash
        env:
          FROZEN_BASE: 622c004e2cc642fce1c06dc63a4f04d4889637e2
          FROZEN_HEAD: c204419080536c9f42dd5e50910256e770063432
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$FROZEN_BASE" "$FROZEN_HEAD"
          git worktree add --detach build/758-before "$FROZEN_BASE"
          git worktree add --detach build/758-after "$FROZEN_HEAD"
          git diff --no-ext-diff --binary "$FROZEN_BASE" "$FROZEN_HEAD" -- > build/758-full.diff
          git diff --name-only --diff-filter=ACMRTUXB "$FROZEN_BASE" "$FROZEN_HEAD" -- > build/758-paths.txt
          cat > build/758-proof.php <<'PHP'
          <?php
          declare(strict_types=1);
          require __DIR__ . '/../vendor/autoload.php';

          use voku\AgentLearning\AppliedGuidanceMaintenanceInspector;
          use voku\AgentLoop\Dogfood\SelfShapeMaintenanceApprovalGate;
          use voku\AgentLoop\Dogfood\SelfShapeMaintenanceReviewClaim;
          use voku\AgentLoop\Dogfood\SelfShapeMaintenanceReviewCommentEvidence;
          use voku\AgentLoop\Dogfood\SelfShapeEvidence;

          $base = (string) getenv('FROZEN_BASE');
          $head = (string) getenv('FROZEN_HEAD');
          $before = hash_file('sha256', __DIR__ . '/758-before/MEMORY.md');
          $after = hash_file('sha256', __DIR__ . '/758-after/MEMORY.md');
          $diff = hash_file('sha256', __DIR__ . '/758-full.diff');
          if (!is_string($before) || !is_string($after) || !is_string($diff)) {
              throw new RuntimeException('Unable to hash immutable snapshots.');
          }
          $paths = array_values(array_filter(explode("\n", trim((string) file_get_contents(__DIR__ . '/758-paths.txt')))));
          $owner = (new AppliedGuidanceMaintenanceInspector())->inspect(
              __DIR__ . '/758-before/.agent-loop/learning',
              __DIR__ . '/758-after/.agent-loop/learning',
              'MEMORY.md',
          );

          $claim = new SelfShapeMaintenanceReviewClaim('MEMORY.md', $base, $head, $before, $after, $diff);
          // Synthetic value only for gate identity test. Never a real review.
          $fake = new SelfShapeMaintenanceReviewCommentEvidence(
              $claim, 'SYNTHETIC_TEST_ONLY', 123, 'test-only://no-approval',
          );
          $gate = new SelfShapeMaintenanceApprovalGate();
          $accepted = $gate->matches($owner, $fake, $base, $head, $diff, $paths);
          $extraRejected = !$gate->matches($owner, $fake, $base, $head, $diff, [...$paths, 'src/not-reviewed.php']);
          $diffRejected = !$gate->matches($owner, $fake, $base, $head, str_repeat('f', 64), $paths);
          $headRejected = !$gate->matches($owner, $fake, $base, str_repeat('a', 40), $diff, $paths);
          $closed = false;
          try {
              (new SelfShapeEvidence([], true))->learningStatus();
          } catch (RuntimeException) {
              $closed = true;
          }

          $reasonText = [];
          foreach ($owner->proposalIds as $id) {
              $path = __DIR__ . '/758-after/.agent-loop/learning/proposals/applied/' . $id . '.json';
              $raw = json_decode((string) file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
              $reason = $raw['applied_validation']['reanchor_reason'] ?? null;
              if (!is_string($reason) || !str_contains($reason, 'one directory reference occurs in durable rule text')
                  || str_contains($reason, 'no durable rule text changed')) {
                  throw new RuntimeException('Misleading applied proposal reanchor reason: ' . $id);
              }
              $reasonText[$id] = $reason;
          }

          $out = [
              'base' => $base, 'head' => $head,
              'before_sha256' => $before, 'after_sha256' => $after,
              'full_diff_sha256' => $diff, 'paths' => $paths,
              'applied_proposal_ids' => $owner->proposalIds,
              'reanchor_reasons' => $reasonText,
              'accepts_synthetic_identity_only' => $accepted,
              'rejects_scope_change' => $extraRejected,
              'rejects_diff_change' => $diffRejected,
              'rejects_stale_head' => $headRejected,
              'rejects_no_human_review' => $closed,
              'real_human_approval' => false,
              'owner_mutation' => false,
          ];
          file_put_contents(__DIR__ . '/758-proof.json', json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n");
          echo json_encode($out, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";

          if (!$accepted || !$extraRejected || !$diffRejected || !$headRejected || !$closed
              || $before !== $owner->beforeSha256 || $after !== $owner->afterSha256
              || count($paths) !== 3 || count($owner->proposalIds) !== 2) {
              throw new RuntimeException('Exact #758 owner/gate replay did not satisfy all invariants.');
          }
          PHP
          php build/758-proof.php
          test -z "$(git -C build/758-before status --porcelain)"
          test -z "$(git -C build/758-after status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: current-758-owner-proof
          if-no-files-found: error
          path: build/758-proof.json
