name: Temporary Composer agent-map lock refresh

on:
  push:
    branches:
      - deps/agent-map-0.22.5-composer-20261029
    paths:
      - .github/workflows/temporary-agent-map-lock-refresh.yml

permissions:
  contents: write

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/agent-map-0.22.5-composer-20261029
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Resolve release with Composer, never edit lock manually
        shell: bash
        run: |
          set -euo pipefail
          composer update voku/agent-map --minimal-changes --no-interaction --prefer-dist
          composer validate --strict
          php -r '
            $lock = json_decode((string) file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $packages = [];
            foreach ($lock["packages"] as $package) {
              $packages[$package["name"]] = $package["version"];
            }
            if (($packages["voku/agent-map"] ?? null) !== "0.22.5"
              || ($packages["voku/agent-graph"] ?? null) !== "0.3.2") {
              throw new RuntimeException("Unexpected Composer dependency resolution: " . json_encode($packages));
            }
            echo "Composer-resolved agent-map 0.22.5 and agent-graph 0.3.2.\n";
          '
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'composer.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m "chore(deps): resolve agent-map 0.22.5 through Composer"
          git push origin HEAD:refs/heads/deps/agent-map-0.22.5-composer-20261029