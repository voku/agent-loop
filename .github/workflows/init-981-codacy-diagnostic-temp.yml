name: Temporary public Codacy issue diagnostic for PR 981
on:
  pull_request:
    paths:
      - '.github/workflows/init-981-codacy-diagnostic-temp.yml'
permissions:
  contents: read
jobs:
  fetch-public-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Codacy response without secrets
        shell: bash
        run: |
          set -euo pipefail
          u='https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/981/issues?limit=100'
          response="$(mktemp)"
          status="$(curl --location --silent --show-error --max-time 20 -o "$response" -w '%{http_code}' "$u" || true)"
          echo "CODACY_HTTP_STATUS=$status"
          if [[ "$status" == "200" ]]; then
            echo 'CODACY_RESPONSE_KEYS:'
            jq -c 'if type=="object" then keys else type end' "$response" || true
            echo 'CODACY_BODY_PREFIX:'
            head -c 14000 "$response" || true
            echo
          else
            echo "Endpoint unavailable or unauthorized; do not infer issue details."
          fi
          rm -f "$response"
