name: Installed Map 0.9 refactor lifecycle

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: installed-map09-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-map09-refactor:
    name: Map 0.9 ${{ matrix.scenario }} consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - method
          - parameter
          - class-move

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Lint clean-consumer harness
        run: php -l tools/installed-map09-refactor-dogfood.php

      - name: Run governed released Map 0.9 consumer
        run: >-
          php tools/installed-map09-refactor-dogfood.php
          --scenario=${{ matrix.scenario }}
          --workspace=${{ runner.temp }}/agent-loop-map09-${{ matrix.scenario }}
          --report=${{ github.workspace }}/build/installed-map09-${{ matrix.scenario }}.json

      - name: Verify released dependency and governed evidence
        shell: bash
        run: |
          set -euo pipefail
          report="build/installed-map09-${{ matrix.scenario }}.json"
          jq -e '
            (.schema_version == "1.0")
            and (.result == "passed")
            and (.scenario == "${{ matrix.scenario }}")
            and (.release_set["voku/agent-loop"].version == "dev-main")
            and (.release_set["voku/agent-loop"].source_type == "path")
            and (.release_set["voku/agent-map"].version == "0.9.0")
            and (.release_set["voku/agent-map"].source_type != "path")
            and (.release_set["voku/agent-recall-compiler"].source_type != "path")
            and ([.plan_capabilities[].plan_type] | sort == [
              "class_constant_removal_plan",
              "class_constant_rename_plan",
              "class_move_plan",
              "class_rename_plan",
              "function_rename_plan",
              "method_removal_plan",
              "method_rename_plan",
              "parameter_rename_plan",
              "property_removal_plan",
              "property_rename_plan"
            ])
            and (.plan.contract_version == "1.0")
            and (.dry_run.status == "prepared")
            and (.apply.status == "runner_succeeded")
            and (.verification.status == "passed")
            and (.verification.checks.execution_binding == "passed")
            and (.verification.checks.current_map == "passed")
            and (.verification.checks.changed_files == "passed")
            and (.verification.checks.replacements == "passed")
            and (.verification.checks.moves == "passed")
            and (.final_state == "complete")
          ' "$report" >/dev/null

      - name: Upload installed Map 0.9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-map09-${{ matrix.scenario }}-${{ github.sha }}
          if-no-files-found: warn
          path: build/installed-map09-${{ matrix.scenario }}.json
