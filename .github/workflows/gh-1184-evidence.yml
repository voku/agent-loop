name: GH-1185 approved entry and GH-1184 review reproduction (do not merge)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/gh-1184-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  approved-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c925e74dcf4f5d34c504d86cb8ca1ce71427c7a
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Record genuine developer approval and enter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8c925e74dcf4f5d34c504d86cb8ca1ce71427c7a
          composer install --no-interaction --prefer-dist --no-scripts --no-plugins --no-progress
          mkdir -p proof .agent-loop/contracts/GH-1185
          gh api repos/voku/agent-loop/actions/artifacts/15134461068/zip > proof/candidate.zip
          echo 'e66f69818073051105163e5794f0214f91af5764d1dd69087b199fb4ad551a8b  proof/candidate.zip' | sha256sum -c -
          unzip -p proof/candidate.zip contract.json > .agent-loop/contracts/GH-1185/contract.json
          echo '08864fce73e5648d04ab60d7e157d142d9d207c08191780250f4681905410df3  .agent-loop/contracts/GH-1185/contract.json' | sha256sum -c -
          php bin/agent-loop workflow approve GH-1185 --revision 1 --head 8c925e74dcf4f5d34c504d86cb8ca1ce71427c7a --by voku --recorded-by ChatGPT --format=json > proof/approval.json
          jq -e '.status == "approved" and .revision == 1' proof/approval.json
          cp .agent-loop/contracts/GH-1185/contract.json proof/approved-contract.json
          php bin/agent-loop enter GH-1185 --format=json > proof/entry.json
          jq '{mutation_ready,next_action_kind,next_action}' proof/entry.json
          jq -e '.mutation_ready == true and .next_action_kind == "host_work"' proof/entry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gh-1185-approved-entry
          path: |
            proof/*.json
            .agent-loop/contracts/GH-1185/
            .agent-loop/runs/GH-1185/
          include-hidden-files: true
          retention-days: 14
  reproduce-finding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d58bcec4b67b173739c0490a9e6522c69bb4c1bd
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Verify review counterexample against actual CLI
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-scripts --no-plugins --no-progress
          msg="$(mktemp)"
          printf '%s\n' 'fix(parser): reject empty input' '' 'WHY:' '- Empty input crashed the tokenizer.' '- [FILL]' > "$msg"
          php bin/agent-loop githooks commit-msg "$msg"
          echo 'Confirmed: current candidate accepts unresolved placeholder after concrete WHY.'
          rm "$msg"
