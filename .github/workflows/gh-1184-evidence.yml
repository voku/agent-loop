name: GH-1184 approved implementation carrier (do not merge)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gh-1184-evidence.yml'

permissions:
  contents: read
  actions: read

jobs:
  approved-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5e0e006fb052e262c18523bf6a19b7bcc213315
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Prepare exact base with locked dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e5e0e006fb052e262c18523bf6a19b7bcc213315
          composer install --no-interaction --prefer-dist --no-scripts --no-plugins --no-progress
          npm ci --ignore-scripts
      - name: Restore and verify the exact approved candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/GH-1184
          gh api repos/voku/agent-loop/actions/artifacts/15123505444/zip > build/evidence/GH-1184/original.zip
          echo '3cb3d7065d5b00510fd7dc44166c70eef8dc99cb804c4fd1e0298995b48100a3  build/evidence/GH-1184/original.zip' | sha256sum -c -
          unzip -p build/evidence/GH-1184/original.zip contract.json > build/evidence/GH-1184/original-contract.json
          echo '47ba1ee9c02e6415c3bcfd76766b7b3f8afb881d1d1cc5bdda7770e39dc5a9dd  build/evidence/GH-1184/original-contract.json' | sha256sum -c -
          mkdir -p .agent-loop/contracts/GH-1184
          test ! -e .agent-loop/contracts/GH-1184/contract.json
          cp build/evidence/GH-1184/original-contract.json .agent-loop/contracts/GH-1184/contract.json
      - name: Record explicit developer approval and enter
        shell: bash
        run: |
          set -euo pipefail
          proof=build/evidence/GH-1184
          php bin/agent-loop workflow approve GH-1184 --revision 1 --head e5e0e006fb052e262c18523bf6a19b7bcc213315 --by voku --recorded-by ChatGPT --format=json > "$proof/approval.json"
          cat "$proof/approval.json"
          jq -e '.status == "approved" and .revision == 1' "$proof/approval.json"
          status=0
          php bin/agent-loop enter GH-1184 --format=json > "$proof/entry.json" || status=$?
          printf 'enter exit=%s\n' "$status"
          jq '{next_action_kind, next_action, mutation_ready, human_decision}' "$proof/entry.json"
          cp .agent-loop/contracts/GH-1184/contract.json "$proof/approved-contract.json"
      - name: Retain exact approval and entry receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gh-1184-approved-entry
          path: |
            build/evidence/GH-1184/approval.json
            build/evidence/GH-1184/approved-contract.json
            build/evidence/GH-1184/entry.json
          if-no-files-found: warn
          retention-days: 14
