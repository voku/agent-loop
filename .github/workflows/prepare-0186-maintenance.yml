name: Prepare 0.18.6 maintenance target

on:
  push:
    branches:
      - release/0.18.6-learning-compat
    paths:
      - .github/workflows/prepare-0186-maintenance.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.18.6-learning-compat
      - name: Add immutable 0.18.6 changelog section and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## Unreleased\n'
          section = '''## 0.18.6 - 2026-09-04\n\n### Fixed\n\n- Require `voku/agent-learning ^0.14.2` on the maintained 0.18.x line so released consumers can use Learning 0.14 owner APIs without an unsatisfiable Composer graph. No Loop runtime behavior changes.\n'''
          if '## 0.18.6 - 2026-09-04' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG.md has no Unreleased marker')
              text = text.replace(marker, marker + '\n' + section, 1)
              path.write_text(text)
          PY
          git rm .github/workflows/prepare-0186-maintenance.yml
          git add CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(release): prepare 0.18.6 maintenance target'
          git push origin HEAD:release/0.18.6-learning-compat
