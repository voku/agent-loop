name: Temporary full owner-consumer integration dogfood

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-composer-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Replace development pin only in transient CI filesystem
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
          git diff --exit-code -- composer.json || true

      - name: Entire composer ci with exact merged owner source
        run: composer ci

  governed-self-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        php: ['8.3']
    env:
      SELF_SHAPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF_SHAPE_PR_NUMBER: ${{ github.event.pull_request.number }}
      SELF_SHAPE_GOAL: ${{ github.event.pull_request.title }}
      SELF_SHAPE_APPROVER: ${{ github.event.pull_request.user.login }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-learning
          ref: e5fd38ccc32f878b8926a0920c4dd9f109714cef
          path: build/agent-learning-owner
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Replace development pin only in transient CI filesystem
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C build/agent-learning-owner rev-parse HEAD)" = e5fd38ccc32f878b8926a0920c4dd9f109714cef
          php -r '
            $j = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $j["require"]["voku/agent-learning"] = "dev-main";
            $j["repositories"] = [[
              "type" => "path",
              "url" => "build/agent-learning-owner",
              "options" => ["symlink" => false, "versions" => ["voku/agent-learning" => "dev-main"]],
            ]];
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
          '
          composer install --no-interaction --prefer-dist
          git diff --exit-code -- composer.json || true

      - name: Run actual governed self-shape lifecycle
        shell: bash
        run: |
          set -euo pipefail
          php tools/self-shape-dogfood.php --base-ref="${{ github.base_ref }}"
      - name: Store real governed projection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-pinned-governed-lifecycle
          if-no-files-found: warn
          path: |
            build/self-shape-*.json
            build/self-shape-raw.diff
            .agent-loop/recall/SELF-SHAPE
            .agent-loop/runs/SELF-SHAPE
            .agent-loop/sessions
