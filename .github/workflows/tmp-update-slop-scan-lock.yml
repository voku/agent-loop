name: Temporary minimal slop-scan lock refresh

on:
  push:
    branches:
      - chore/slop-scan-0.1.15
    paths:
      - '.github/workflows/tmp-update-slop-scan-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/slop-scan-0.1.15
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Restore baseline lock and apply minimal dependency update
        run: |
          set -euo pipefail
          git checkout origin/main -- tools/slop-scan/composer.lock
          composer update voku/slop-scan voku/simple-php-code-parser --minimal-changes --working-dir=tools/slop-scan --no-interaction --prefer-dist

      - name: Verify resolved versions and package delta
        run: |
          php -r '
          $main = json_decode(shell_exec("git show origin/main:tools/slop-scan/composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $next = json_decode(file_get_contents("tools/slop-scan/composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          $index = static fn(array $lock): array => array_column($lock["packages"], null, "name");
          $before = $index($main);
          $after = $index($next);
          if (($after["voku/slop-scan"]["version"] ?? null) !== "0.1.15") {
              fwrite(STDERR, "slop-scan did not resolve to 0.1.15" . PHP_EOL);
              exit(1);
          }
          if (($after["voku/simple-php-code-parser"]["version"] ?? null) !== "0.22.8") {
              fwrite(STDERR, "parser did not resolve to 0.22.8" . PHP_EOL);
              exit(1);
          }
          $changed = [];
          foreach (array_unique([...array_keys($before), ...array_keys($after)]) as $name) {
              $old = $before[$name]["version"] ?? null;
              $new = $after[$name]["version"] ?? null;
              if ($old !== $new) {
                  $changed[$name] = [$old, $new];
              }
          }
          $allowed = ["voku/slop-scan", "voku/simple-php-code-parser"];
          foreach (array_keys($changed) as $name) {
              if (!in_array($name, $allowed, true)) {
                  fwrite(STDERR, "Unexpected package update: {$name}" . PHP_EOL);
                  exit(1);
              }
          }
          echo json_encode($changed, JSON_PRETTY_PRINT | JSON_THROW_ON_ERROR) . PHP_EOL;
          '

      - name: Smoke-test isolated tool
        run: php tools/slop-scan/slop-scan.php --help

      - name: Commit minimal lock and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-update-slop-scan-lock.yml
          git add tools/slop-scan/composer.lock
          git diff --cached --check
          git commit -m "chore(tools): minimize slop-scan 0.1.15 lock update"
          git push origin HEAD:chore/slop-scan-0.1.15
