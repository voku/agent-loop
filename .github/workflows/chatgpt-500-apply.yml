name: Apply #500 convergence fix

on:
  push:
    branches:
      - chatgpt/500-finish-validation-convergence
    paths:
      - '.github/workflows/chatgpt-500-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/500-finish-validation-convergence
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Apply bounded finish reconciliation patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/Workflow/HostFrontDoorCommand.php')
          text = path.read_text()
          old = """                if ($policy->mutationAllowed) {
                    [$contract, $run, $session] = $this->currentRunContext($taskId->value);
                    (new WorkflowValidationRunner($this->rootPath))->run($contract, $run, $session);
"""
          new = """                if ($policy->mutationAllowed || $this->needsValidationReconciliation($manifest)) {
                    [$contract, $run, $session] = $this->currentRunContext($taskId->value);
                    (new WorkflowValidationRunner($this->rootPath))->run($contract, $run, $session);
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one finish validation condition, found {text.count(old)}')
          text = text.replace(old, new)

          marker = """    private function needsPreparation(RunManifest $manifest): bool
    {
"""
          helper = """    private function needsValidationReconciliation(RunManifest $manifest): bool
    {
        if (!$this->hasCurrentFinishBoundary($manifest)) {
            return false;
        }

        $verification = $manifest->references['verification'] ?? [];

        return ($verification['state'] ?? null) === 'blocked'
            && ($verification['gate'] ?? null) === 'validation'
            && ($verification['validation_failed'] ?? false) !== true;
    }

"""
          if text.count(marker) != 1:
              raise SystemExit(f'expected one needsPreparation marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker)
          path.write_text(text)
          PY
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prove focused convergence regression
        run: vendor/bin/phpunit tests/WorkflowFinishValidationConvergenceTest.php tests/WorkflowFinishValidationTest.php
      - name: Remove temporary workflow and commit verified patch
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-500-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add src/Workflow/HostFrontDoorCommand.php .github/workflows/chatgpt-500-apply.yml
          git commit -m 'fix(workflow): reconcile validation before review handoff'
          git push origin HEAD:chatgpt/500-finish-validation-convergence
