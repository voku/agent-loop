name: E2.0 native diagnostic baselines

on:
  pull_request:
    paths:
      - '.github/workflows/context-e2-0.yml'
      - 'tools/Dogfood/ContextSelection/e2-0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-baselines:
    name: Measure native views of the preserved original CI log
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record tool identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/e2-0
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          {
            echo "os: $(grep -E '^VERSION=' /etc/os-release)"
            echo "image: ${ImageVersion:-unknown}"
            echo "rg: $(rg --version | head -1)"
            echo "tail: $(tail --version | head -1)"
            echo "cat: $(cat --version | head -1)"
            echo "python: $(python3 --version)"
          } | tee build/e2-0/tool-identities.txt

      - name: Screen preserved log for secret-bearing data
        shell: bash
        run: |
          set -euo pipefail
          log=tools/Dogfood/ContextSelection/e2-0/source/pre-fix-job-114202180131.log
          if grep -n -E 'gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY|password[=:]' "$log"; then
            echo 'secret-like pattern found'; exit 1
          fi
          echo "masked_value_lines=$(grep -c '\*\*\*' "$log")" | tee build/e2-0/secret-screen.txt
          echo 'secret_like_patterns_found=0' | tee -a build/e2-0/secret-screen.txt

      - name: Run predeclared native baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/Dogfood/ContextSelection/e2-0/run_native_baselines.py \
            tools/Dogfood/ContextSelection/e2-0 build/e2-0 | tee build/e2-0/summary.txt

      - name: Bind report to exact head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f build/e2-0/e2-0-native-baselines.json || exit 0
          jq --arg head "${PROOF_HEAD_SHA}" --arg merge "${GITHUB_SHA}" --arg run "${GITHUB_RUN_ID}" \
            '. + {harness_pr_head_sha: $head, pull_request_merge_ref_sha_not_source_under_test: $merge, run_id: $run}' \
            build/e2-0/e2-0-native-baselines.json > build/e2-0/report.tmp
          mv build/e2-0/report.tmp build/e2-0/e2-0-native-baselines.json
        env:
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2-0-native-baselines-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            build/e2-0/e2-0-native-baselines.json
            build/e2-0/summary.txt
            build/e2-0/tool-identities.txt
            build/e2-0/secret-screen.txt
            build/e2-0/orig.log
            build/e2-0/outputs/

      - name: Fail unless harness invariants held
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .invariants_ok build/e2-0/e2-0-native-baselines.json)" = "true" || {
            jq .invariants build/e2-0/e2-0-native-baselines.json; exit 1; }
