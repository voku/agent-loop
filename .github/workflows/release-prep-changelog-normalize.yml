name: Release prep changelog normalization

on:
  push:
    branches:
      - release/0.20.7-prepare

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild changelog from exact release base
        env:
          BASE_SHA: 9f4de4d3caeb73c212f70223b953a529464f3f4b
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base_sha = os.environ['BASE_SHA']
          original = subprocess.check_output(['git', 'show', f'{base_sha}:CHANGELOG.md'])
          anchor = b'All notable changes to this project will be documented in this file.\n\n'
          section = b'''## 0.20.7 - 2026-09-13\n\n### Added\n\n- Persist the first real Learning-owned closed-loop precedent in the repository's durable Learning root, keeping the behavioral handoff honest: selection into future Recall context is evidence of exposure, not proof that a later coding agent used the lesson.\n- Add `CurrentExecutionStageReader` / `CurrentExecutionStageProjection` as a narrow read boundary for the exact persisted current execution stage. The projection binds task, Run, Contract revision, execution-plan digest, stage, attempt and candidate revision before exposing stage kind and role, and fails closed on stale plan/state identity.\n- Recommend and probe `jq` alongside `rg` in the existing system-tool setup path without making either tool a package-managed dependency.\n\n### Changed\n\n- Materialize the current ready L1 through the Loop-owned execution-contract store and consume that owner result from both execution preparation and ordinary bounded workflow context, keeping L2 construction evidence separate from the exact executable L1.\n- Compile the repeated in-process PHPStan rule-test-case lesson into an active deterministic constraint, retain its Learning provenance, and retire the superseded soft guidance once enforcement is present.\n- Raise the released owner floor to `voku/agent-learning ^0.18.8` and `voku/agent-recall-compiler ^0.17.6`, and allow the released `voku/agent-map ^0.13.0` line beside the maintained compatibility lines.\n\n### Fixed\n\n- Advance the Recall-outcome gate before advertising the later Learning decision, so the canonical finish action addresses the actual unsatisfied blocker instead of skipping ahead.\n- Generalize blocked recovery convergence: when a blocked lifecycle would otherwise advertise read-only status/manifest inspection as the canonical next action, preserve the existing blocker evidence and project actionable host work instead.\n- Keep the PHPStan 2.2.14 test suite analyzable without suppressions by representing shared callback lock state as explicit mutable test state instead of by-reference scalar variables that the analyzer can constant-fold.\n\n'''

          if original.count(anchor) != 1:
              raise SystemExit('expected changelog anchor exactly once')
          if b'## 0.20.7 - 2026-09-13' in original:
              raise SystemExit('release base unexpectedly already contains 0.20.7')

          expected = original.replace(anchor, anchor + section, 1)
          Path('CHANGELOG.md').write_bytes(expected)
          PY

      - name: Remove one-shot workflow and verify final tree scope
        env:
          BASE_SHA: 9f4de4d3caeb73c212f70223b953a529464f3f4b
        run: |
          rm .github/workflows/release-prep-changelog-normalize.yml
          git add -A
          changed="$(git diff --cached --name-only "$BASE_SHA")"
          test "$changed" = "CHANGELOG.md"
          git diff --cached --check

      - name: Commit exact release-prep tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(release): preserve historical changelog bytes"
          git push origin HEAD:release/0.20.7-prepare
