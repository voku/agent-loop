name: Temporary composer gate diagnostic

on:
  pull_request:

jobs:
  composer-gate-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Capture composer ci result
        shell: bash
        run: |
          set +e
          mkdir -p build
          composer ci > build/composer-ci-diagnostic.txt 2>&1
          status=$?
          printf '\nEXIT_CODE=%s\n' "$status" >> build/composer-ci-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: composer-ci-diagnostic-${{ github.sha }}
          if-no-files-found: error
          path: build/composer-ci-diagnostic.txt
