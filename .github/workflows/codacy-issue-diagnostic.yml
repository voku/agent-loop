name: Codacy issue evidence diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/codacy-issue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-public-findings:
    name: Read Codacy public PR issue details (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve Codacy PR issue details without credentials
        shell: bash
        run: |
          set -euo pipefail
          for pr in 948 951; do
            printf '\n=== Codacy PR #%s (public API) ===\n' "$pr"
            url="https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/${pr}/issues?limit=100"
            response="$(mktemp)"
            status="$(curl --location --silent --show-error --max-time 20 --output "$response" --write-out '%{http_code}' "$url" || true)"
            printf 'HTTP_STATUS=%s\n' "$status"
            if [[ "$status" == "200" ]]; then
              jq -c '.data // .issues // . | if type == "array" then .[] else . end' "$response" | head -c 24000 || true
              printf '\n'
            else
              head -c 2000 "$response" || true
              printf '\n'
            fi
            rm -f "$response"
          done
