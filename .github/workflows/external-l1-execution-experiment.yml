name: External L1 execution experiment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

jobs:
  execute-returned-l1:
    if: >-
      github.event.issue.pull_request != null
      && github.event.comment.user.login == github.repository_owner
      && startsWith(github.event.comment.body, 'AGENT_LOOP_EXTERNAL_L1_EXECUTE ')
    name: Execute owner-authorized returned L1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXECUTION_DIR: /tmp/agent-loop-external-l1-execution-${{ github.run_id }}
      TASK_ID: EXTERNAL-L1-HANDOFF
      SOURCE: tests/fixtures/self-shape/SelfEditProbe.php
      TARGET: 'voku\AgentLoop\Tests\Fixtures\SelfShape\SelfEditProbe::value'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Parse explicit owner execution request
        run: >-
          php tools/external-l1-execution-experiment.php parse-comment
          --event="${GITHUB_EVENT_PATH}"
          --output-dir="${EXECUTION_DIR}"

      - name: Read return proof identity
        id: returned
        shell: bash
        run: |
          set -euo pipefail
          return_run_id="$(jq -r '.return_run_id' "${EXECUTION_DIR}/request.json")"
          return_attempt="$(jq -r '.return_run_attempt' "${EXECUTION_DIR}/request.json")"
          return_artifact="$(jq -r '.return_artifact_name' "${EXECUTION_DIR}/request.json")"

          printf 'run_id=%s\n' "${return_run_id}" >> "${GITHUB_OUTPUT}"
          printf 'attempt=%s\n' "${return_attempt}" >> "${GITHUB_OUTPUT}"
          printf 'artifact=%s\n' "${return_artifact}" >> "${GITHUB_OUTPUT}"

      - name: Download exact successful L1 return proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${EXECUTION_DIR}/returned"
          gh run download "${{ steps.returned.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${{ steps.returned.outputs.artifact }}" \
            --dir "${EXECUTION_DIR}/returned"

      - name: Verify returned L1 proof and resolve original handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          request="${EXECUTION_DIR}/request.json"
          returned="${EXECUTION_DIR}/returned"
          proof="${returned}/proof.json"
          returned_meta="${returned}/return.json"
          l1="${returned}/l1.md"

          test -s "${proof}"
          test -s "${returned_meta}"
          test -s "${l1}"

          expected_pr="$(jq -r '.pull_request_number' "${request}")"
          actual_pr="$(jq -r '.pull_request_number' "${returned_meta}")"
          test "${actual_pr}" = "${expected_pr}"

          jq -e '
            (.schema_version == "1.0")
            and (.kind == "external_l1_return_proof")
            and (.execution_contract_state == "ready")
            and (.mutation_allowed == true)
            and (.result == "passed")
          ' "${proof}" >/dev/null

          l1_sha="sha256:$(sha256sum "${l1}" | awk '{print $1}')"
          test "${l1_sha}" = "$(jq -r '.l1_sha256' "${proof}")"
          test "${l1_sha}" = "$(jq -r '.l1_sha256' "${returned_meta}")"

          handoff_run_id="$(jq -r '.handoff_run_id' "${proof}")"
          handoff_attempt="$(jq -r '.handoff_run_attempt' "${proof}")"
          test "${handoff_run_id}" = "$(jq -r '.run_id' "${returned_meta}")"
          test "${handoff_attempt}" = "$(jq -r '.run_attempt' "${returned_meta}")"

          handoff_artifact="external-l1-handoff-${handoff_run_id}-${handoff_attempt}"

          printf 'run_id=%s\n' "${handoff_run_id}" >> "${GITHUB_OUTPUT}"
          printf 'attempt=%s\n' "${handoff_attempt}" >> "${GITHUB_OUTPUT}"
          printf 'artifact=%s\n' "${handoff_artifact}" >> "${GITHUB_OUTPUT}"
          printf 'l1_sha256=%s\n' "${l1_sha}" >> "${GITHUB_OUTPUT}"

      - name: Download exact original prepared handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${EXECUTION_DIR}/handoff"
          gh run download "${{ steps.handoff.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${{ steps.handoff.outputs.artifact }}" \
            --dir "${EXECUTION_DIR}/handoff"

      - name: Restore the exact governed state
        shell: bash
        run: |
          set -euo pipefail
          handoff="${EXECUTION_DIR}/handoff/handoff.json"
          prepared="${EXECUTION_DIR}/handoff/prepared-state.tar.gz"
          proof="${EXECUTION_DIR}/returned/proof.json"

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${{ steps.handoff.outputs.run_id }}" \
            --arg run_attempt "${{ steps.handoff.outputs.attempt }}" \
            --arg artifact "${{ steps.handoff.outputs.artifact }}" '
              (.schema_version == "1.0")
              and (.kind == "external_l1_construction_handoff")
              and (.repository == $repository)
              and (.github.run_id == $run_id)
              and (.github.run_attempt == $run_attempt)
              and (.github.artifact_name == $artifact)
              and (.state.execution_contract_state == "missing")
              and (.state.mutation_allowed == false)
              and (.resume.requires_prepared_state == true)
          ' "${handoff}" >/dev/null

          base_commit="$(jq -r '.base_commit' "${handoff}")"
          test "${base_commit}" = "$(jq -r '.base_commit' "${proof}")"
          [[ "${base_commit}" =~ ^[a-f0-9]{40}$ ]]

          expected_prepared_sha="$(jq -r '.resume.prepared_state_sha256' "${handoff}")"
          actual_prepared_sha="sha256:$(sha256sum "${prepared}" | awk '{print $1}')"
          test "${actual_prepared_sha}" = "${expected_prepared_sha}"

          git cat-file -e "${base_commit}^{commit}" 2>/dev/null || git fetch --no-tags origin "${base_commit}"
          git checkout --detach "${base_commit}"
          test "$(git rev-parse HEAD)" = "${base_commit}"

          rm -rf .agent-loop
          tar -xzf "${prepared}" -C .
          test -d .agent-loop

          printf '%s\n' "${base_commit}" > "${EXECUTION_DIR}/base-commit.txt"

      - name: Install dependencies at the governed base
        run: composer install --no-interaction --prefer-dist

      - name: Rebind the exact returned L1
        shell: bash
        run: |
          set -euo pipefail
          l1="${EXECUTION_DIR}/returned/l1.md"

          test "sha256:$(sha256sum "${l1}" | awk '{print $1}')" = "${{ steps.handoff.outputs.l1_sha256 }}"

          php bin/agent-loop workflow contract "${TASK_ID}" \
            --status ready \
            --from "${l1}" \
            --by external-l1-constructor

          php bin/agent-loop workflow status "${TASK_ID}" --format=json \
            > "${EXECUTION_DIR}/status-before-execution.json"

          jq -e '
            (.manifest.references.execution_contract.state == "ready")
            and (.policy.mutation_allowed == true)
            and (.policy.next_action_kind == "host_work")
          ' "${EXECUTION_DIR}/status-before-execution.json" >/dev/null

      - name: Execute only the bounded mechanical fixture edit
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'return 100 + $input;' "${SOURCE}"
          ! grep -Fq 'return 101 + $input;' "${SOURCE}"

          php bin/agent-loop edit "${TARGET}" \
            --task="${TASK_ID}" \
            --map-paths=tests/fixtures/self-shape \
            --phpstan-memory-limit=512M \
            --runner=mechanical \
            '--replace-old=return 100 + $input;' \
            '--replace-new=return 101 + $input;' \
            -- \
            'Execute only the owner-bound returned L1 contract.'

      - name: Deterministically verify execution
        shell: bash
        run: |
          set -euo pipefail

          php -l "${SOURCE}"
          vendor/bin/phpunit tests/ExecutionContractStoreTest.php

          ! grep -Fq 'return 100 + $input;' "${SOURCE}"
          test "$(grep -Fc 'return 101 + $input;' "${SOURCE}")" = "1"

          mapfile -t changed_paths < <(git diff --name-only)
          test "${#changed_paths[@]}" = "1"
          test "${changed_paths[0]}" = "${SOURCE}"

          git diff -- "${SOURCE}" > "${EXECUTION_DIR}/implementation.diff"
          cp "${SOURCE}" "${EXECUTION_DIR}/source-after.php"

          php bin/agent-loop workflow status "${TASK_ID}" --format=json \
            > "${EXECUTION_DIR}/status-after-execution.json"

          jq -n \
            --arg task_id "${TASK_ID}" \
            --arg return_run_id "${{ steps.returned.outputs.run_id }}" \
            --arg return_run_attempt "${{ steps.returned.outputs.attempt }}" \
            --arg handoff_run_id "${{ steps.handoff.outputs.run_id }}" \
            --arg handoff_run_attempt "${{ steps.handoff.outputs.attempt }}" \
            --arg base_commit "$(cat "${EXECUTION_DIR}/base-commit.txt")" \
            --arg l1_sha256 "${{ steps.handoff.outputs.l1_sha256 }}" \
            --arg source "${SOURCE}" \
            --arg source_sha256 "sha256:$(sha256sum "${SOURCE}" | awk '{print $1}')" \
            --argjson source_comment_id "$(jq '.comment_id' "${EXECUTION_DIR}/request.json")" '{
              schema_version: "1.0",
              kind: "external_l1_execution_proof",
              task_id: $task_id,
              source_comment_id: $source_comment_id,
              return_run_id: $return_run_id,
              return_run_attempt: $return_run_attempt,
              handoff_run_id: $handoff_run_id,
              handoff_run_attempt: $handoff_run_attempt,
              base_commit: $base_commit,
              l1_sha256: $l1_sha256,
              changed_paths: [$source],
              source_after_sha256: $source_sha256,
              php_lint_exit: 0,
              phpunit_exit: 0,
              result: "passed"
            }' > "${EXECUTION_DIR}/proof.json"

      - name: Reconcile owner validation and stop at review boundary
        shell: bash
        run: |
          set -euo pipefail

          set +e
          php bin/agent-loop finish "${TASK_ID}" --format=json \
            > "${EXECUTION_DIR}/finish.json"
          finish_exit=$?
          set -e

          test "${finish_exit}" = "1"

          jq -e \
            --arg task_id "${TASK_ID}" '
              (.schema_version == "1.0")
              and (.command == "finish")
              and (.task_id == $task_id)
              and (.complete == false)
              and (.manifest.references.verification.state == "blocked")
              and (.manifest.references.verification.gate == "review")
              and (.manifest.references.review.state == "unacknowledged")
              and (.next_action_kind == "command_template")
              and (.next_action | startswith("agent-loop finish " + $task_id + " --reviewed-report-sha256 sha256:"))
              and (.next_action | contains("--by <actor>"))
            ' "${EXECUTION_DIR}/finish.json" >/dev/null

          jq \
            --argjson finish_exit "${finish_exit}" \
            --arg verification_state "$(jq -r '.manifest.references.verification.state' "${EXECUTION_DIR}/finish.json")" \
            --arg verification_gate "$(jq -r '.manifest.references.verification.gate' "${EXECUTION_DIR}/finish.json")" \
            --arg review_state "$(jq -r '.manifest.references.review.state' "${EXECUTION_DIR}/finish.json")" \
            --arg next_action_kind "$(jq -r '.next_action_kind' "${EXECUTION_DIR}/finish.json")" \
            --arg next_action "$(jq -r '.next_action' "${EXECUTION_DIR}/finish.json")" '
              . + {
                owner_finish: {
                  exit_code: $finish_exit,
                  complete: false,
                  verification_state: $verification_state,
                  verification_gate: $verification_gate,
                  review_state: $review_state,
                  next_action_kind: $next_action_kind,
                  next_action: $next_action
                }
              }
            ' "${EXECUTION_DIR}/proof.json" \
            > "${EXECUTION_DIR}/proof.json.tmp"
          mv "${EXECUTION_DIR}/proof.json.tmp" "${EXECUTION_DIR}/proof.json"

      - name: Upload execution proof
        uses: actions/upload-artifact@v4
        with:
          name: external-l1-execution-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.EXECUTION_DIR }}/request.json
            ${{ env.EXECUTION_DIR }}/returned/proof.json
            ${{ env.EXECUTION_DIR }}/returned/return.json
            ${{ env.EXECUTION_DIR }}/returned/l1.md
            ${{ env.EXECUTION_DIR }}/handoff/handoff.json
            ${{ env.EXECUTION_DIR }}/status-before-execution.json
            ${{ env.EXECUTION_DIR }}/status-after-execution.json
            ${{ env.EXECUTION_DIR }}/finish.json
            ${{ env.EXECUTION_DIR }}/implementation.diff
            ${{ env.EXECUTION_DIR }}/source-after.php
            ${{ env.EXECUTION_DIR }}/proof.json
