name: Temporary init apply quality diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/init-apply-quality-temp.yml'
permissions:
  contents: read
jobs:
  findings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve exact public Codacy delta
        shell: bash
        run: |
          set -euo pipefail
          file="$(mktemp)"
          curl --fail-with-body -sSL --max-time 25 -o "$file" 'https://api.codacy.com/api/v3/analysis/organizations/gh/voku/repositories/agent-loop/pull-requests/970/issues?limit=100'
          jq -c '{analyzed:.analyzed, added:[.data[] | select(.deltaType=="Added") | .commitIssue | {path:.filePath,line:.lineNumber,rule:.patternInfo.id,severity:.patternInfo.severityLevel,message:.message}]}' "$file"
          rm -f "$file"
