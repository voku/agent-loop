name: Prepare 0.15.2 changelog

on:
  push:
    branches:
      - agent/release-0.15.2

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare changelog-only release diff
        shell: bash
        env:
          RELEASE_SECTION_B64: 
        run: |
          set -euo pipefail
          python -c 'import base64, os; from pathlib import Path; p=Path("CHANGELOG.md"); text=p.read_text(); marker="## Unreleased\n"; assert marker in text; assert "## 0.15.2 - " not in text; section=base64.b64decode(os.environ["RELEASE_SECTION_B64"]).decode(); p.write_text(text.replace(marker, marker + "\n" + section, 1))'
          rm .github/workflows/prepare-release-0.15.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-release-0.15.2.yml
          git diff --cached --check
          git commit -m 'Prepare agent-loop 0.15.2'
          git push origin HEAD:agent/release-0.15.2
