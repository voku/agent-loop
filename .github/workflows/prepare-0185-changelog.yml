name: Prepare 0.18.5 changelog

on:
  push:
    branches:
      - 'release/0.18.5'

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: run 0.18.5 changelog preparer' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Freeze Unreleased as 0.18.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          data = path.read_bytes()
          needle = b'## Unreleased\n'
          replacement = b'## 0.18.5 - 2026-09-01\n'
          if data.count(needle) != 1:
              raise SystemExit(f'expected exactly one Unreleased header, found {data.count(needle)}')
          path.write_bytes(data.replace(needle, replacement, 1))
          PY
          git diff --check -- CHANGELOG.md
          test "$(git diff --name-only | tr '\n' ' ')" = 'CHANGELOG.md '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'release: prepare 0.18.5'
          git push origin "HEAD:${GITHUB_REF_NAME}"
