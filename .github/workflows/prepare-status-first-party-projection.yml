name: Prepare status first-party projection fix

on:
  push:
    branches: [agent/status-first-party-projection]
    paths:
      - '.github/workflows/prepare-status-first-party-projection.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/status-first-party-projection
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Apply narrow source and replay regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/Init/InitStatusCommand.php')
          text = source.read_text()
          needle = "        $managedEntryCount = count($manifest->managedEntries());\n"
          replacement = "        $desiredEntries = $this->includeInstalledFirstPartyEntries($manifest, $desiredEntries);\n\n" + needle
          if text.count(needle) != 1:
              raise SystemExit('status insertion anchor not unique')
          text = text.replace(needle, replacement, 1)

          method_anchor = "    /**\n     * @param list<string>|null $desiredEntries\n     * @return list<string>\n     */\n    private function unmanagedTargetLines"
          method = '''    /**
     * Package-owned v2 projections carry their current source identity in the
     * manifest. An installed consumer does not need to duplicate those package
     * sources under its own docs/agents tree just to keep status truthful.
     *
     * @param list<string>|null $desiredEntries
     * @return list<string>|null
     */
    private function includeInstalledFirstPartyEntries(InitSyncManifest $manifest, ?array $desiredEntries): ?array
    {
        if ($desiredEntries === null || !$manifest->hasDriftEvidence()) {
            return $desiredEntries;
        }

        foreach ($manifest->managedEntries() as $entry) {
            $metadata = $manifest->entry($entry);
            if ($metadata === null
                || !in_array($metadata['semantic_owner'], ['voku/agent-loop', 'voku/agent-recall-compiler'], true)
                || $metadata['source_path'] === null
                || InitSyncManifest::digestPath($metadata['source_path']) === null
            ) {
                continue;
            }

            $desiredEntries[] = $entry;
        }

        $desiredEntries = array_values(array_unique($desiredEntries));
        sort($desiredEntries, SORT_STRING);

        return $desiredEntries;
    }

'''
          if text.count(method_anchor) != 1:
              raise SystemExit('status method anchor not unique')
          text = text.replace(method_anchor, method + method_anchor, 1)
          source.write_text(text)

          test = Path('tests/InitStatusCommandTest.php')
          text = test.read_text()
          use_needle = "use voku\\AgentLoop\\Init\\InitStatusCommand;\n"
          if text.count(use_needle) != 1:
              raise SystemExit('test import anchor not unique')
          text = text.replace(use_needle, "use voku\\AgentLoop\\Init\\InitInstallAssetsCommand;\n" + use_needle, 1)

          test_anchor = "    public function testStatusDistinguishesCurrentLocalModificationAndStaleSource(): void\n"
          test_method = '''    public function testStatusKeepsInstalledFirstPartyProjectionCurrentWithoutHostSourceTree(): void
    {
        ob_start();
        $exit = (new InitInstallAssetsCommand($this->root))->run([
            '--agent=claude',
            '--skip-git-config',
        ]);
        $installOutput = (string) ob_get_clean();

        self::assertSame(0, $exit, $installOutput);

        $output = $this->runStatus([])['output'];
        self::assertStringContainsString('[OK] claude skills: current:', $output);
        self::assertStringContainsString('agent-loop-task-start', $output);
        self::assertStringContainsString('[OK] claude subagents: current:', $output);
        self::assertStringContainsString('agent-loop-code-reviewer.md', $output);
        self::assertStringContainsString('[OK] claude hooks: current:', $output);
        self::assertStringContainsString('hooks/runtime.php', $output);
        self::assertStringNotContainsString('[WARN] claude skills: stale managed entries', $output);
        self::assertStringNotContainsString('[WARN] claude subagents: stale managed entries', $output);
        self::assertStringNotContainsString('[WARN] claude hooks: stale managed entries', $output);
    }

'''
          if text.count(test_anchor) != 1:
              raise SystemExit('test method anchor not unique')
          text = text.replace(test_anchor, test_method + test_anchor, 1)
          test.write_text(text)
          PY

          composer install --no-interaction --prefer-dist
          vendor/bin/phpunit --filter 'InitStatusCommandTest'
          git diff --check
          mkdir -p build/status-first-party-projection/src/Init build/status-first-party-projection/tests
          cp src/Init/InitStatusCommand.php build/status-first-party-projection/src/Init/InitStatusCommand.php
          cp tests/InitStatusCommandTest.php build/status-first-party-projection/tests/InitStatusCommandTest.php
          git diff -- src/Init/InitStatusCommand.php tests/InitStatusCommandTest.php > build/status-first-party-projection/change.patch

      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: status-first-party-projection
          path: build/status-first-party-projection
          if-no-files-found: error
