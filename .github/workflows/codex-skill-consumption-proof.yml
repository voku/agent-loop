name: Codex skill consumption proof

on:
  pull_request:
    paths:
      - '.github/workflows/codex-skill-consumption-proof.yml'
      - 'resources/skills/agent-loop-workflow/**'
      - 'src/Init/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    name: Codex 0.157.0 explicit skill consumption
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_VERSION: '0.157.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout pinned first-party interaction skills
        uses: actions/checkout@v6
        with:
          repository: voku/agent-skills
          ref: c9e3b2966dc462c3ae9e9758f8bd39e0e85e7bf8
          path: build/agent-skills-source
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install repository dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install exact Codex runtime
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_NON_INTERACTIVE=1
          export CODEX_INSTALL_DIR="${RUNNER_TEMP}/codex-bin"
          export CODEX_HOME="${RUNNER_TEMP}/codex-install-home"
          curl -fsSL https://chatgpt.com/codex/install.sh |
            sh -s -- --release "${CODEX_VERSION}"
          echo "${CODEX_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Project disposable Codex repository
        shell: bash
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/agent-loop-codex-skill-proof"
          runtime_home="${RUNNER_TEMP}/codex-skill-runtime-home"
          evidence_root="${GITHUB_WORKSPACE}/build/codex-skill-consumption-proof"

          rm -rf "${proof_root}" "${runtime_home}" "${evidence_root}"
          mkdir -p "${proof_root}" "${runtime_home}" "${evidence_root}"
          git -C "${proof_root}" init --initial-branch=main

          (
            cd "${proof_root}"
            "${GITHUB_WORKSPACE}/bin/agent-loop" init scaffold --demo --agent=codex
            "${GITHUB_WORKSPACE}/bin/agent-loop" init install-assets --agent=codex \
              --extra-skills-root="${GITHUB_WORKSPACE}/build/agent-skills-source/skills"
          )

          workflow_skill="${proof_root}/.codex/skills/agent-loop-workflow/SKILL.md"
          interview_skill="${proof_root}/.codex/skills/requirements-interview/SKILL.md"
          repair_skill="${proof_root}/.codex/skills/review-feedback-repair/SKILL.md"

          test -f "${workflow_skill}"
          test -f "${interview_skill}"
          test -f "${repair_skill}"
          grep -Fq 'This is the implementation front door.' "${workflow_skill}"
          grep -Fq 'Turn an ambiguous feature or engineering request into an implementation-ready contract without starting implementation.' "${interview_skill}"
          grep -Fq 'Turn current review feedback and failing validation into bounded repair work without surrendering engineering judgment.' "${repair_skill}"

          cat > "${runtime_home}/config.toml" <<EOF
          [projects."${proof_root}"]
          trust_level = "trusted"
          EOF

          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "${evidence_root}/repository-head-sha.txt"
          git -C "${GITHUB_WORKSPACE}/build/agent-skills-source" rev-parse HEAD > "${evidence_root}/agent-skills-head-sha.txt"
          sha256sum "${GITHUB_WORKSPACE}/composer.lock" | cut -d' ' -f1 > "${evidence_root}/dependency-graph.sha256"
          sha256sum "${workflow_skill}" | cut -d' ' -f1 > "${evidence_root}/projected-agent-loop-workflow.sha256"
          sha256sum "${interview_skill}" | cut -d' ' -f1 > "${evidence_root}/projected-requirements-interview.sha256"
          sha256sum "${repair_skill}" | cut -d' ' -f1 > "${evidence_root}/projected-review-feedback-repair.sha256"

          echo "PROOF_ROOT=${proof_root}" >> "${GITHUB_ENV}"
          echo "CODEX_HOME=${runtime_home}" >> "${GITHUB_ENV}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"

      - name: Prove selected skill body reaches runtime request
        shell: bash
        env:
          OPENAI_API_KEY: ''
          CODEX_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          codex --version | tee "${EVIDENCE_ROOT}/codex-version.txt"

          run_arm() {
            local arm="$1"
            local prompt="$2"
            local server_script="${RUNNER_TEMP}/codex-skill-${arm}-server.py"
            local port_path="${RUNNER_TEMP}/codex-skill-${arm}-port"
            local request_path="${EVIDENCE_ROOT}/${arm}-request.json"
            local arm_home="${RUNNER_TEMP}/codex-skill-${arm}-home"

            rm -f "${port_path}" "${request_path}"
            rm -rf "${arm_home}"
            mkdir -p "${arm_home}"
            cp "${CODEX_HOME}/config.toml" "${arm_home}/config.toml"

            cat > "${server_script}" <<'PY'
          import http.server
          import json
          import os

          port_path = os.environ["PORT_PATH"]
          request_path = os.environ["REQUEST_PATH"]

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length)
                  if not os.path.exists(request_path):
                      with open(request_path, "wb") as handle:
                          handle.write(body)

                  events = [
                      {"type": "response.created", "response": {"id": "resp-skill-proof"}},
                      {
                          "type": "response.completed",
                          "response": {
                              "id": "resp-skill-proof",
                              "usage": {
                                  "input_tokens": 0,
                                  "input_tokens_details": None,
                                  "output_tokens": 0,
                                  "output_tokens_details": None,
                                  "total_tokens": 0,
                              },
                          },
                      },
                  ]
                  payload = "".join(
                      f"event: {event['type']}\ndata: {json.dumps(event)}\n\n"
                      for event in events
                  ).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          server.serve_forever()
          PY

            PORT_PATH="${port_path}" REQUEST_PATH="${request_path}" python3 "${server_script}" &
            local server_pid=$!
            trap 'kill '"${server_pid}"' 2>/dev/null || true' RETURN

            for _ in $(seq 1 100); do
              test -s "${port_path}" && break
              sleep 0.05
            done
            test -s "${port_path}"
            local port
            port="$(cat "${port_path}")"

            (
              cd "${PROOF_ROOT}"
              env -u OPENAI_API_KEY -u CODEX_ACCESS_TOKEN \
                CODEX_HOME="${arm_home}" \
                codex exec --ephemeral --json \
                  -c 'model="proof-model"' \
                  -c 'model_provider="mock"' \
                  -c "model_providers.mock={ name = \"mock\", base_url = \"http://127.0.0.1:${port}/v1\", env_key = \"PATH\", wire_api = \"responses\" }" \
                  "${prompt}"
            ) > "${EVIDENCE_ROOT}/${arm}-exec.jsonl" 2> "${EVIDENCE_ROOT}/${arm}-exec.stderr"

            kill "${server_pid}" 2>/dev/null || true
            wait "${server_pid}" 2>/dev/null || true
            trap - RETURN
            test -s "${request_path}"
          }

          run_arm baseline 'Inspect this repository and report the current branch.'
          run_arm workflow '$agent-loop-workflow Handle governed task PROOF-1.'
          run_arm interview '$requirements-interview Clarify the ambiguous task: Improve the workflow. Do not implement.'
          run_arm repair '$review-feedback-repair Address current review feedback for governed task PROOF-1.'

          python3 - \
            "${EVIDENCE_ROOT}/baseline-request.json" \
            "${EVIDENCE_ROOT}/workflow-request.json" \
            "${EVIDENCE_ROOT}/interview-request.json" \
            "${EVIDENCE_ROOT}/repair-request.json" \
            "${EVIDENCE_ROOT}/skill-consumption.json" <<'PY'
          import json
          import sys

          markers = {
              "agent-loop-workflow": "This is the implementation front door.",
              "requirements-interview": (
                  "Turn an ambiguous feature or engineering request into an implementation-ready "
                  "contract without starting implementation."
              ),
              "review-feedback-repair": (
                  "Turn current review feedback and failing validation into bounded repair work "
                  "without surrendering engineering judgment."
              ),
          }
          arms = {
              "baseline": sys.argv[1],
              "agent-loop-workflow": sys.argv[2],
              "requirements-interview": sys.argv[3],
              "review-feedback-repair": sys.argv[4],
          }

          def flatten(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, list):
                  for item in value:
                      yield from flatten(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from flatten(item)

          def counts(path):
              with open(path, "r", encoding="utf-8") as handle:
                  payload = json.load(handle)
              text = "\n".join(flatten(payload))
              return {skill: text.count(marker) for skill, marker in markers.items()}

          observed = {arm: counts(path) for arm, path in arms.items()}
          expected = {
              "baseline": {skill: 0 for skill in markers},
              "agent-loop-workflow": {
                  "agent-loop-workflow": 1,
                  "requirements-interview": 0,
                  "review-feedback-repair": 0,
              },
              "requirements-interview": {
                  "agent-loop-workflow": 0,
                  "requirements-interview": 1,
                  "review-feedback-repair": 0,
              },
              "review-feedback-repair": {
                  "agent-loop-workflow": 0,
                  "requirements-interview": 0,
                  "review-feedback-repair": 1,
              },
          }
          status = "observed" if observed == expected else "refuted"
          receipt = {
              "evidence_class": "host_runtime_skill_consumption",
              "runtime": "Codex 0.157.0",
              "selection": "explicit $skill mentions",
              "skills": list(markers),
              "marker_counts": observed,
              "expected_marker_counts": expected,
              "status": status,
              "boundary": (
                  "Proves Codex 0.157.0 loads each selected projected SKILL.md body into the "
                  "provider request for explicit skill selection, with no observed cross-loading "
                  "between these three markers. It does not prove implicit semantic routing, "
                  "model compliance with the skill body, end-to-end behavioral sequencing, "
                  "arbitrary skills, or other hosts."
              ),
          }
          with open(sys.argv[5], "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")

          if observed != expected:
              raise SystemExit(
                  "skill marker matrix mismatch: "
                  + json.dumps({"expected": expected, "observed": observed}, sort_keys=True)
              )
          PY

      - name: Record evidence identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d "${EVIDENCE_ROOT:-}"; then
            (cd "${EVIDENCE_ROOT}" && sha256sum ./* > SHA256SUMS)
          fi

      - name: Upload Codex skill-consumption evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-skill-consumption-proof-${{ github.sha }}
          if-no-files-found: error
          path: build/codex-skill-consumption-proof
