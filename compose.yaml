services:
  agent-loop:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-loop:local
    init: true
    user: "${AGENT_LOOP_UID:-1000}:${AGENT_LOOP_GID:-1000}"
    working_dir: /workspace/target
    volumes:
      - type: bind
        source: ${AGENT_LOOP_TARGET:-.}
        target: /workspace/target
